[package]
name = "riffdb-budget-comparison-riffdb-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
riffdb-budget-comparison-core = { path = "../core", version = "0.2.2" }
riffdb-client-rust = { path = "../../../crates/riffdb-client-rust", version = "0.2.2", default-features = false }
riffdb-proto = { path = "../../../crates/riffdb-proto", version = "0.2.2", default-features = false }
riffdb-types = { path = "../../../crates/riffdb-types", version = "0.2.2", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen"] }

[lints]
workspace = true
