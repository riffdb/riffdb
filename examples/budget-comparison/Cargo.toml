[package]
name = "riffdb-budget-comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[workspace]
resolver = "3"
# WP-045 established `members = ["core", "postgres"]`; WP-135 added the
# public-gRPC adapter, and WP-139 adds isolated safety evidence. Other in-tree
# path dependencies are implicit.
members = ["core", "postgres", "riffdb-grpc", "safety-evidence"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[dev-dependencies]
riffdb-bench-root = { path = "../../crates/riffdb-bench-root", version = "0.1.0", default-features = false }
riffdb-budget-comparison-core = { path = "core", version = "0.1.0" }
riffdb-budget-comparison-postgres = { path = "postgres", version = "0.1.0" }
riffdb-budget-comparison-riffdb-service = { path = "riffdb-service", version = "0.1.0" }
riffdb-auth = { path = "../../crates/riffdb-auth", version = "0.1.0", default-features = false }
riffdb-catalog = { path = "../../crates/riffdb-catalog", version = "0.1.0", default-features = false }
riffdb-client-rust = { path = "../../crates/riffdb-client-rust", version = "0.1.0", default-features = false }
riffdb-commit = { path = "../../crates/riffdb-commit", version = "0.1.0", default-features = false }
riffdb-conflict = { path = "../../crates/riffdb-conflict", version = "0.1.0", default-features = false }
riffdb-contract-compiler = { path = "../../crates/riffdb-contract-compiler", version = "0.1.0", default-features = false }
riffdb-contract-ir = { path = "../../crates/riffdb-contract-ir", version = "0.1.0", default-features = false }
riffdb-errors = { path = "../../crates/riffdb-errors", version = "0.1.0", default-features = false }
riffdb-idempotency = { path = "../../crates/riffdb-idempotency", version = "0.1.0", default-features = false }
riffdb-policy = { path = "../../crates/riffdb-policy", version = "0.1.0", default-features = false }
riffdb-projection = { path = "../../crates/riffdb-projection", version = "0.1.0", default-features = false }
riffdb-service = { path = "../../crates/riffdb-service", version = "0.1.0", default-features = false }
riffdb-storage-api = { path = "../../crates/riffdb-storage-api", version = "0.1.0", default-features = false }
riffdb-storage-redb = { path = "../../crates/riffdb-storage-redb", version = "0.1.0", default-features = false }
riffdb-testkit = { path = "../../crates/riffdb-testkit", version = "0.1.0", default-features = false }
riffdb-types = { path = "../../crates/riffdb-types", version = "0.1.0", default-features = false }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.52.0", default-features = false, features = ["rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen"] }

[[test]]
name = "postgres_oracle"
path = "tests/postgres_oracle.rs"

[[test]]
name = "postgres_isolation"
path = "tests/postgres_isolation.rs"

[[test]]
name = "postgres_live"
path = "tests/postgres_live.rs"

[[test]]
name = "service_comparison"
path = "tests/service_comparison.rs"

[[test]]
name = "public_comparison"
path = "tests/public_comparison.rs"

[[test]]
name = "safety_evidence"
path = "tests/safety_evidence.rs"

[[test]]
name = "safety_architecture"
path = "tests/safety_architecture.rs"

[lints]
workspace = true
