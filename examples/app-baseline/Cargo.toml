[package]
name = "riffdb-app-baseline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# Mirrors the root workspace's profiling profile so `benchmarks/profile-read-path`
# can build the daemon and this harness under one profile. Building them under
# different profiles links two versions of the storage crate, which fails in a
# way that looks like a real defect.
[profile.profiling]
inherits = "release"
debug = true
strip = false
# `-C force-frame-pointers` cannot live here: the `profile-rustflags` cargo
# feature is unstable in the pinned 1.97.0 toolchain. `benchmarks/profile-read-path`
# exports it via RUSTFLAGS instead, so `perf --call-graph fp` resolves. A build of
# this profile WITHOUT that variable gives symbols but empty fp call graphs; use
# `--call-graph dwarf` in that case.

[workspace]
resolver = "3"
members = ["core", "postgres", "riffdb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[dependencies]
riffdb-app-baseline-core = { path = "core", version = "0.1.0" }
riffdb-app-baseline-postgres = { path = "postgres", version = "0.1.0" }
riffdb-app-baseline-riffdb = { path = "riffdb", version = "0.1.0" }
riffdb-bench-root = { path = "../../crates/riffdb-bench-root", version = "0.1.0", default-features = false }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "riffdb-app-baseline"
path = "src/main.rs"

[[bin]]
name = "riffdb-app-baseline-python-bridge"
path = "src/bin/python_bridge.rs"

[[bin]]
name = "riffdb-client-transport-diagnostic"
path = "src/transport_diagnostic.rs"

[[test]]
name = "dead_peer_abort"
path = "tests/dead_peer_abort.rs"

[lints]
workspace = true
