[package]
name = "riffdb-app-baseline-riffdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
riffdb-app-baseline-core = { path = "../core", version = "0.1.0" }
riffdb-api-grpc = { path = "../../../crates/riffdb-api-grpc", version = "0.1.0", default-features = false, features = ["client"] }
riffdb-bench-root = { path = "../../../crates/riffdb-bench-root", version = "0.1.0", default-features = false }
riffdb-auth = { path = "../../../crates/riffdb-auth", version = "0.1.0", default-features = false }
riffdb-client-rust = { path = "../../../crates/riffdb-client-rust", version = "0.1.0", default-features = false, features = ["exclusive-diagnostic"] }
riffdb-contract-compiler = { path = "../../../crates/riffdb-contract-compiler", version = "0.1.0", default-features = false }
riffdb-contract-ir = { path = "../../../crates/riffdb-contract-ir", version = "0.1.0", default-features = false }
riffdb-proto = { path = "../../../crates/riffdb-proto", version = "0.1.0", default-features = false }
riffdb-query-module = { path = "../../../crates/riffdb-query-module", version = "0.1.0", default-features = false }
riffdb-storage-redb = { path = "../../../crates/riffdb-storage-redb", version = "0.1.0", default-features = false, features = ["benchmark-support"] }
riffdb-ticketdesk = { path = "../../ticketdesk", version = "0.1.0", default-features = false }
riffdb-types = { path = "../../../crates/riffdb-types", version = "0.1.0", default-features = false }
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen"] }

[lints]
workspace = true
