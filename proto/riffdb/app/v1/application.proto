syntax = "proto3";

package riffdb.app.v1;

import "riffdb/v1/value.proto";

// Exact contract selection. An absent selector requests the active contract.
message ContractSelector {
  string lineage = 1;
  uint64 version = 2;
  bytes bundle_hash = 3;
}

// One name-addressed typed parameter.
message Parameter {
  string name = 1;
  riffdb.v1.Value value = 2;
}

message SourceSpan {
  uint64 start = 1;
  uint64 end = 2;
}

// Closed application operation inventory. This is presentation context, never
// authority: the server still authorizes the actual service operation.
enum ApplicationOperation {
  APPLICATION_OPERATION_UNSPECIFIED = 0;
  APPLICATION_OPERATION_DESCRIBE_CONTRACT = 1;
  APPLICATION_OPERATION_CHECK_QUERY = 2;
  APPLICATION_OPERATION_EXPLAIN_QUERY = 3;
  APPLICATION_OPERATION_EXECUTE_QUERY = 4;
  APPLICATION_OPERATION_DEPLOY_QUERY_MODULE = 5;
  APPLICATION_OPERATION_GET_QUERY_MODULE = 6;
  APPLICATION_OPERATION_EXECUTE_COMMAND = 7;
  APPLICATION_OPERATION_BATCH_COMMAND = 8;
}

enum ApplicationErrorCode {
  APPLICATION_ERROR_CODE_UNSPECIFIED = 0;
  APPLICATION_ERROR_CODE_INVALID_REQUEST = 1;
  APPLICATION_ERROR_CODE_INPUT_INVALID = 2;
  APPLICATION_ERROR_CODE_AUTHORIZATION_DENIED = 3;
  APPLICATION_ERROR_CODE_CONTRACT_MISMATCH = 4;
  APPLICATION_ERROR_CODE_QUERY_INVALID = 5;
  APPLICATION_ERROR_CODE_QUERY_UNAVAILABLE = 6;
  APPLICATION_ERROR_CODE_MODULE_UNAVAILABLE = 7;
  APPLICATION_ERROR_CODE_CURSOR_INVALID = 8;
  APPLICATION_ERROR_CODE_RESPONSE_TOO_LARGE = 9;
  APPLICATION_ERROR_CODE_STORAGE_UNAVAILABLE = 10;
  APPLICATION_ERROR_CODE_OUTCOME_UNKNOWN = 11;
  APPLICATION_ERROR_CODE_OPERATION_CANCELLED = 12;
  APPLICATION_ERROR_CODE_DEADLINE_EXCEEDED = 13;
  APPLICATION_ERROR_CODE_INTERNAL_DEFECT = 14;
  APPLICATION_ERROR_CODE_IDEMPOTENCY_KEY_REUSE = 15;
  APPLICATION_ERROR_CODE_COMMAND_EXECUTION_FAILED = 16;
  APPLICATION_ERROR_CODE_CAPABILITY_REVOKED = 17;
  APPLICATION_ERROR_CODE_PROTOCOL_INVALID = 18;
  APPLICATION_ERROR_CODE_HISTORY_INCARNATION_MISMATCH = 19;
  APPLICATION_ERROR_CODE_HISTORY_PRUNED = 21;
  APPLICATION_ERROR_CODE_OVERLOADED = 20;
}

enum ApplicationErrorCategory {
  APPLICATION_ERROR_CATEGORY_UNSPECIFIED = 0;
  APPLICATION_ERROR_CATEGORY_INPUT = 1;
  APPLICATION_ERROR_CATEGORY_AUTHORIZATION = 2;
  APPLICATION_ERROR_CATEGORY_CONTRACT = 3;
  APPLICATION_ERROR_CATEGORY_QUERY = 4;
  APPLICATION_ERROR_CATEGORY_MODULE = 5;
  APPLICATION_ERROR_CATEGORY_CURSOR = 6;
  APPLICATION_ERROR_CATEGORY_RESOURCE = 7;
  APPLICATION_ERROR_CATEGORY_STORAGE = 8;
  APPLICATION_ERROR_CATEGORY_UNCERTAINTY = 9;
  APPLICATION_ERROR_CATEGORY_INTERNAL = 10;
  APPLICATION_ERROR_CATEGORY_PROTOCOL = 11;
  APPLICATION_ERROR_CATEGORY_COMMAND = 12;
  APPLICATION_ERROR_CATEGORY_CONTROL = 13;
  APPLICATION_ERROR_CATEGORY_HISTORY = 14;
  APPLICATION_ERROR_CATEGORY_CAPACITY = 15;
}

enum ApplicationRecoveryAction {
  APPLICATION_RECOVERY_ACTION_UNSPECIFIED = 0;
  APPLICATION_RECOVERY_ACTION_CORRECT_REQUEST = 1;
  APPLICATION_RECOVERY_ACTION_RETRY = 2;
  APPLICATION_RECOVERY_ACTION_RESOLVE_WITH_SAME_IDEMPOTENCY_KEY = 3;
  APPLICATION_RECOVERY_ACTION_OBTAIN_PERMISSION = 4;
  APPLICATION_RECOVERY_ACTION_REFRESH_CONTRACT = 5;
  APPLICATION_RECOVERY_ACTION_CONTACT_OPERATOR = 6;
  APPLICATION_RECOVERY_ACTION_NONE = 7;
}

enum ApplicationFixCode {
  APPLICATION_FIX_CODE_UNSPECIFIED = 0;
  APPLICATION_FIX_CODE_CORRECT_INPUT = 1;
  APPLICATION_FIX_CODE_REMOVE_FORBIDDEN_OUTPUT = 2;
  APPLICATION_FIX_CODE_BIND_APPLICATION_ROLE = 3;
  APPLICATION_FIX_CODE_REFRESH_CONTRACT = 4;
  APPLICATION_FIX_CODE_PIN_ACTIVE_MODULE = 5;
  APPLICATION_FIX_CODE_ADD_BOUNDED_INDEX = 6;
  APPLICATION_FIX_CODE_RESTART_FROM_FIRST_PAGE = 7;
  APPLICATION_FIX_CODE_RETRY_LATER = 8;
  APPLICATION_FIX_CODE_RESOLVE_WITH_SAME_IDEMPOTENCY_KEY = 9;
  APPLICATION_FIX_CODE_CONTACT_OPERATOR_WITH_INCIDENT = 10;
}

// The sole structured failure details payload for riffdb.app.v1 RPCs.
// Every string is a checked contract symbol; arbitrary messages and submitted
// values are deliberately absent.
message ApplicationError {
  uint32 envelope_version = 1;
  ApplicationErrorCode code = 2;
  ApplicationErrorCategory category = 3;
  ApplicationRecoveryAction recovery_action = 4;
  ApplicationOperation operation = 5;
  optional string contract_lineage = 6;
  optional uint64 contract_version = 7;
  optional string operation_symbol = 8;
  repeated string symbol_path = 9;
  optional SourceSpan source_span = 10;
  repeated ApplicationFixCode fixes = 11;
  optional bytes trace_id = 12;
  optional bytes incident_id = 13;
}

// Bounded, redaction-safe symbolic compiler diagnostic.
message Diagnostic {
  string code = 1;
  string summary = 2;
  SourceSpan span = 3;
  repeated string symbols = 4;
  optional string suggestion = 5;
}

message QueryIdentity {
  string contract_lineage = 1;
  uint64 contract_version = 2;
  bytes contract_bundle_hash = 3;
  optional string query_name = 4;
  bytes plan_hash = 5;
  optional bytes module_hash = 6;
}

message QuerySchema {
  repeated string parameters = 1;
  repeated string outcomes = 2;
  repeated string result_fields = 3;
}

message CheckQueryRequest {
  optional ContractSelector contract = 1;
  string source = 2;
  bytes request_id = 100;
}

message CheckQueryResponse {
  optional QueryIdentity identity = 1;
  optional QuerySchema schema = 2;
  repeated Diagnostic diagnostics = 3;
}

message ExplainQueryRequest {
  optional ContractSelector contract = 1;
  oneof query {
    string source = 2;
    string query_name = 3;
  }
  optional bytes module_hash = 4;
  bytes request_id = 100;
}

message ExplainQueryResponse {
  optional QueryIdentity identity = 1;
  optional QuerySchema schema = 2;
  repeated string plan_lines = 3;
  repeated Diagnostic diagnostics = 4;
}

message ExecuteQueryRequest {
  optional ContractSelector contract = 1;
  oneof query {
    string source = 2;
    string query_name = 3;
  }
  optional bytes module_hash = 4;
  repeated Parameter parameters = 5;
  optional string cursor = 6;
  optional uint64 minimum_application_head = 7;
  bytes request_id = 100;
}

message ResultRecord {
  repeated Parameter fields = 1;
  string entity = 2;
}

enum ResultCardinality {
  RESULT_CARDINALITY_UNSPECIFIED = 0;
  RESULT_CARDINALITY_ONE = 1;
  RESULT_CARDINALITY_MAYBE = 2;
  RESULT_CARDINALITY_MANY = 3;
}

message ResultField {
  string name = 1;
  ResultCardinality cardinality = 2;
  repeated ResultRecord records = 3;
}

message ExecuteQueryResponse {
  QueryIdentity identity = 1;
  string outcome = 2;
  uint64 application_head = 3;
  repeated ResultField fields = 4;
  optional string next_cursor = 5;
}

message DescribeContractRequest {
  optional ContractSelector contract = 1;
  bytes request_id = 100;
}

message DescribeContractResponse {
  string contract_lineage = 1;
  uint64 contract_version = 2;
  bytes contract_bundle_hash = 3;
  string symbolic_catalog = 4;
}

message NamedQuerySource {
  string name = 1;
  string source = 2;
}

message DeployQueryModuleRequest {
  ContractSelector contract = 1;
  string module_name = 2;
  uint64 module_version = 3;
  repeated NamedQuerySource queries = 4;
  oneof expected_active {
    bool any_active = 5;
    bool absent_active = 6;
    bytes module_hash = 7;
  }
  bytes request_id = 100;
}

enum QueryModuleDeploymentOutcome {
  QUERY_MODULE_DEPLOYMENT_OUTCOME_UNSPECIFIED = 0;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_ACTIVATED = 1;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_ALREADY_ACTIVE = 2;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_EXPECTED_ACTIVE_MISMATCH = 3;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_VERSION_CONFLICT = 4;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_CONTRACT_UNAVAILABLE = 5;
}

message QueryModuleDescriptor {
  string module_name = 1;
  uint64 module_version = 2;
  bytes module_hash = 3;
  string contract_lineage = 4;
  uint64 contract_version = 5;
  bytes contract_bundle_hash = 6;
  repeated string query_names = 7;
}

message DeployQueryModuleResponse {
  QueryModuleDeploymentOutcome outcome = 1;
  QueryModuleDescriptor module = 2;
  optional bytes actual_active_module_hash = 3;
}

message GetQueryModuleRequest {
  ContractSelector contract = 1;
  optional bytes module_hash = 2;
  bytes request_id = 100;
}

message GetQueryModuleResponse {
  optional QueryModuleDescriptor module = 1;
  repeated NamedQuerySource queries = 2;
}

service ApplicationQueryService {
  rpc DescribeContract(DescribeContractRequest) returns (DescribeContractResponse);
  rpc CheckQuery(CheckQueryRequest) returns (CheckQueryResponse);
  rpc ExplainQuery(ExplainQueryRequest) returns (ExplainQueryResponse);
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);
  rpc DeployQueryModule(DeployQueryModuleRequest) returns (DeployQueryModuleResponse);
  rpc GetQueryModule(GetQueryModuleRequest) returns (GetQueryModuleResponse);
}
