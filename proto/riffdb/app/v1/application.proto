syntax = "proto3";

package riffdb.app.v1;

import "riffdb/v1/value.proto";

// Exact contract selection. An absent selector requests the active contract.
message ContractSelector {
  string lineage = 1;
  uint64 version = 2;
  bytes bundle_hash = 3;
}

// One name-addressed typed parameter.
message Parameter {
  string name = 1;
  riffdb.v1.Value value = 2;
}

message SourceSpan {
  uint64 start = 1;
  uint64 end = 2;
}

// Closed application operation inventory. This is presentation context, never
// authority: the server still authorizes the actual service operation.
enum ApplicationOperation {
  APPLICATION_OPERATION_UNSPECIFIED = 0;
  APPLICATION_OPERATION_DESCRIBE_CONTRACT = 1;
  APPLICATION_OPERATION_CHECK_QUERY = 2;
  APPLICATION_OPERATION_EXPLAIN_QUERY = 3;
  APPLICATION_OPERATION_EXECUTE_QUERY = 4;
  APPLICATION_OPERATION_DEPLOY_QUERY_MODULE = 5;
  APPLICATION_OPERATION_GET_QUERY_MODULE = 6;
  APPLICATION_OPERATION_EXECUTE_COMMAND = 7;
  APPLICATION_OPERATION_BATCH_COMMAND = 8;
  APPLICATION_OPERATION_EXECUTE_PROJECTED_QUERY = 9;
  APPLICATION_OPERATION_DEPLOY_REACTIVE_MODULE = 10;
}

enum ApplicationErrorCode {
  APPLICATION_ERROR_CODE_UNSPECIFIED = 0;
  APPLICATION_ERROR_CODE_INVALID_REQUEST = 1;
  APPLICATION_ERROR_CODE_INPUT_INVALID = 2;
  APPLICATION_ERROR_CODE_AUTHORIZATION_DENIED = 3;
  APPLICATION_ERROR_CODE_CONTRACT_MISMATCH = 4;
  APPLICATION_ERROR_CODE_QUERY_INVALID = 5;
  APPLICATION_ERROR_CODE_QUERY_UNAVAILABLE = 6;
  APPLICATION_ERROR_CODE_MODULE_UNAVAILABLE = 7;
  APPLICATION_ERROR_CODE_CURSOR_INVALID = 8;
  APPLICATION_ERROR_CODE_RESPONSE_TOO_LARGE = 9;
  APPLICATION_ERROR_CODE_STORAGE_UNAVAILABLE = 10;
  APPLICATION_ERROR_CODE_OUTCOME_UNKNOWN = 11;
  APPLICATION_ERROR_CODE_OPERATION_CANCELLED = 12;
  APPLICATION_ERROR_CODE_DEADLINE_EXCEEDED = 13;
  APPLICATION_ERROR_CODE_INTERNAL_DEFECT = 14;
  APPLICATION_ERROR_CODE_IDEMPOTENCY_KEY_REUSE = 15;
  APPLICATION_ERROR_CODE_COMMAND_EXECUTION_FAILED = 16;
  APPLICATION_ERROR_CODE_CAPABILITY_REVOKED = 17;
  APPLICATION_ERROR_CODE_PROTOCOL_INVALID = 18;
  APPLICATION_ERROR_CODE_HISTORY_INCARNATION_MISMATCH = 19;
  APPLICATION_ERROR_CODE_HISTORY_PRUNED = 21;
  APPLICATION_ERROR_CODE_OVERLOADED = 20;
  APPLICATION_ERROR_CODE_PROJECTION_DIVERGED = 22;
  APPLICATION_ERROR_CODE_SNAPSHOT_RETIRED = 23;
  APPLICATION_ERROR_CODE_FRESHNESS_UNSATISFIED = 24;
}

enum ApplicationErrorCategory {
  APPLICATION_ERROR_CATEGORY_UNSPECIFIED = 0;
  APPLICATION_ERROR_CATEGORY_INPUT = 1;
  APPLICATION_ERROR_CATEGORY_AUTHORIZATION = 2;
  APPLICATION_ERROR_CATEGORY_CONTRACT = 3;
  APPLICATION_ERROR_CATEGORY_QUERY = 4;
  APPLICATION_ERROR_CATEGORY_MODULE = 5;
  APPLICATION_ERROR_CATEGORY_CURSOR = 6;
  APPLICATION_ERROR_CATEGORY_RESOURCE = 7;
  APPLICATION_ERROR_CATEGORY_STORAGE = 8;
  APPLICATION_ERROR_CATEGORY_UNCERTAINTY = 9;
  APPLICATION_ERROR_CATEGORY_INTERNAL = 10;
  APPLICATION_ERROR_CATEGORY_PROTOCOL = 11;
  APPLICATION_ERROR_CATEGORY_COMMAND = 12;
  APPLICATION_ERROR_CATEGORY_CONTROL = 13;
  APPLICATION_ERROR_CATEGORY_HISTORY = 14;
  APPLICATION_ERROR_CATEGORY_CAPACITY = 15;
}

enum ApplicationRecoveryAction {
  APPLICATION_RECOVERY_ACTION_UNSPECIFIED = 0;
  APPLICATION_RECOVERY_ACTION_CORRECT_REQUEST = 1;
  APPLICATION_RECOVERY_ACTION_RETRY = 2;
  APPLICATION_RECOVERY_ACTION_RESOLVE_WITH_SAME_IDEMPOTENCY_KEY = 3;
  APPLICATION_RECOVERY_ACTION_OBTAIN_PERMISSION = 4;
  APPLICATION_RECOVERY_ACTION_REFRESH_CONTRACT = 5;
  APPLICATION_RECOVERY_ACTION_CONTACT_OPERATOR = 6;
  APPLICATION_RECOVERY_ACTION_NONE = 7;
}

enum ApplicationFixCode {
  APPLICATION_FIX_CODE_UNSPECIFIED = 0;
  APPLICATION_FIX_CODE_CORRECT_INPUT = 1;
  APPLICATION_FIX_CODE_REMOVE_FORBIDDEN_OUTPUT = 2;
  APPLICATION_FIX_CODE_BIND_APPLICATION_ROLE = 3;
  APPLICATION_FIX_CODE_REFRESH_CONTRACT = 4;
  APPLICATION_FIX_CODE_PIN_ACTIVE_MODULE = 5;
  APPLICATION_FIX_CODE_ADD_BOUNDED_INDEX = 6;
  APPLICATION_FIX_CODE_RESTART_FROM_FIRST_PAGE = 7;
  APPLICATION_FIX_CODE_RETRY_LATER = 8;
  APPLICATION_FIX_CODE_RESOLVE_WITH_SAME_IDEMPOTENCY_KEY = 9;
  APPLICATION_FIX_CODE_CONTACT_OPERATOR_WITH_INCIDENT = 10;
}

// The sole structured failure details payload for riffdb.app.v1 RPCs.
// Every string is a checked contract symbol; arbitrary messages and submitted
// values are deliberately absent.
message ApplicationError {
  uint32 envelope_version = 1;
  ApplicationErrorCode code = 2;
  ApplicationErrorCategory category = 3;
  ApplicationRecoveryAction recovery_action = 4;
  ApplicationOperation operation = 5;
  optional string contract_lineage = 6;
  optional uint64 contract_version = 7;
  optional string operation_symbol = 8;
  repeated string symbol_path = 9;
  optional SourceSpan source_span = 10;
  repeated ApplicationFixCode fixes = 11;
  optional bytes trace_id = 12;
  optional bytes incident_id = 13;
}

// Bounded, redaction-safe symbolic compiler diagnostic.
message Diagnostic {
  string code = 1;
  string summary = 2;
  SourceSpan span = 3;
  repeated string symbols = 4;
  optional string suggestion = 5;
}

message QueryIdentity {
  string contract_lineage = 1;
  uint64 contract_version = 2;
  bytes contract_bundle_hash = 3;
  optional string query_name = 4;
  bytes plan_hash = 5;
  optional bytes module_hash = 6;
}

message QuerySchema {
  repeated string parameters = 1;
  repeated string outcomes = 2;
  repeated string result_fields = 3;
}

message CheckQueryRequest {
  optional ContractSelector contract = 1;
  string source = 2;
  bytes request_id = 100;
}

message CheckQueryResponse {
  optional QueryIdentity identity = 1;
  optional QuerySchema schema = 2;
  repeated Diagnostic diagnostics = 3;
}

message ExplainQueryRequest {
  optional ContractSelector contract = 1;
  oneof query {
    string source = 2;
    string query_name = 3;
  }
  optional bytes module_hash = 4;
  bytes request_id = 100;
}

message ExplainQueryResponse {
  optional QueryIdentity identity = 1;
  optional QuerySchema schema = 2;
  repeated string plan_lines = 3;
  repeated Diagnostic diagnostics = 4;
}

message ExecuteQueryRequest {
  optional ContractSelector contract = 1;
  oneof query {
    string source = 2;
    string query_name = 3;
  }
  optional bytes module_hash = 4;
  repeated Parameter parameters = 5;
  optional string cursor = 6;
  optional uint64 minimum_application_head = 7;
  // Closed, canonical set. Empty means legacy records. Compact-capable callers
  // advertise LEGACY_RECORDS followed by COMPACT_V1 so an ineligible deployed
  // plan can retain the byte-equivalent legacy representation.
  repeated NamedResultEncoding accepted_result_encodings = 8;
  bytes request_id = 100;
}

message ResultRecord {
  repeated Parameter fields = 1;
  string entity = 2;
}

enum ResultCardinality {
  RESULT_CARDINALITY_UNSPECIFIED = 0;
  RESULT_CARDINALITY_ONE = 1;
  RESULT_CARDINALITY_MAYBE = 2;
  RESULT_CARDINALITY_MANY = 3;
}

message ResultField {
  string name = 1;
  ResultCardinality cardinality = 2;
  repeated ResultRecord records = 3;
}

// Additive representation negotiation for named-query results. This changes
// carriage only; the selected compiled operation and all query semantics stay
// identical.
enum NamedResultEncoding {
  NAMED_RESULT_ENCODING_UNSPECIFIED = 0;
  NAMED_RESULT_ENCODING_LEGACY_RECORDS = 1;
  NAMED_RESULT_ENCODING_COMPACT_V1 = 2;
}

message CompactResultRow {
  repeated riffdb.v1.Value values = 1;
}

message CompactResultField {
  string name = 1;
  ResultCardinality cardinality = 2;
  string entity = 3;
  repeated string fields = 4;
  repeated CompactResultRow rows = 5;
}

message ExecuteQueryResponse {
  QueryIdentity identity = 1;
  string outcome = 2;
  uint64 application_head = 3;
  repeated ResultField fields = 4;
  optional string next_cursor = 5;
  NamedResultEncoding selected_result_encoding = 6;
  optional CompactResultField compact_result = 7;
}

message DescribeContractRequest {
  optional ContractSelector contract = 1;
  bytes request_id = 100;
}

message DescribeContractResponse {
  string contract_lineage = 1;
  uint64 contract_version = 2;
  bytes contract_bundle_hash = 3;
  string symbolic_catalog = 4;
}

enum ApplicationCatalogSymbolKind {
  APPLICATION_CATALOG_SYMBOL_KIND_UNSPECIFIED = 0;
  APPLICATION_CATALOG_SYMBOL_KIND_CONTRACT = 1;
  APPLICATION_CATALOG_SYMBOL_KIND_ENUM = 2;
  APPLICATION_CATALOG_SYMBOL_KIND_ENTITY = 3;
  APPLICATION_CATALOG_SYMBOL_KIND_FIELD = 4;
  APPLICATION_CATALOG_SYMBOL_KIND_RELATIONSHIP = 5;
  APPLICATION_CATALOG_SYMBOL_KIND_INDEX = 6;
  APPLICATION_CATALOG_SYMBOL_KIND_COMMAND = 7;
  APPLICATION_CATALOG_SYMBOL_KIND_COMMAND_OUTCOME = 8;
  APPLICATION_CATALOG_SYMBOL_KIND_EVENT = 9;
  APPLICATION_CATALOG_SYMBOL_KIND_QUERY_MODULE = 10;
  APPLICATION_CATALOG_SYMBOL_KIND_QUERY = 11;
  APPLICATION_CATALOG_SYMBOL_KIND_ROLE = 12;
  APPLICATION_CATALOG_SYMBOL_KIND_OPERATION = 13;
}

enum ApplicationCatalogFeature {
  APPLICATION_CATALOG_FEATURE_UNSPECIFIED = 0;
  APPLICATION_CATALOG_FEATURE_OPERATIONAL_OPTIONAL_PREDICATES = 1;
  APPLICATION_CATALOG_FEATURE_STABLE_CURSOR_PAGES = 2;
  APPLICATION_CATALOG_FEATURE_NULL_EXISTENCE_PREDICATES = 3;
  APPLICATION_CATALOG_FEATURE_BINARY_TEXT_PREFIX = 4;
  APPLICATION_CATALOG_FEATURE_UNICODE_FOLD_TEXT_PREFIX_V1 = 5;
  APPLICATION_CATALOG_FEATURE_EXACT_AGGREGATES = 6;
}

enum ApplicationCatalogFeatureState {
  APPLICATION_CATALOG_FEATURE_STATE_UNSPECIFIED = 0;
  APPLICATION_CATALOG_FEATURE_STATE_AVAILABLE = 1;
  APPLICATION_CATALOG_FEATURE_STATE_UNAVAILABLE = 2;
}

message ApplicationCatalogSourceSpan {
  uint32 start = 1;
  uint32 end = 2;
}

message ApplicationCatalogSymbol {
  ApplicationCatalogSymbolKind kind = 1;
  repeated string path = 2;
  optional string public_type = 3;
  optional ApplicationCatalogSourceSpan source_span = 4;
}

message ApplicationCatalogFeatureView {
  ApplicationCatalogFeature feature = 1;
  ApplicationCatalogFeatureState state = 2;
}

message GetApplicationCatalogRequest {
  optional ContractSelector contract = 1;
  uint32 limit = 2;
  optional string cursor = 3;
  bytes request_id = 100;
}

message GetApplicationCatalogResponse {
  string schema = 1;
  string contract_lineage = 2;
  uint64 contract_version = 3;
  bytes contract_bundle_hash = 4;
  repeated bytes query_module_hashes = 5;
  repeated ApplicationCatalogSymbol symbols = 6;
  repeated ApplicationCatalogFeatureView features = 7;
  bool has_more = 8;
  optional string next_cursor = 9;
}

message NamedQuerySource {
  string name = 1;
  string source = 2;
}

message DeployQueryModuleRequest {
  ContractSelector contract = 1;
  string module_name = 2;
  uint64 module_version = 3;
  repeated NamedQuerySource queries = 4;
  oneof expected_active {
    bool any_active = 5;
    bool absent_active = 6;
    bytes module_hash = 7;
  }
  bytes request_id = 100;
}

enum QueryModuleDeploymentOutcome {
  QUERY_MODULE_DEPLOYMENT_OUTCOME_UNSPECIFIED = 0;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_ACTIVATED = 1;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_ALREADY_ACTIVE = 2;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_EXPECTED_ACTIVE_MISMATCH = 3;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_VERSION_CONFLICT = 4;
  QUERY_MODULE_DEPLOYMENT_OUTCOME_CONTRACT_UNAVAILABLE = 5;
}

message QueryModuleDescriptor {
  string module_name = 1;
  uint64 module_version = 2;
  bytes module_hash = 3;
  string contract_lineage = 4;
  uint64 contract_version = 5;
  bytes contract_bundle_hash = 6;
  repeated string query_names = 7;
}

message DeployQueryModuleResponse {
  QueryModuleDeploymentOutcome outcome = 1;
  QueryModuleDescriptor module = 2;
  optional bytes actual_active_module_hash = 3;
}

message DeployReactiveModuleRequest {
  ContractSelector contract = 1;
  string source = 2;
  repeated bytes query_module_hashes = 3;
  bytes request_id = 100;
}

enum ReactiveModuleDeploymentOutcome {
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_UNSPECIFIED = 0;
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_PUBLISHED = 1;
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_ALREADY_PUBLISHED = 2;
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_VERSION_CONFLICT = 3;
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_CONTRACT_UNAVAILABLE = 4;
  REACTIVE_MODULE_DEPLOYMENT_OUTCOME_QUERY_MODULE_UNAVAILABLE = 5;
}

message ReactiveModuleDescriptor {
  string module_name = 1;
  uint64 module_version = 2;
  bytes module_hash = 3;
  string contract_lineage = 4;
  uint64 contract_version = 5;
  bytes contract_bundle_hash = 6;
  repeated bytes query_module_hashes = 7;
  repeated string operation_names = 8;
}

message DeployReactiveModuleResponse {
  ReactiveModuleDeploymentOutcome outcome = 1;
  ReactiveModuleDescriptor module = 2;
  optional bytes unavailable_query_module_hash = 3;
}

message GetQueryModuleRequest {
  ContractSelector contract = 1;
  optional bytes module_hash = 2;
  bytes request_id = 100;
}

message GetQueryModuleResponse {
  optional QueryModuleDescriptor module = 1;
  repeated NamedQuerySource queries = 2;
}

// --- Projected columnar query surface (ADR-0086 §2/§3/§7) ---

// Opaque freshness policy. Tokens/frontiers are opaque bytes, never bare u64.
message FreshnessPolicyProto {
  oneof policy {
    FreshnessCausal causal = 1;
    FreshnessBounded bounded = 2;
    FreshnessAvailable available = 3;
  }
}

message FreshnessCausal {
  // Opaque CommitToken bytes (riffdb-types::freshness).
  bytes commit_token = 1;
  uint64 max_wait_nanos = 2;
}

message FreshnessBounded {
  uint64 max_lag_sequences = 1;
}

message FreshnessAvailable {}

message ProjectedPredicate {
  string field = 1;
  oneof kind {
    riffdb.v1.Value eq = 2;
    ProjectedRange range = 3;
  }
}

message ProjectedRange {
  optional riffdb.v1.Value lower = 1;
  optional riffdb.v1.Value upper = 2;
  bool lower_inclusive = 3;
  bool upper_inclusive = 4;
}

message ProjectedOrder {
  string field = 1;
  bool descending = 2;
}

// One aggregate descriptor.
//
// COUNT counts matching rows and MUST carry an empty `field`; SUM, MIN, and
// MAX MUST name one projected column. A descriptor that names a column for
// COUNT is rejected typed rather than silently ignored.
message ProjectedAggregate {
  string field = 1;
  ProjectedAggregateOp op = 2;
}

enum ProjectedAggregateOp {
  PROJECTED_AGGREGATE_OP_UNSPECIFIED = 0;
  PROJECTED_AGGREGATE_OP_COUNT = 1;
  PROJECTED_AGGREGATE_OP_SUM = 2;
  PROJECTED_AGGREGATE_OP_MIN = 3;
  PROJECTED_AGGREGATE_OP_MAX = 4;
}

message ProjectedQueryBody {
  repeated string select = 1;
  riffdb.v1.Value org_scope = 2;
  repeated ProjectedPredicate predicates = 3;
  repeated ProjectedOrder order = 4;
  optional uint32 limit = 5;
  // Bounded group-by keys (ADR-0087). Non-empty keys make the request grouped.
  //
  // `select` does not apply to a grouped or aggregate request: those results
  // carry no row cells, so there is nothing to narrow. It remains validated.
  //
  // `limit` DOES apply to a grouped request, as the maximum number of GROUPS
  // it may return: grouped results are measured in groups rather than rows, and
  // `limit` is the caller's declared result bound either way. A grouped query
  // whose matching set produces more groups than `limit` is rejected typed and
  // returns nothing — never the first `limit` groups, because a truncated fold
  // is indistinguishable from a complete one.
  //
  // `limit` has no effect on an ungrouped aggregate. Those results are
  // fixed-cardinality — one value per requested descriptor — however large the
  // matching set is.
  repeated string group_by = 6;
  // Aggregate descriptors. Empty = row request (unchanged behaviour).
  //
  // A grouped request (`group_by` non-empty) accepts zero or more descriptors.
  // A global request (`group_by` empty) accepts exactly one: the engine's
  // whole-set aggregate path computes a single function and is the only path
  // that answers an empty matching set with identity values rather than zero
  // groups. Two or more descriptors without `group_by` are rejected typed.
  //
  // Any request carrying at least one descriptor is answered by the
  // `ready_aggregates` outcome arm; see ProjectedReadyAggregates.
  //
  // Field 7 previously carried `optional ProjectedAggregate aggregate`. That
  // singular form was rejected typed at the boundary from the day it was
  // defined (no response carriage existed), so no client can ever have used
  // it; proto3 encodes both forms identically for field 7.
  repeated ProjectedAggregate aggregates = 7;
}

// Opt-in response encoding for ExecuteProjectedQuery (CP4).
// UNSPECIFIED and ROW keep today's row-oriented Ready arm.
// PACKED requests a column-major ready_packed arm when the outcome is Ready.
enum ProjectedResponseEncoding {
  PROJECTED_RESPONSE_ENCODING_UNSPECIFIED = 0;
  PROJECTED_RESPONSE_ENCODING_ROW = 1;
  PROJECTED_RESPONSE_ENCODING_PACKED = 2;
}

message ExecuteProjectedQueryRequest {
  optional ContractSelector contract = 1;
  string projection_name = 2;
  ProjectedQueryBody request = 3;
  FreshnessPolicyProto freshness = 4;
  // Opt-in packed column-major Ready encoding. Absent / UNSPECIFIED / ROW
  // retain the historical row-oriented ready arm (full compatibility).
  optional ProjectedResponseEncoding response_encoding = 5;
  bytes request_id = 100;
}

message ProjectedQueryReady {
  repeated string fields = 1;
  repeated ResultRecord rows = 2;
  // Opaque ProjectionFrontier bytes.
  bytes frontier = 3;
  // Opaque ProjectionFrontier bytes for application head.
  bytes head = 4;
  // Opaque CommitToken for the served frontier (causal chaining).
  bytes commit_token = 5;
}

// Column-major Ready payload: PK columns first, then selected fields.
// Cells use the existing canonical value encoding (encode_canonical_value).
message ProjectedReadyPacked {
  // Selected field names; column order after primary_key_fields.
  repeated string fields = 1;
  // Primary-key column names; column order first among columns.
  repeated string primary_key_fields = 2;
  uint32 row_count = 3;
  // PK columns first, then selected fields (length = pk + select).
  repeated PackedColumn columns = 4;
  bytes frontier = 5;
  bytes head = 6;
  bytes commit_token = 7;
}

// One packed column: concatenated canonical cell encodings + row offsets.
message PackedColumn {
  // Concatenated per-cell canonical encodings for this column.
  bytes data = 1;
  // row_count+1 offsets into data (start/end per cell). u32: column data is
  // bounded far below 4 GiB by public response budgets.
  repeated uint32 offsets = 2;
}

// MIN / MAX carriage.
//
// An absent `value` means "no row contributed to this group" and is distinct
// from a present `null_value`, which is a real NULL extreme over an optional
// column. Absence is carried by field presence, exactly as ProjectedRange
// carries an unbounded end; `null_value` keeps its ordinary Value meaning.
message ProjectedAggregateScalar {
  optional riffdb.v1.Value value = 1;
}

// One aggregate result cell, positionally aligned with the descriptor at the
// same index in ProjectedReadyAggregates.aggregates. The arm always matches
// that descriptor's op: COUNT -> count, SUM -> sum, MIN/MAX -> scalar.
message ProjectedAggregateValue {
  oneof value {
    // COUNT: exact number of matching rows in this group.
    uint64 count = 1;
    // SUM: exact integer sum carried as a scale-0 Decimal.
    //
    // The engine sums i64/u64 columns into an exact i128, which no Value arm
    // can hold. `coefficient_twos_complement` is the minimal big-endian two's
    // complement encoding of that i128 (1 through 16 bytes), `scale` is always
    // 0, and `precision` is always absent: an i128 needs up to 39 significant
    // digits, one more than a decimal precision can assert.
    riffdb.v1.Decimal sum = 2;
    // MIN / MAX: the extreme column value, or absent for an empty group.
    ProjectedAggregateScalar scalar = 3;
  }
}

// One aggregate group.
message ProjectedAggregateGroup {
  // Group key cells, aligned with ProjectedReadyAggregates.group_key_fields.
  // Empty for the single group of a global (non-grouped) aggregate.
  repeated riffdb.v1.Value keys = 1;
  // Aggregate cells, aligned with ProjectedReadyAggregates.aggregates.
  repeated ProjectedAggregateValue values = 2;
}

// Aggregate / grouped Ready payload.
//
// This arm answers every request whose body carries at least one aggregate
// descriptor, grouped or not. A global (non-grouped) aggregate answers with
// exactly one group whose `keys` list is empty — there is no second response
// shape for the ungrouped case.
//
// ProjectedResponseEncoding chooses between the two ROW-shaped arms (`ready`
// and `ready_packed`) and is INAPPLICABLE here. Requesting PACKED together
// with an aggregate body is NOT an error: aggregate results carry no row
// cells, so there is nothing to pack, and the field is simply ignored.
//
// Group order is deterministic and is the ascending byte order of the
// engine's length-prefixed encoded group key — NOT collation order of the key
// values and not insertion order. Neither the service nor the wire adapter
// re-sorts groups.
message ProjectedReadyAggregates {
  // Group key field names; column order for every group's `keys`. Empty for a
  // global aggregate.
  repeated string group_key_fields = 1;
  // The request's aggregate descriptors echoed in request order; column order
  // for every group's `values`. Present so the response is self-describing.
  repeated ProjectedAggregate aggregates = 2;
  // Groups in deterministic encoded-group-key byte order (see above).
  repeated ProjectedAggregateGroup groups = 3;
  // Opaque ProjectionFrontier bytes.
  bytes frontier = 4;
  // Opaque ProjectionFrontier bytes for application head.
  bytes head = 5;
  // Opaque CommitToken for the served frontier (causal chaining).
  bytes commit_token = 6;
}

message ProjectedQueryLagging {
  bytes required = 1;
  bytes current = 2;
  bytes head = 3;
  optional uint64 lag_sequences = 4;
  optional uint64 retry_after_nanos = 5;
}

message ProjectedQueryBuilding {
  bytes applied_through = 1;
  bytes head = 2;
}

enum ProjectedRebuildingReason {
  PROJECTED_REBUILDING_REASON_UNSPECIFIED = 0;
  PROJECTED_REBUILDING_REASON_REPLAY_BUDGET_EXCEEDED = 1;
  PROJECTED_REBUILDING_REASON_EXPLICIT_REBUILD = 2;
  PROJECTED_REBUILDING_REASON_STATE_INTEGRITY_FAILURE = 3;
}

message ProjectedQueryRebuilding {
  ProjectedRebuildingReason reason = 1;
  uint64 progress_applied = 2;
  uint64 progress_total = 3;
}

enum ProjectedDegradedReason {
  PROJECTED_DEGRADED_REASON_UNSPECIFIED = 0;
  PROJECTED_DEGRADED_REASON_APPLY_LAG_SLO = 1;
  PROJECTED_DEGRADED_REASON_MAINTENANCE_BACKLOG = 2;
  PROJECTED_DEGRADED_REASON_PARTIAL_INVENTORY = 3;
}

message ProjectedQueryDegraded {
  ProjectedDegradedReason reason = 1;
  bytes current = 2;
}

message ProjectedQueryInvalid {
  bytes expected_fingerprint = 1;
  bytes found_fingerprint = 2;
}

message ExecuteProjectedQueryResponse {
  oneof outcome {
    ProjectedQueryReady ready = 1;
    ProjectedQueryLagging lagging = 2;
    ProjectedQueryBuilding building = 3;
    ProjectedQueryRebuilding rebuilding = 4;
    ProjectedQueryDegraded degraded = 5;
    ProjectedQueryInvalid invalid = 6;
    // Present only when the request opted into PACKED and the outcome is Ready.
    ProjectedReadyPacked ready_packed = 7;
    // Present only when the request body carried aggregate descriptors and the
    // outcome is Ready. Independent of response_encoding.
    ProjectedReadyAggregates ready_aggregates = 8;
  }
}

service ApplicationQueryService {
  rpc DescribeContract(DescribeContractRequest) returns (DescribeContractResponse);
  rpc GetApplicationCatalog(GetApplicationCatalogRequest) returns (GetApplicationCatalogResponse);
  rpc CheckQuery(CheckQueryRequest) returns (CheckQueryResponse);
  rpc ExplainQuery(ExplainQueryRequest) returns (ExplainQueryResponse);
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);
  rpc DeployQueryModule(DeployQueryModuleRequest) returns (DeployQueryModuleResponse);
  rpc DeployReactiveModule(DeployReactiveModuleRequest) returns (DeployReactiveModuleResponse);
  rpc GetQueryModule(GetQueryModuleRequest) returns (GetQueryModuleResponse);
  rpc ExecuteProjectedQuery(ExecuteProjectedQueryRequest) returns (ExecuteProjectedQueryResponse);
}
