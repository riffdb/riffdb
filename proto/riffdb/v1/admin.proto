syntax = "proto3";

package riffdb.v1;

import "riffdb/v1/common.proto";
import "riffdb/v1/value.proto";
import "riffdb/v1/commit.proto";

message HealthRequest {
  optional bytes request_id = 1;
}

enum PreBootstrapLifecycle {
  PRE_BOOTSTRAP_LIFECYCLE_UNSPECIFIED = 0;
  PRE_BOOTSTRAP_LIFECYCLE_INITIALIZING_VALIDATION = 1;
  PRE_BOOTSTRAP_LIFECYCLE_INITIALIZING_BOOTSTRAP = 2;
}

message PreBootstrapHealth {
  PreBootstrapLifecycle lifecycle = 1;
  bool liveness = 2;
  bool readiness = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_READY = 1;
  HEALTH_STATUS_NOT_READY = 2;
  HEALTH_STATUS_DEGRADED = 3;
}

enum HealthComponentKind {
  HEALTH_COMPONENT_KIND_UNSPECIFIED = 0;
  HEALTH_COMPONENT_KIND_AUTHORITATIVE_STORAGE = 1;
  HEALTH_COMPONENT_KIND_CATALOG = 2;
  HEALTH_COMPONENT_KIND_COMMIT_COORDINATOR = 3;
  HEALTH_COMPONENT_KIND_PROJECTION = 4;
  HEALTH_COMPONENT_KIND_OUTBOX = 5;
  HEALTH_COMPONENT_KIND_VECTOR_STALENESS = 6;
  HEALTH_COMPONENT_KIND_REPLICATION = 7;
}

enum HealthComponentStatus {
  HEALTH_COMPONENT_STATUS_UNSPECIFIED = 0;
  HEALTH_COMPONENT_STATUS_HEALTHY = 1;
  HEALTH_COMPONENT_STATUS_DEGRADED = 2;
  HEALTH_COMPONENT_STATUS_UNAVAILABLE = 3;
}

message HealthComponent {
  HealthComponentKind component = 1;
  HealthComponentStatus status = 2;
  // Present only on the replication component; absent on unavailable observations.
  ReplicationStatistics replication = 3;
}

enum ReplicationRole {
  REPLICATION_ROLE_UNSPECIFIED = 0;
  REPLICATION_ROLE_PRIMARY = 1;
  REPLICATION_ROLE_FOLLOWER = 2;
}

// Both positions are explicit, including before-first. An absent whole frontier
// in ReplicationStatistics means unknown/not applicable, never a zero position.
message ReplicationFrontier {
  FrontierPosition application = 1;
  FrontierPosition administration = 2;
}

// Bounded (512 encoded bytes) observational counters, never freshness authority.
// Primary lag compares its head with the oldest registered follower ack;
// follower lag compares its applied head with its last reported source head.
// No field measures time; control-only physical receipts add no logical lag.
message ReplicationStatistics {
  ReplicationRole role = 1;
  ReplicationFrontier source_frontier = 2;
  ReplicationFrontier applied_frontier = 3;
  ReplicationFrontier acknowledged_frontier = 4;
  optional uint32 registered_followers = 5; // primary only, including zero
  optional uint64 application_lag_sequences = 6;
  optional uint64 administration_lag_sequences = 7;
}

message BuildInfo {
  string semantic_version = 1;
  string git_revision = 2;
  string rust_version = 3;
  repeated string enabled_features = 4;
  uint32 storage_format_version = 5;
  uint32 contract_ir_version = 6;
  string mcp_protocol_baseline = 7;
}

message AuthenticatedHealth {
  HealthStatus status = 1;
  optional uint64 active_contract_version = 2;
  optional uint64 last_commit_sequence = 3;
  repeated HealthComponent components = 4;
  Timestamp started_at = 5;
  BuildInfo build = 6;
  // Durable history incarnation fence. Zero means the server is still
  // initializing and has not yet retained serving identity (pre-ready path);
  // once authenticated serving is ready the value is ≥ 1.
  uint64 history_incarnation = 7;
}

message HealthResponse {
  oneof result {
    PreBootstrapHealth pre_bootstrap = 1;
    AuthenticatedHealth authenticated = 2;
  }
  string database_alias = 3;
  string authentication_audience = 4;
}

message StatsRequest {
  bytes request_id = 1;
}

message StatsResponse {
  uint32 active_cursors = 1;
  uint32 active_commit_subscribers = 2;
  optional uint64 last_commit_sequence = 3;
  optional uint64 pending_outbox_deliveries = 4;
  optional uint32 known_projections = 5;
  // Durable history incarnation fence; ≥ 1 once the database is serving.
  uint64 history_incarnation = 6;
  ReplicationStatistics replication = 7;
}

enum CapabilityCreateMode {
  CAPABILITY_CREATE_MODE_UNSPECIFIED = 0;
  CAPABILITY_CREATE_MODE_NORMAL = 1;
  CAPABILITY_CREATE_MODE_BOOTSTRAP = 2;
}

enum CapabilityPermissionKind {
  CAPABILITY_PERMISSION_KIND_UNSPECIFIED = 0;
  CAPABILITY_PERMISSION_KIND_VALIDATE_CONTRACT = 1;
  CAPABILITY_PERMISSION_KIND_READ_CONTRACT = 2;
  CAPABILITY_PERMISSION_KIND_EXPLAIN_COMMAND = 3;
  CAPABILITY_PERMISSION_KIND_DEPLOY_CONTRACT = 4;
  CAPABILITY_PERMISSION_KIND_INVOKE_COMMAND = 5;
  CAPABILITY_PERMISSION_KIND_READ_ENTITY = 6;
  CAPABILITY_PERMISSION_KIND_SCAN_INDEX = 7;
  CAPABILITY_PERMISSION_KIND_QUERY_PROJECTION = 8;
  CAPABILITY_PERMISSION_KIND_READ_PROJECTION_STATUS = 9;
  CAPABILITY_PERMISSION_KIND_READ_COMMIT = 10;
  CAPABILITY_PERMISSION_KIND_SCAN_COMMITS = 11;
  CAPABILITY_PERMISSION_KIND_SUBSCRIBE_COMMITS = 12;
  CAPABILITY_PERMISSION_KIND_READ_PROVENANCE = 13;
  CAPABILITY_PERMISSION_KIND_INSPECT_OUTBOX = 14;
  CAPABILITY_PERMISSION_KIND_READ_HEALTH = 15;
  CAPABILITY_PERMISSION_KIND_READ_STATISTICS = 16;
  CAPABILITY_PERMISSION_KIND_CREATE_CAPABILITY = 17;
  CAPABILITY_PERMISSION_KIND_REVOKE_CAPABILITY = 18;
  CAPABILITY_PERMISSION_KIND_ADMINISTER_CAPABILITIES = 19;
  CAPABILITY_PERMISSION_KIND_CHECK_AD_HOC_QUERY = 20;
  CAPABILITY_PERMISSION_KIND_EXPLAIN_AD_HOC_QUERY = 21;
  CAPABILITY_PERMISSION_KIND_EXECUTE_AD_HOC_QUERY = 22;
  CAPABILITY_PERMISSION_KIND_EXPLAIN_NAMED_QUERY = 23;
  CAPABILITY_PERMISSION_KIND_EXECUTE_NAMED_QUERY = 24;
  CAPABILITY_PERMISSION_KIND_APPLICATION_ROLE_IDENTITY = 25;
  CAPABILITY_PERMISSION_KIND_MIGRATE_CONTRACT = 26;
  CAPABILITY_PERMISSION_KIND_CONSUME_EVENT_STREAM = 27;
  CAPABILITY_PERMISSION_KIND_SEEK_EVENT_STREAM_CONSUMER = 28;
  CAPABILITY_PERMISSION_KIND_WATCH_NAMED_QUERY = 29;
  CAPABILITY_PERMISSION_KIND_CONSUME_CONTEXTUAL_SUBSCRIPTION = 30;
  CAPABILITY_PERMISSION_KIND_INSTALL_APPLICATION = 31;
  CAPABILITY_PERMISSION_KIND_INSPECT_VECTOR_STATE = 32;
  // Administrative only; excluded from application roles and bootstrap grants.
  CAPABILITY_PERMISSION_KIND_REPLICATE_CHANGELOG = 33;
}

message LineageScopedStableId {
  string contract_lineage = 1;
  uint32 stable_id = 2;
}

message NamedQueryPermission {
  string contract_lineage = 1;
  bytes query_module_hash = 2;
  string query_name = 3;
}

message ReactiveOperationPermission {
  string contract_lineage = 1;
  bytes reactive_module_hash = 2;
  string operation_name = 3;
}

message CapabilityPermission {
  oneof permission {
    Unit validate_contract = 1;
    Unit read_contract = 2;
    LineageScopedStableId explain_command = 3;
    Unit deploy_contract = 4;
    LineageScopedStableId invoke_command = 5;
    LineageScopedStableId read_entity = 6;
    LineageScopedStableId scan_index = 7;
    LineageScopedStableId query_projection = 8;
    LineageScopedStableId read_projection_status = 9;
    Unit read_commit = 10;
    Unit scan_commits = 11;
    Unit subscribe_commits = 12;
    Unit read_provenance = 13;
    Unit inspect_outbox = 14;
    Unit read_health = 15;
    Unit read_statistics = 16;
    Unit create_capability = 17;
    Unit revoke_capability = 18;
    Unit administer_capabilities = 19;
    Unit check_ad_hoc_query = 20;
    Unit explain_ad_hoc_query = 21;
    Unit execute_ad_hoc_query = 22;
    NamedQueryPermission explain_named_query = 23;
    NamedQueryPermission execute_named_query = 24;
    bytes application_role_identity = 25;
    string migrate_contract = 26;
    ReactiveOperationPermission consume_event_stream = 27;
    ReactiveOperationPermission seek_event_stream_consumer = 28;
    ReactiveOperationPermission watch_named_query = 29;
    ReactiveOperationPermission consume_contextual_subscription = 30;
    string install_application = 31;
    Unit inspect_vector_state = 32;
    Unit replicate_changelog = 33;
  }
}

message ScopedPartition {
  string contract_lineage = 1;
  bytes partition_key = 2;
}

message ExplicitPartitionScope {
  repeated ScopedPartition partitions = 1;
}

message PartitionScope {
  oneof scope {
    Unit all = 1;
    ExplicitPartitionScope explicit = 2;
  }
}

message EntityFieldVisibility {
  string contract_lineage = 1;
  uint32 entity_type_id = 2;
  repeated uint32 field_ids = 3;
  // Dedicated explicit naming that reveals secret-classified fields
  // (ADR-0118); the ordinary field_ids list never does.
  repeated uint32 secret_field_ids = 4;
}

enum CapabilityRowPolicyOperation {
  CAPABILITY_ROW_POLICY_OPERATION_UNSPECIFIED = 0;
  CAPABILITY_ROW_POLICY_OPERATION_READ = 1;
  CAPABILITY_ROW_POLICY_OPERATION_CREATE = 2;
  CAPABILITY_ROW_POLICY_OPERATION_UPDATE = 3;
  CAPABILITY_ROW_POLICY_OPERATION_DELETE = 4;
}

message CapabilityPrincipalFact {
  string name = 1;
  Value value = 2;
}

message CapabilityRowPolicyBinding {
  string contract_lineage = 1;
  string policy_name = 2;
  uint32 entity_type_id = 3;
  repeated CapabilityRowPolicyOperation operations = 4;
}

message CapabilityRowPolicyGrant {
  bytes application_role_hash = 1;
  repeated CapabilityPrincipalFact principal_facts = 2;
  repeated CapabilityRowPolicyBinding policies = 3;
}

enum CapabilityApplicationExportScope {
  CAPABILITY_APPLICATION_EXPORT_SCOPE_UNSPECIFIED = 0;
  CAPABILITY_APPLICATION_EXPORT_SCOPE_PRINCIPAL_FILTERED = 1;
  CAPABILITY_APPLICATION_EXPORT_SCOPE_WHOLE_APPLICATION = 2;
}

message CapabilityApplicationExportGrant {
  string contract_lineage = 1;
  CapabilityApplicationExportScope scope = 2;
  bool entities = 3;
  bool events = 4;
  bool provenance = 5;
  bool public_audit = 6;
}

message CapabilityExportGrant {
  repeated CapabilityApplicationExportGrant applications = 1;
}

enum CapabilityApplicationReimportScope {
  CAPABILITY_APPLICATION_REIMPORT_SCOPE_UNSPECIFIED = 0;
  CAPABILITY_APPLICATION_REIMPORT_SCOPE_PRINCIPAL_FILTERED = 1;
  CAPABILITY_APPLICATION_REIMPORT_SCOPE_WHOLE_APPLICATION = 2;
}

// Distinct operator authority for one exact not-ready reimport campaign.
message CapabilityApplicationReimportGrant {
  string contract_lineage = 1;
  bytes campaign_id = 2;
  bytes portability_manifest_hash = 3;
  CapabilityApplicationReimportScope scope = 4;
}

message CapabilityVectorInspectionTarget {
  string contract_lineage = 1;
  uint32 entity_type_id = 2;
  uint32 field_id = 3;
  bool allow_counts = 4;
}

message CapabilityVectorInspectionGrant {
  bytes application_role_hash = 1;
  repeated CapabilityVectorInspectionTarget targets = 2;
}

message CapabilityGrant {
  TenantScope tenant_scope = 1;
  PartitionScope partition_scope = 2;
  repeated CapabilityPermission permissions = 3;
  repeated EntityFieldVisibility field_visibility = 4;
  uint32 max_scan_rows = 5;
  repeated CapabilityPermissionKind approval_required = 6;
  CapabilityRowPolicyGrant row_policy = 7;
  CapabilityExportGrant export = 8;
  CapabilityApplicationReimportGrant reimport = 9;
  CapabilityVectorInspectionGrant vector_inspection = 10;
}

message CreateCapabilityRequest {
  bytes request_id = 1;
  CapabilityCreateMode mode = 2;
  bytes capability_id = 3;
  string principal_id = 4;
  ActorKind actor_kind = 5;
  uint32 requested_lifetime_seconds = 6;
  repeated string audiences = 7;
  CapabilityGrant grant = 8;
}

message CapabilityIdentity {
  bytes capability_id = 1;
  uint64 revision = 2;
}

message CapabilityTransition {
  CapabilityIdentity identity = 1;
  uint64 administration_sequence = 2;
}

message NormalCapabilityCreated {
  CapabilityTransition transition = 1;
  string token = 2;
}

message NormalCreateCapabilityResult {
  oneof result {
    NormalCapabilityCreated created = 1;
    CapabilityIdentity already_created_token_unavailable = 2;
    Unit capability_id_conflict = 3;
  }
}

message BootstrapCreateCapabilityResult {
  oneof result {
    CapabilityTransition created = 1;
    CapabilityTransition replayed = 2;
    Unit bootstrap_conflict = 3;
  }
}

message CreateCapabilityResponse {
  oneof result {
    NormalCreateCapabilityResult normal = 1;
    BootstrapCreateCapabilityResult bootstrap = 2;
  }
}

enum RevocationReason {
  REVOCATION_REASON_UNSPECIFIED = 0;
  REVOCATION_REASON_REQUESTED = 1;
  REVOCATION_REASON_REPLACED = 2;
  REVOCATION_REASON_SUSPECTED_COMPROMISE = 3;
  REVOCATION_REASON_POLICY_CHANGE = 4;
}

message RevokeCapabilityRequest {
  bytes request_id = 1;
  bytes capability_id = 2;
  RevocationReason reason = 3;
}

message RevokeCapabilityResponse {
  oneof result {
    CapabilityTransition revoked = 1;
    CapabilityTransition already_revoked = 2;
    Unit capability_not_found = 3;
  }
}

enum OutboxDeliveryState {
  OUTBOX_DELIVERY_STATE_UNSPECIFIED = 0;
  OUTBOX_DELIVERY_STATE_PENDING = 1;
  OUTBOX_DELIVERY_STATE_RETRY_SCHEDULED = 2;
  OUTBOX_DELIVERY_STATE_DELIVERING = 3;
  OUTBOX_DELIVERY_STATE_DEAD_LETTER = 4;
}

message OutboxDeliverySummary {
  EventId event_id = 1;
  OutboxDeliveryState state = 2;
  uint32 attempts = 3;
  Timestamp next_attempt_at = 4;
}

message OutboxDeliveryPage {
  repeated OutboxDeliverySummary items = 1;
  optional bytes next_cursor = 2;
}

message ListPendingOutboxDeliveriesRequest {
  bytes request_id = 1;
  PageRequest page = 2;
}

message ListPendingOutboxDeliveriesResponse {
  OutboxDeliveryPage page = 1;
}

enum OfflineMaintenanceOperationKind {
  OFFLINE_MAINTENANCE_OPERATION_KIND_UNSPECIFIED = 0;
  OFFLINE_MAINTENANCE_OPERATION_KIND_CREATE_BACKUP = 1;
  OFFLINE_MAINTENANCE_OPERATION_KIND_RESTORE_BACKUP = 2;
  OFFLINE_MAINTENANCE_OPERATION_KIND_RETIRE_BACKUP = 3;
}

enum OfflineMaintenanceReplacementConfirmation {
  OFFLINE_MAINTENANCE_REPLACEMENT_CONFIRMATION_UNSPECIFIED = 0;
