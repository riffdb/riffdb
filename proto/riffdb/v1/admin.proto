message ApplicationInstallationObservation {
  bytes campaign_id = 1;
  bytes plan_hash = 2;
  string contract_lineage = 3;
  ApplicationInstallationPhase phase = 4;
  repeated ApplicationInstallationStage completed_stages = 5;
  ApplicationInstallationStage next_stage = 6;
  ApplicationInstallationNextAction next_action = 7;
