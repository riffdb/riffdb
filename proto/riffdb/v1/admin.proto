enum ApplicationInstallationNextAction {
  APPLICATION_INSTALLATION_NEXT_ACTION_UNSPECIFIED = 0;
  APPLICATION_INSTALLATION_NEXT_ACTION_VALIDATE_LOCAL_ARTIFACTS = 1;
  APPLICATION_INSTALLATION_NEXT_ACTION_DEPLOY_CONTRACT = 2;
  APPLICATION_INSTALLATION_NEXT_ACTION_APPLY_MIGRATION = 3;
  APPLICATION_INSTALLATION_NEXT_ACTION_DEPLOY_QUERY_MODULES = 4;
  APPLICATION_INSTALLATION_NEXT_ACTION_DEPLOY_REACTIVE_MODULES = 5;
  APPLICATION_INSTALLATION_NEXT_ACTION_RECONCILE_ROLES = 6;
  APPLICATION_INSTALLATION_NEXT_ACTION_ROTATE_CREDENTIALS = 7;
