enum ContractMigrationFailureClass {
  CONTRACT_MIGRATION_FAILURE_CLASS_UNSPECIFIED = 0;
  CONTRACT_MIGRATION_FAILURE_CLASS_ARTIFACT_MISMATCH = 1;
  CONTRACT_MIGRATION_FAILURE_CLASS_INVALID_PREDECESSOR = 2;
  CONTRACT_MIGRATION_FAILURE_CLASS_PENDING_ADMISSION = 3;
  CONTRACT_MIGRATION_FAILURE_CLASS_CAPACITY_EXHAUSTED = 4;
  CONTRACT_MIGRATION_FAILURE_CLASS_DISK_UNAVAILABLE = 5;
  CONTRACT_MIGRATION_FAILURE_CLASS_STAGE_CORRUPT = 6;
