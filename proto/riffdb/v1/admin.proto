  CONTRACT_MIGRATION_FAILURE_CLASS_ROLLBACK_FAILED = 9;
}

message ContractMigrationOperation {
  bytes operation_id = 1;
  ContractMigrationOperationKind kind = 2;
  string contract_lineage = 3;
  bytes input_hash = 4;
  bytes parent_bundle_hash = 5;
  bytes candidate_bundle_hash = 6;
  bytes migration_bundle_hash = 7;
  ContractMigrationPhase phase = 8;
  ContractMigrationFailureClass failure = 9;
  string backup_name = 10;
