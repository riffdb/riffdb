}

message CheckContractMigrationRequest {
  bytes request_id = 1;
  bytes operation_id = 2;
  bytes candidate_bundle = 3;
  bytes migration_bundle = 4;
}

message CheckContractMigrationResponse {
  ContractMigrationStartDisposition disposition = 1;
  ContractMigrationOperation operation = 2;
}

message ApplyContractMigrationRequest {
  bytes request_id = 1;
  bytes operation_id = 2;
  bytes candidate_bundle = 3;
  bytes migration_bundle = 4;
  ContractMigrationApplyConfirmation confirmation = 5;
  bytes confirmed_migration_hash = 6;
}

message ApplyContractMigrationResponse {
  ContractMigrationStartDisposition disposition = 1;
  ContractMigrationOperation operation = 2;
}

message GetContractMigrationOperationRequest {
  bytes request_id = 1;
  bytes operation_id = 2;
}

message GetContractMigrationOperationResponse {
  oneof result {
    Unit not_found = 1;
    ContractMigrationOperation found = 2;
  }
}

enum ApplicationInstallationStage {
  APPLICATION_INSTALLATION_STAGE_UNSPECIFIED = 0;
  APPLICATION_INSTALLATION_STAGE_PREFLIGHT = 1;
  APPLICATION_INSTALLATION_STAGE_CONTRACT = 2;
  APPLICATION_INSTALLATION_STAGE_MIGRATION = 3;
  APPLICATION_INSTALLATION_STAGE_QUERY_MODULES = 4;
  APPLICATION_INSTALLATION_STAGE_REACTIVE_MODULES = 5;
  APPLICATION_INSTALLATION_STAGE_ROLES = 6;
  APPLICATION_INSTALLATION_STAGE_CREDENTIALS = 7;
  APPLICATION_INSTALLATION_STAGE_DRIVER_PROOF = 8;
  APPLICATION_INSTALLATION_STAGE_SEEDS = 9;
  APPLICATION_INSTALLATION_STAGE_RECEIPT = 10;
  APPLICATION_INSTALLATION_STAGE_REIMPORT = 11;
}

enum ApplicationInstallationPhase {
  APPLICATION_INSTALLATION_PHASE_UNSPECIFIED = 0;
  APPLICATION_INSTALLATION_PHASE_RUNNING = 1;
  APPLICATION_INSTALLATION_PHASE_PARTIAL = 2;
  APPLICATION_INSTALLATION_PHASE_INSTALLED = 3;
}

enum ApplicationInstallationFailureCode {
  APPLICATION_INSTALLATION_FAILURE_CODE_UNSPECIFIED = 0;
  APPLICATION_INSTALLATION_FAILURE_CODE_LOCAL_ARTIFACT_MISMATCH = 1;
  APPLICATION_INSTALLATION_FAILURE_CODE_REMOTE_IDENTITY_MISMATCH = 2;
  APPLICATION_INSTALLATION_FAILURE_CODE_MIGRATION_GATE_REQUIRED = 3;
  APPLICATION_INSTALLATION_FAILURE_CODE_ROLE_WIDENING_APPROVAL_REQUIRED = 4;
