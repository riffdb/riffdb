syntax = "proto3";

package riffdb.v1;

import "riffdb/v1/commit.proto";
import "riffdb/v1/command.proto";
import "riffdb/v1/common.proto";
import "riffdb/v1/value.proto";

message EventFieldDescriptor {
  string name = 1;
  string value_type = 2;
}

message EventDescriptor {
  string contract_lineage = 1;
  uint64 contract_version = 2;
  bytes contract_bundle_hash = 3;
  string event_name = 4;
  bool application_streamable = 5;
  repeated EventFieldDescriptor partition_fields = 6;
  repeated EventFieldDescriptor payload_fields = 7;
}

message DescribeEventRequest {
  bytes request_id = 1;
  string event_name = 2;
}

message DescribeEventResponse {
  oneof result {
    Unit not_found = 1;
    EventDescriptor found = 2;
  }
}

message EventPartitionComponent {
  string name = 1;
  Value value = 2;
}

message EventSelection {
  string event_name = 1;
  repeated EventPartitionComponent partition = 2;
  repeated string selected_fields = 3;
}

message SymbolicEventField {
  string name = 1;
  Value value = 2;
}

message SymbolicEvent {
  EventId event_id = 1;
  string event_name = 2;
  uint64 writer_contract_version = 3;
  bytes writer_plan_hash = 4;
  string command_name = 5;
  bytes request_id = 6;
  bytes root_request_id = 7;
  EventId causing_event_id = 8;
  Timestamp occurred_at = 9;
  ActorKind actor_kind = 10;
  string provenance_uri = 11;
  uint64 history_incarnation = 12;
  repeated SymbolicEventField fields = 13;
}

message EventPage {
  repeated SymbolicEvent items = 1;
  bytes next_cursor = 2;
  EventId observed_upper = 3;
  uint64 history_incarnation = 4;
}

message ReplayEventsRequest {
  bytes request_id = 1;
  EventSelection selection = 2;
  EventId after_event_id = 3;
  PageRequest page = 4;
  uint64 observed_history_incarnation = 5;
}

message ReplayEventsResponse {
  EventPage page = 1;
}

message TailEventsRequest {
  bytes request_id = 1;
  EventSelection selection = 2;
  EventId after_event_id = 3;
  PageRequest page = 4;
  uint64 maximum_wait_nanos = 5;
  uint64 observed_history_incarnation = 6;
}

message TailEventsResponse {
  EventPage page = 1;
  bool wait_timed_out = 2;
}

message EventConsumerParameter {
  string name = 1;
  Value value = 2;
}

message EventConsumerSelection {
  bytes reactive_module_hash = 1;
  string operation_name = 2;
  repeated EventConsumerParameter parameters = 3;
  string consumer_name = 4;
}

message EventConsumerCheckpoint {
  oneof position {
    Unit before_first = 1;
    EventId after_event_id = 2;
  }
}

message EventConsumerStatus {
  uint64 revision = 1;
  EventConsumerCheckpoint checkpoint = 2;
  uint64 history_incarnation = 3;
  uint32 live_leases = 4;
  uint32 retries = 5;
  uint32 dead_letters = 6;
}

message ConsumedEvent {
  SymbolicEvent event = 1;
  uint32 attempt = 2;
  bytes lease_token = 3;
  Timestamp expires_at = 4;
}

message ConsumeEventStreamRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  uint32 batch_limit = 3;
  uint32 in_flight_limit = 4;
  uint64 lease_seconds = 5;
  uint64 maximum_wait_nanos = 6;
}

message ConsumeEventStreamResponse {
  repeated ConsumedEvent events = 1;
  EventConsumerStatus status = 2;
  bool wait_timed_out = 3;
}

message AcknowledgeEventStreamRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  EventId event_id = 3;
  bytes lease_token = 4;
  uint64 history_incarnation = 5;
}

message NegativeAcknowledgeEventStreamRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  EventId event_id = 3;
  bytes lease_token = 4;
  uint64 history_incarnation = 5;
  uint64 retry_delay_nanos = 6;
}

message SeekEventStreamConsumerRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  EventConsumerCheckpoint checkpoint = 3;
}

message RetireEventStreamConsumerRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
}

message GetEventStreamConsumerStatusRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
}

enum EventConsumerMutationResult {
  EVENT_CONSUMER_MUTATION_RESULT_UNSPECIFIED = 0;
  EVENT_CONSUMER_MUTATION_RESULT_APPLIED = 1;
  EVENT_CONSUMER_MUTATION_RESULT_STATE_CHANGED = 2;
  EVENT_CONSUMER_MUTATION_RESULT_NOT_FOUND = 3;
  EVENT_CONSUMER_MUTATION_RESULT_OUTSTANDING_LEASE = 4;
  EVENT_CONSUMER_MUTATION_RESULT_STALE_LEASE = 5;
  EVENT_CONSUMER_MUTATION_RESULT_LEASE_EXPIRED = 6;
}

message EventConsumerMutationResponse {
  EventConsumerMutationResult result = 1;
}

message GetEventStreamConsumerStatusResponse {
  oneof result {
    Unit not_found = 1;
    EventConsumerStatus found = 2;
  }
}

message ConsumeContextualSubscriptionRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  uint64 maximum_wait_nanos = 3;
}

enum ContextualQueryCardinality {
  CONTEXTUAL_QUERY_CARDINALITY_UNSPECIFIED = 0;
  CONTEXTUAL_QUERY_CARDINALITY_ONE = 1;
  CONTEXTUAL_QUERY_CARDINALITY_MAYBE = 2;
  CONTEXTUAL_QUERY_CARDINALITY_MANY = 3;
}

message ContextualQueryRow {
  string entity = 1;
  repeated EventConsumerParameter fields = 2;
}

message ContextualQueryField {
  string name = 1;
  ContextualQueryCardinality cardinality = 2;
  repeated ContextualQueryRow rows = 3;
}

message ContextualHydration {
  string name = 1;
  string outcome = 2;
  repeated ContextualQueryField fields = 3;
}

message AvailableContextualReaction {
  string name = 1;
  string command_name = 2;
  uint32 command_id = 3;
  bytes causation_token = 4;
}

message ContextualWorkItem {
  ConsumedEvent delivery = 1;
  uint64 context_head = 2;
  repeated ContextualHydration hydrations = 3;
  repeated AvailableContextualReaction available_reactions = 4;
}

message ConsumeContextualSubscriptionResponse {
  repeated ContextualWorkItem items = 1;
  EventConsumerStatus status = 2;
  bool wait_timed_out = 3;
}

message AcknowledgeContextualSubscriptionRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  EventId event_id = 3;
  bytes lease_token = 4;
  uint64 history_incarnation = 5;
}

message NegativeAcknowledgeContextualSubscriptionRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  EventId event_id = 3;
  bytes lease_token = 4;
  uint64 history_incarnation = 5;
  uint64 retry_delay_nanos = 6;
}

message GetContextualSubscriptionStatusRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
}

message ExecuteContextualReactionRequest {
  bytes request_id = 1;
  EventConsumerSelection selection = 2;
  bytes causation_token = 3;
  string reaction_name = 4;
  ExecuteCommandRequest command = 5;
}
