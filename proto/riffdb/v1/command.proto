syntax = "proto3";

package riffdb.v1;

import "riffdb/v1/common.proto";
import "riffdb/v1/value.proto";

message ExecuteCommandRequest {
  bytes request_id = 1;
  string command_name = 2;
  optional uint64 expected_contract_version = 3;
  Value input = 4;
}

message ExecuteCommandResponse {
  enum CompletionStatus {
    COMPLETION_STATUS_UNSPECIFIED = 0;
    COMMITTED = 1;
    REPLAYED = 2;
    EXECUTED_READ_ONLY = 3;
  }

  CompletionStatus status = 1;
  uint64 commit_sequence = 2;
  uint64 contract_version = 3;
  bytes plan_hash = 4;
  string outcome_type = 5;
  Value outcome = 6;
  string provenance_uri = 7;
  string durability_mode = 8;
  optional string outcome_uri = 9;
  uint64 history_incarnation = 10;
}

// Bounded transport coalescing for ordinary independent commands. This is not
// an atomic transaction: every item retains its own authorization,
// idempotency, outcome, provenance, and audit lifecycle.
message ExecuteCommandBatchRequest {
  repeated ExecuteCommandRequest commands = 1;
}

message ExecuteCommandBatchResponse {
  repeated ExecuteCommandResponse responses = 1;
}

message GetOutcomeRequest {
  bytes request_id = 1;
  string contract_lineage = 2;
  string command_name = 3;
  string idempotency_key = 4;
  optional string outcome_uri = 5;
}

message GetOutcomeResponse {
  oneof result {
    Unit not_found = 1;
    ExecuteCommandResponse found = 2;
  }
}
