syntax = "proto3";

package riffdb.v1;

import "riffdb/v1/admin.proto";
import "riffdb/v1/command.proto";
import "riffdb/v1/commit.proto";
import "riffdb/v1/contract.proto";
import "riffdb/v1/discovery.proto";
import "riffdb/v1/event.proto";
import "riffdb/v1/live_query.proto";
import "riffdb/v1/projection.proto";
import "riffdb/v1/query.proto";
import "riffdb/v1/replication.proto";

service ReplicationService {
  rpc StreamChangelog(StreamChangelogRequest) returns (stream StreamChangelogResponse);
}

service ContractService {
  rpc ValidateContract(ValidateContractRequest) returns (ValidateContractResponse);
  rpc ExplainCommand(ExplainCommandRequest) returns (ExplainCommandResponse);
  rpc DeployContract(DeployContractRequest) returns (DeployContractResponse);
  rpc GetActiveContract(GetActiveContractRequest) returns (GetActiveContractResponse);
  rpc GetContractVersion(GetContractVersionRequest) returns (GetContractVersionResponse);
  rpc DiscoverCommandTools(DiscoverCommandToolsRequest) returns (DiscoverCommandToolsResponse);
  rpc DiscoverResources(DiscoverResourcesRequest) returns (DiscoverResourcesResponse);
  rpc GetReactiveWakeup(GetReactiveWakeupRequest) returns (GetReactiveWakeupResponse);
}

service CommandService {
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc ExecuteBatch(ExecuteCommandBatchRequest) returns (ExecuteCommandBatchResponse);
  rpc GetOutcome(GetOutcomeRequest) returns (GetOutcomeResponse);
}

service QueryService {
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc ScanIndex(ScanIndexRequest) returns (ScanIndexResponse);
  rpc QueryProjection(QueryProjectionRequest) returns (QueryProjectionResponse);
  rpc GetProjectionStatus(GetProjectionStatusRequest) returns (GetProjectionStatusResponse);
  rpc WatchNamedQuery(WatchNamedQueryRequest) returns (stream LiveQueryUpdate);
}

service CommitService {
  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
  rpc ScanCommits(ScanCommitsRequest) returns (ScanCommitsResponse);
  rpc SubscribeCommits(SubscribeCommitsRequest) returns (stream CommitNotification);
  rpc TraceProvenance(TraceProvenanceRequest) returns (TraceProvenanceResponse);
}

service EventService {
  rpc DescribeEvent(DescribeEventRequest) returns (DescribeEventResponse);
  rpc ReplayEvents(ReplayEventsRequest) returns (ReplayEventsResponse);
  rpc TailEvents(TailEventsRequest) returns (TailEventsResponse);
  rpc ConsumeEventStream(ConsumeEventStreamRequest) returns (ConsumeEventStreamResponse);
  rpc StreamEventConsumer(ConsumeEventStreamRequest) returns (stream ConsumeEventStreamResponse);
  rpc AcknowledgeEventStream(AcknowledgeEventStreamRequest) returns (EventConsumerMutationResponse);
  rpc NegativeAcknowledgeEventStream(NegativeAcknowledgeEventStreamRequest) returns (EventConsumerMutationResponse);
  rpc SeekEventStreamConsumer(SeekEventStreamConsumerRequest) returns (EventConsumerMutationResponse);
  rpc RetireEventStreamConsumer(RetireEventStreamConsumerRequest) returns (EventConsumerMutationResponse);
  rpc GetEventStreamConsumerStatus(GetEventStreamConsumerStatusRequest) returns (GetEventStreamConsumerStatusResponse);
  rpc ConsumeContextualSubscription(ConsumeContextualSubscriptionRequest) returns (ConsumeContextualSubscriptionResponse);
  rpc AcknowledgeContextualSubscription(AcknowledgeContextualSubscriptionRequest) returns (EventConsumerMutationResponse);
  rpc NegativeAcknowledgeContextualSubscription(NegativeAcknowledgeContextualSubscriptionRequest) returns (EventConsumerMutationResponse);
  rpc GetContextualSubscriptionStatus(GetContextualSubscriptionStatusRequest) returns (GetEventStreamConsumerStatusResponse);
  rpc ExecuteContextualReaction(ExecuteContextualReactionRequest) returns (ExecuteCommandResponse);
}

service AdminService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  rpc CreateCapability(CreateCapabilityRequest) returns (CreateCapabilityResponse);
  rpc RevokeCapability(RevokeCapabilityRequest) returns (RevokeCapabilityResponse);
  rpc ListPendingOutboxDeliveries(ListPendingOutboxDeliveriesRequest) returns (ListPendingOutboxDeliveriesResponse);
  rpc CreateOfflineBackup(CreateOfflineBackupRequest) returns (CreateOfflineBackupResponse);
  rpc RestoreOfflineBackup(RestoreOfflineBackupRequest) returns (RestoreOfflineBackupResponse);
  rpc RestoreArchivedBackup(RestoreArchivedBackupRequest) returns (RestoreArchivedBackupResponse);
  rpc RetireOfflineBackup(RetireOfflineBackupRequest) returns (RetireOfflineBackupResponse);
  rpc GetOfflineMaintenanceOperation(GetOfflineMaintenanceOperationRequest) returns (GetOfflineMaintenanceOperationResponse);
  rpc CheckContractMigration(CheckContractMigrationRequest) returns (CheckContractMigrationResponse);
  rpc ApplyContractMigration(ApplyContractMigrationRequest) returns (ApplyContractMigrationResponse);
  rpc GetContractMigrationOperation(GetContractMigrationOperationRequest) returns (GetContractMigrationOperationResponse);
  rpc StartApplicationInstallation(StartApplicationInstallationRequest) returns (StartApplicationInstallationResponse);
  rpc GetApplicationInstallation(GetApplicationInstallationRequest) returns (GetApplicationInstallationResponse);
  rpc StartApplicationExport(StartApplicationExportRequest) returns (StartApplicationExportResponse);
  rpc GetApplicationExportPage(GetApplicationExportPageRequest) returns (GetApplicationExportPageResponse);
  rpc GetApplicationExport(GetApplicationExportRequest) returns (GetApplicationExportResponse);
  rpc CancelApplicationExport(CancelApplicationExportRequest) returns (CancelApplicationExportResponse);
  rpc StartApplicationReimport(StartApplicationReimportRequest) returns (StartApplicationReimportResponse);
  rpc ApplyApplicationReimportPage(ApplyApplicationReimportPageRequest) returns (ApplyApplicationReimportPageResponse);
  rpc GetApplicationReimport(GetApplicationReimportRequest) returns (GetApplicationReimportResponse);
  rpc CancelApplicationReimport(CancelApplicationReimportRequest) returns (CancelApplicationReimportResponse);
}
