syntax = "proto3";

package riffdb.storage.v1;

import "riffdb/storage/v1/common.proto";

// Bound retention watermark (ADR-0085 Amendment 2).
// Advances only during offline retention maintenance; re-validated (never
// advanced) at startup. Sequence 0 means no history has been pruned.
message StoredRetentionWatermarkV1 {
  // Highest commit sequence that has been pruned (inclusive). 0 = unpruned.
  uint64 watermark_sequence = 1;
  // History incarnation at the time the watermark was written.
  uint64 history_incarnation = 2;
  // Self-hash over the bound fields (32 bytes).
  bytes watermark_hash = 3;
  // Registry digest CURRENT AT CHAIN ROOTING (32 bytes): the tombstone chain
  // root binds this recorded value, never the process's current digest, so
  // registry migrations cannot invalidate an existing chain. Present exactly
  // when watermark_sequence > 0 (a chain exists).
  optional bytes chain_root_registry_digest = 4;
}

// Operator holds that bind the fencing minimum (ADR-0085 Amendment 2).
// Bounded list of named holds; managed by offline maintenance verbs.
message StoredRetentionHoldsV1 {
  repeated RetentionHoldV1 holds = 1;
}

enum RetentionHoldKindV1 {
  RETENTION_HOLD_KIND_V1_UNSPECIFIED = 0;
  // Operator sequence floor: binds the fencing minimum.
  RETENTION_HOLD_KIND_V1_OPERATOR = 1;
  // Projection detached from the fencing minimum (hold_id is the decimal
  // projection ID; sequence carries no meaning and is stored as 0). Removed
  // only by the audited projection-reattach administration action, never by
  // plain hold removal.
  RETENTION_HOLD_KIND_V1_PROJECTION_DETACH = 2;
}

message RetentionHoldV1 {
  // Operator-chosen identifier (unique within the holds list).
  string hold_id = 1;
  // Sequence floor this hold enforces (watermark must not exceed).
  uint64 sequence = 2;
  // Human-readable reason for the hold.
  string reason = 3;
  // Typed hold kind (never inferred from hold_id shape).
  RetentionHoldKindV1 kind = 4;
}

enum RetentionAdministrationActionV1 {
  RETENTION_ADMINISTRATION_ACTION_V1_UNSPECIFIED = 0;
  RETENTION_ADMINISTRATION_ACTION_V1_PROJECTION_DETACH = 1;
  RETENTION_ADMINISTRATION_ACTION_V1_PROJECTION_REATTACH = 2;
}

// Audited offline retention administration action (ADR-0085 Amendment 2):
// one record in the shared administration audit sequence space for every
// projection detach/reattach performed by the offline maintenance verbs.
message StoredRetentionAdministrationV1 {
  uint64 administration_sequence = 1;
  RetentionAdministrationActionV1 action = 2;
  // Stable nonzero projection ID the action targeted.
  uint64 projection_id = 3;
  // Operator-supplied reason.
  string reason = 4;
  // Operator-supplied wall-clock timestamp (the offline storage layer holds
  // no clock; the maintenance verb provides it).
  TimestampV1 timestamp = 5;
}

// Per-range history tombstone (ADR-0085 Amendment 2).
// Hash-chained like the contract-migration journal; chain root bound to the
// registry digest. Ranges are contiguous, non-overlapping, ascending, and
// abut the watermark.
message StoredHistoryTombstoneV1 {
  // First commit sequence covered by this tombstone (inclusive).
  uint64 first_sequence = 1;
  // Last commit sequence covered by this tombstone (inclusive).
  uint64 last_sequence = 2;
  // Per-table pruned-row counts for the four v1-pruned tables.
  uint64 commits_count = 3;
  uint64 events_count = 4;
  uint64 outbox_count = 5;
  uint64 outbox_status_count = 6;
  // Content digest over the pruned rows in this range (32 bytes).
  bytes content_digest = 7;
  // Previous tombstone hash, if any (32 bytes when present).
  optional bytes previous_tombstone_hash = 8;
  // This tombstone's chained hash (32 bytes).
  bytes tombstone_hash = 9;
  // History incarnation at prune time.
  uint64 history_incarnation = 10;
}
