syntax = "proto3";
package riffdb.storage.v1;
import "riffdb/storage/v1/replication_source_hold_v1.proto";
import "riffdb/storage/v1/changelog_history_state_v3.proto";

// ADR-0178 registration/budget metadata in ADR-0186's existing SourceOnly table.
// V1 fields, owner/key tags and schema hash remain immutable. This successor
// carries follower registration policy, never application or pruning authority.
message StoredReplicationSourceHoldV2 {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_AWAITING_BOOTSTRAP = 1;
    PHASE_ATTACHED = 2;
    PHASE_RETIRED = 3;
  }
  StoredReplicationSourceHoldV1 hold = 1;
  StoredChangelogHistoryStateV3.Position registered_at = 2;
  uint64 hold_budget_sequences = 3;
  optional uint64 expires_at_application_sequence = 4;
  Phase phase = 5;
  StoredChangelogHistoryStateV3.Position degraded_at = 6;
}
