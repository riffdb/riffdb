syntax = "proto3";

package riffdb.storage.v1;

import "riffdb/storage/v1/capability.proto";
import "riffdb/storage/v1/capability_migration.proto";

// Additive application-installation authority kept outside frozen V1 and V2 schemas.
message CapabilityInstallationGrantExtensionV1 {
  repeated string contract_lineages = 1;
  bool approval_required = 2;
}

// One atomic capability value whose migration-only predecessor remains exact.
message CapabilityRecordV3 {
  CapabilityRecordV1 base = 1;
  CapabilityMigrationGrantExtensionV1 migration = 2;
  CapabilityInstallationGrantExtensionV1 installation = 3;
}
