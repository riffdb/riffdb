[book]
title = "RiffDB Handbook"
authors = ["RiffDB contributors"]
description = "Build and operate contract-first applications with RiffDB"
language = "en"
src = "docs"

[build]
build-dir = "target/handbook"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["docs/theme/riffdb.css"]
additional-js = ["docs/theme/riffdb.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.print]
enable = true
