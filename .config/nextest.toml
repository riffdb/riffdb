nextest-version = "0.9.137"
experimental = ["wrapper-scripts"]

[scripts.wrapper.harnessless]
command = { command-line = "scripts/nextest-harnessless", relative-to = "workspace-root" }

[profile.ci]
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }

[[profile.ci.overrides]]
# This campaign performs several complete bootstrap/recovery cycles. A pristine
# baseline takes about 117s, leaving no margin under the general 120s ceiling.
# Keep every in-test 30s readiness/progress deadline and every crash assertion.
filter = 'binary_id(=riffdb-server::replication_follower) & test(=bootstrap_to_tail_fence_is_gap_free_across_crash)'
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }

[[profile.ci.scripts]]
filter = 'binary_id(=riffdb-testkit-server::full_recovery_matrix) | binary_id(=riffdb-testkit-server::offline_maintenance_matrix) | binary_id(=riffdb-testkit-server::contract_migration_gate_a) | binary_id(=riffdb-testkit-server::remote_ingress) | binary_id(=riffdb-testkit-server::remote_deployment_rotation)'
list-wrapper = "harnessless"
run-wrapper = "harnessless"
