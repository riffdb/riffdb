nextest-version = "0.9.137"
experimental = ["wrapper-scripts"]

[scripts.wrapper.harnessless]
command = { command-line = "scripts/nextest-harnessless", relative-to = "workspace-root" }

[profile.ci]
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }

[[profile.ci.overrides]]
# This campaign performs several complete bootstrap/recovery cycles. A pristine
# baseline takes about 117s, leaving no margin under the general 120s ceiling.
# Keep bounded in-test readiness/progress waits and every crash assertion.
filter = 'binary_id(=riffdb-server::replication_follower) & test(=bootstrap_to_tail_fence_is_gap_free_across_crash)'
# Repeated immediate-durability recovery competes with other crash campaigns
# for storage. Reserve the runner while exercising the bounded lifecycle waits.
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }

[[profile.ci.overrides]]
# Thirty-two durable recovery-stage copies plus cleanup verification exceeded
# the generic 120s limit while competing with other disk-heavy CI campaigns.
# Keep all iterations and assertions; reserve the runner and bound the campaign.
filter = 'binary_id(=riffdb-storage-redb::maintenance) & test(=recovery_stage_failures_and_retries_leave_no_pre_receipt_inventory)'
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }

[[profile.ci.overrides]]
# This harnessless gate already owns a 600s terminal-state hang ceiling plus
# bounded startup/shutdown phases. The synthetic nextest wrapper must allow
# those original bounds to finish and report their semantic result.
filter = 'binary_id(=riffdb-testkit-server::contract_migration_gate_a)'
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "30s", terminate-after = 24, grace-period = "10s" }

[[profile.ci.overrides]]
# These two complete replication campaigns contend for durable I/O with other
# recovery tests. Preserve their exact frontier assertions and bounded progress
# waits while giving each campaign the runner and a bounded budget.
filter = 'binary_id(=riffdb-server::replication_follower) & (test(=follower_applies_exact_prefix_byte_faithfully) | test(=replication_stream_resumes_gap_free_after_repeated_kills))'
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }

[[profile.ci.overrides]]
# These process tests reuse their selected TCP ports across offline maintenance
# and server restarts. Reserve the runner so another process test cannot claim
# a temporarily unbound port; keep every lifecycle deadline and restore assertion.
filter = 'binary_id(=riffdb-server::replication_archive_restore)'
threads-required = "num-test-threads"
priority = 100

[[profile.ci.overrides]]
# The recovery matrix performs real durable copies, archive reconstruction,
# and per-event status transactions. Concurrent campaigns exhausted the generic
# 120s watchdog on hosted storage. Keep all crash schedules and assertions,
# reserve the runner's I/O, and retain a bounded per-campaign hang guard.
filter = 'binary_id(=riffdb-storage-redb::storage_recovery_matrix)'
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "30s", terminate-after = 8, grace-period = "10s" }

[[profile.ci.scripts]]
filter = 'binary_id(=riffdb-testkit-server::full_recovery_matrix) | binary_id(=riffdb-testkit-server::offline_maintenance_matrix) | binary_id(=riffdb-testkit-server::contract_migration_gate_a) | binary_id(=riffdb-testkit-server::remote_ingress) | binary_id(=riffdb-testkit-server::remote_deployment_rotation)'
list-wrapper = "harnessless"
run-wrapper = "harnessless"
