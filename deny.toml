[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# ADR-0008 pins rmcp = "=2.2.0" with default-features = false and only server
# transport features enabled. Neither rmcp's OAuth client (RUSTSEC-2026-0457)
# nor its Streamable HTTP client (RUSTSEC-2026-0462) is compiled into RiffDB.
ignore = [
    "RUSTSEC-2026-0457",
    "RUSTSEC-2026-0462",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = []
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The pinned patches in the workspace Cargo.toml (hyperium/h2#980,
# cberner/redb#1354, bytecodealliance/rustix#1728). Remove each entry once an
# upstream release contains the change.
allow-git = [
    "https://github.com/koshea/h2",
    "https://github.com/koshea/redb",
    "https://github.com/koshea/rustix",
]
