---
# Source: riffdb/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: riffdb-config
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  riffdbd.toml: |
    [server]
    database = "/var/lib/riffdb/data/riffdb.redb"
    environment = "kubernetes-alpha"
    audience = "riffdb-container-application"
    capability_keys = "/run/riffdb-protected/capability.keys"
    idempotency_keys = "/run/riffdb-protected/idempotency.keys"

    [server.application_listener]
    mode = "direct_tls"
    listen = "0.0.0.0:7443"
    public_endpoint = "https://riffdb.riffdb-alpha.svc:7443"
    certificate_chain = "/run/riffdb-protected/server-chain.pem"
    private_key = "/run/riffdb-protected/server-key.pem"

    [server.application_listener.bounds]
    max_connections = 256
    max_streams_per_connection = 128
    handshake_timeout_seconds = 5
    idle_timeout_seconds = 60
    keepalive_interval_seconds = 20
    drain_timeout_seconds = 15

    [maintenance]
    backup_root = "/var/lib/riffdb/backups"
    # Without this, projections_root defaults to <cwd>/projections, and the
    # image's WORKDIR is /var/lib/riffdb -- which readOnlyRootFilesystem makes
    # unwritable, so the exact-text runtime cannot open and process graph
    # construction refuses with class=exact_text_runtime. Placing it inside the
    # data volume keeps derived state with the database it derives from.
    projections_root = "/var/lib/riffdb/data/projections"
  liveness.toml: |
    [client]
    endpoint = "https://riffdb.riffdb-alpha.svc:7443"
    database = "default"
    output = "json"
    max_attempts = 1
    # The probe dials the server's own TLS listener, so it needs the trust root
    # and the name the certificate is issued for. Without both, the probe fails
    # configuration_invalid and the pod never reports ready even though the
    # server is listening.
    tls_trust_root = "/run/riffdb-protected/riffdb-ca.pem"
    tls_server_name = "riffdb.riffdb-alpha.svc"
  readiness.toml: |
    [client]
    endpoint = "https://riffdb.riffdb-alpha.svc:7443"
    database = "default"
    output = "json"
    max_attempts = 1
    tls_trust_root = "/run/riffdb-protected/riffdb-ca.pem"
    tls_server_name = "riffdb.riffdb-alpha.svc"
---
# Source: riffdb/templates/proxy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: riffdb-proxy-config
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  haproxy.cfg: |
    global
      log stdout local0
    defaults
      mode tcp
      timeout connect 5s
      timeout client 60s
      timeout server 60s
    frontend riffdb_in
      bind :8443
      default_backend riffdb_out
    backend riffdb_out
      # Pass-through: TLS terminates at riffdbd, never at the proxy, so no
      # private key reaches this container.
      server riffdbd riffdb.riffdb-alpha.svc:7443
---
# Source: riffdb/templates/pvc-backups.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: riffdb-backups
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Backups must outlive the release. Losing them with an uninstall would
    # make restore-after-disk-loss untestable, which END-001 requires.
    helm.sh/resource-policy: keep
spec:
  accessModes: 
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
