# Source: riffdb/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: riffdb
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  # Readiness gates traffic, but the server must be addressable while it is
  # still bringing up its first contract, or bootstrap cannot reach it.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
  ports:
    - name: grpc-tls
      port: 7443
      targetPort: grpc-tls
---
# Source: riffdb/templates/proxy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riffdb-proxy
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: riffdb
      app.kubernetes.io/instance: riffdb
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riffdb
        app.kubernetes.io/instance: riffdb
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.1-alpine@sha256:475863a372c92c3dab3d59eafbbf8019dceebcd0c456594551b160ecdba4bdb9
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc-tls
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: riffdb-proxy-config
---
# Source: riffdb/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: riffdb
  namespace: riffdb-alpha
  labels:
    helm.sh/chart: riffdb-0.1.0
    app.kubernetes.io/name: riffdb
    app.kubernetes.io/instance: riffdb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: riffdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: riffdb
      app.kubernetes.io/instance: riffdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riffdb
        app.kubernetes.io/instance: riffdb
      annotations:
        # Roll the pod when the rendered configuration changes, so a values edit
        # applies rather than sitting inert until the next unrelated restart.
        riffdb.dev/config-checksum: 2376130e3a59a98ab7620d7d324dc2ed12587073917c93baa20779dba1621273
    spec:
      terminationGracePeriodSeconds: 25
      initContainers:
        # Copies secret material into a memory-backed volume with restricted
        # modes. riffdbd refuses group- or world-readable key files.
        - name: protect-server-secrets
          image: riffdb:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          command: ["copy-protected", "/incoming", "/protected"]
          volumeMounts:
            - name: server-secrets
              mountPath: /incoming
              readOnly: true
            - name: protected
              mountPath: /protected
      containers:
        - name: riffdbd
          image: riffdb:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["riffdbd", "--config", "/etc/riffdb/riffdbd.toml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc-tls
              containerPort: 7443
          livenessProbe:
            exec:
              command: ["riffdb", "--config", "/etc/riffdb/liveness.toml", "server", "health"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["riffdb", "--config", "/etc/riffdb/readiness.toml", "server", "health"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/riffdb
              readOnly: true
            - name: protected
              mountPath: /run/riffdb-protected
              readOnly: true
            - name: bootstrap-handoff
              mountPath: /run/riffdb-bootstrap
            - name: data
              mountPath: /var/lib/riffdb/data
            - name: backups
              mountPath: /var/lib/riffdb/backups
      volumes:
        - name: config
          configMap:
            name: riffdb-config
        - name: server-secrets
          secret:
            secretName: riffdb-server-secrets
            defaultMode: 256
        - name: protected
          emptyDir:
            medium: Memory
        - name: bootstrap-handoff
          emptyDir:
            medium: Memory
        - name: backups
          persistentVolumeClaim:
            claimName: riffdb-backups
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
