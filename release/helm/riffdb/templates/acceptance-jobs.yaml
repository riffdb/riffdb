{{- if .Values.acceptanceJobs.enabled }}
{{- $root := . }}
{{- $roles := list
      (dict "name" "application" "principal" "stable-application" "secret" .Values.acceptanceJobs.applicationSecretName)
      (dict "name" "operator" "principal" "operator" "secret" .Values.acceptanceJobs.operatorSecretName) -}}
{{- range $role := $roles }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "riffdb.fullname" $root }}-proof-{{ $role.name }}
  namespace: {{ include "riffdb.namespace" $root }}
  labels:
    {{- include "riffdb.labels" $root | nindent 4 }}
    riffdb.dev/proof-role: {{ $role.principal }}
spec:
  activeDeadlineSeconds: {{ $root.Values.acceptanceJobs.activeDeadlineSeconds }}
  backoffLimit: {{ $root.Values.acceptanceJobs.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "riffdb.selectorLabels" $root | nindent 8 }}
        riffdb.dev/proof-role: {{ $role.principal }}
    spec:
      restartPolicy: Never
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: protect-proof-secret
          image: {{ include "riffdb.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          command: ["copy-protected", "/incoming", "/protected"]
          volumeMounts:
            - name: proof-secret
              mountPath: /incoming
              readOnly: true
            - name: protected
              mountPath: /protected
      containers:
        - name: health
          image: {{ include "riffdb.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["riffdb"]
          args:
            - --endpoint
            - {{ include "riffdb.publicEndpoint" $root | quote }}
            - --database
            - default
            - --output
            - json
            - --max-attempts
            - "1"
            - --credential-file
            - /run/riffdb-proof/credential
            - server
            - health
          env:
            - name: RIFFDB_TLS_TRUST_ROOT
              value: /run/riffdb-proof/ca.pem
            - name: RIFFDB_TLS_SERVER_NAME
              value: {{ include "riffdb.serverName" $root | quote }}
          securityContext:
            runAsNonRoot: {{ $root.Values.podSecurityContext.runAsNonRoot }}
            runAsUser: {{ $root.Values.podSecurityContext.runAsUser }}
            runAsGroup: {{ $root.Values.podSecurityContext.runAsGroup }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.acceptanceJobs.resources | nindent 12 }}
          volumeMounts:
            - name: protected
              mountPath: /run/riffdb-proof
              readOnly: true
      volumes:
        - name: proof-secret
          secret:
            secretName: {{ $role.secret }}
            defaultMode: 256
        - name: protected
          emptyDir:
            medium: Memory
{{- end }}
{{- end }}
