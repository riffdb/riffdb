[workspace]
resolver = "3"
members = [
  "crates/riffdb-api-grpc",
  "crates/riffdb-application",
  "crates/riffdb-client-rust",
  "crates/riffdb-config",
  "crates/riffdb-contract-ir",
  "crates/riffdb-errors",
  "crates/riffdb-proto",
  "crates/riffdb-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Keep inherited SDK test dependencies resolvable even though the sealed-bundle
# smoke compiles only the public runtime surface. This exact pin mirrors the
# authoritative workspace and prevents a clean exported SDK from depending on
# ambient repository metadata.
tempfile = { version = "=3.24.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("server"))'] }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"
