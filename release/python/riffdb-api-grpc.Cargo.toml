[package]
name = "riffdb-api-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
client = ["tonic/channel"]

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto", default-features = false }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = { version = "=0.14.6", default-features = false }

[build-dependencies]
prost = { version = "=0.14.4", default-features = false, features = ["std"] }
prost-types = { version = "=0.14.4", default-features = false, features = ["std"] }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto", default-features = false }
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }

[lints]
workspace = true
