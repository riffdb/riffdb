[workspace]
resolver = "3"
members = [
    "crates/riffdb-api-grpc",
    "crates/riffdb-application",
    "crates/riffdb-client-python-native",
    "crates/riffdb-client-rust",
    "crates/riffdb-config",
    "crates/riffdb-contract-ir",
    "crates/riffdb-errors",
    "crates/riffdb-proto",
    "crates/riffdb-types",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[workspace.dependencies]
crc32c = { version = "=0.6.9", default-features = false }
pyo3 = { version = "=0.30.1", default-features = false, features = ["extension-module", "abi3-py313"] }
pyo3-async-runtimes = { version = "=0.30.0", default-features = false, features = ["tokio-runtime"] }
tempfile = { version = "=3.27.0", default-features = false }

[patch.crates-io]
h2 = { git = "https://github.com/koshea/h2", rev = "e9554c2cb105845d0ed6f0a7f89c8032ba24edba" }

