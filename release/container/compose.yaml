name: riffdb-remote-alpha

services:
  riffdbd:
    image: ${RIFFDB_IMAGE:-riffdb:remote-alpha}
    command: ["riffdbd", "--config", "/etc/riffdb/riffdbd.toml"]
    user: "${RIFFDB_CONTAINER_UID:-65532}:${RIFFDB_CONTAINER_GID:-65532}"
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    volumes:
      - ${RIFFDB_CONTAINER_ROOT:?set RIFFDB_CONTAINER_ROOT}/riffdbd.toml:/etc/riffdb/riffdbd.toml:ro
      - ${RIFFDB_CONTAINER_ROOT}/liveness.toml:/etc/riffdb/liveness.toml:ro
      - ${RIFFDB_CONTAINER_ROOT}/server-chain.pem:/run/secrets/server-chain.pem:ro
      - ${RIFFDB_CONTAINER_ROOT}/server-key.pem:/run/secrets/server-key.pem:ro
      - ${RIFFDB_CONTAINER_ROOT}/riffdb-ca.pem:/run/secrets/riffdb-ca.pem:ro
      - ${RIFFDB_CONTAINER_ROOT}/capability.keys:/run/secrets/capability.keys:ro
      - ${RIFFDB_CONTAINER_ROOT}/idempotency.keys:/run/secrets/idempotency.keys:ro
      - ${RIFFDB_CONTAINER_ROOT}/bootstrap:/run/bootstrap
      - ${RIFFDB_CONTAINER_ROOT}/data:/var/lib/riffdb/data
      - ${RIFFDB_CONTAINER_ROOT}/backups:/var/lib/riffdb/backups
    healthcheck:
      test: ["CMD", "riffdb", "--config", "/etc/riffdb/liveness.toml", "server", "health"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks: [riffdb]

  riffdb-proxy:
    image: haproxy:3.1-alpine@sha256:475863a372c92c3dab3d59eafbbf8019dceebcd0c456594551b160ecdba4bdb9
    restart: unless-stopped
    depends_on:
      riffdbd:
        condition: service_healthy
    ports:
      - "${RIFFDB_PROXY_PORT:-17443}:8443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [riffdb]

  application-probe:
    image: ${RIFFDB_IMAGE:-riffdb:remote-alpha}
    profiles: ["application"]
    user: "${RIFFDB_CONTAINER_UID:-65532}:${RIFFDB_CONTAINER_GID:-65532}"
    command: ["riffdb", "--config", "/etc/riffdb/application.toml", "server", "health"]
    read_only: true
    depends_on:
      riffdbd:
        condition: service_healthy
      riffdb-proxy:
        condition: service_started
    volumes:
      - ${RIFFDB_CONTAINER_ROOT}/application.toml:/etc/riffdb/application.toml:ro
      - ${RIFFDB_CONTAINER_ROOT}/application.credential:/run/secrets/application.credential:ro
      - ${RIFFDB_CONTAINER_ROOT}/riffdb-ca.pem:/run/secrets/riffdb-ca.pem:ro
    networks: [riffdb]

  operator-probe:
    image: ${RIFFDB_IMAGE:-riffdb:remote-alpha}
    profiles: ["operator"]
    user: "${RIFFDB_CONTAINER_UID:-65532}:${RIFFDB_CONTAINER_GID:-65532}"
    command: ["riffdb", "--config", "/etc/riffdb/operator.toml", "server", "health"]
    read_only: true
    depends_on:
      riffdbd:
        condition: service_healthy
      riffdb-proxy:
        condition: service_started
    volumes:
      - ${RIFFDB_CONTAINER_ROOT}/operator.toml:/etc/riffdb/operator.toml:ro
      - ${RIFFDB_CONTAINER_ROOT}/operator.credential:/run/secrets/operator.credential:ro
      - ${RIFFDB_CONTAINER_ROOT}/riffdb-ca.pem:/run/secrets/riffdb-ca.pem:ro
    networks: [riffdb]

networks:
  riffdb: {}
