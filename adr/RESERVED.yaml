# Numbers with no record in this directory.
#
# A generated index cannot show a number that is absent: the table skips it, and
# a reader cannot tell whether the decision exists somewhere else or was never
# written. ./scripts/adr-index refuses a gap that is not declared here.
#
# ./scripts/adr-new allocates max+1, so a number listed here is never reused;
# what a reservation buys is legibility, not collision safety. An entry is
# removed when its record lands, and the check fails if a reservation and a
# record both exist.
reserved:
  - adr: "0067"
    status: abandoned
    note: >-
      No record was ever written under this number, in any branch or any commit
      in this repository's history, and nothing references it.
  - adr: "0068"
    status: abandoned
    note: >-
      As ADR-0067.
  - adr: "0069"
    status: abandoned
    note: >-
      As ADR-0067.
  - adr: "0320"
    status: in-progress
    note: >-
      Symbolic public audit classification for native storage administration is
      being prepared separately for WP-825; its proposed record has not landed.
  - adr: "0321"
    status: in-progress
    note: >-
      Sealed projection-owned native replay source driver is held separately in
      WP-825 implementation review; its accepted record has not landed.
  - adr: "0322"
    status: in-progress
    note: >-
      Vendored native resource plans and bounded reclamation is held separately
      in WP-825 implementation review; its accepted proposal has not landed.
