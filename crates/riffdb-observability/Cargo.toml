[package]
name = "riffdb-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"] }

[[test]]
name = "telemetry_redaction"
path = "../../tests/observability/telemetry_redaction.rs"

[lints]
workspace = true
