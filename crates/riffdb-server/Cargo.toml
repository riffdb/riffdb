[package]
name = "riffdb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-fixtures = []

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
getrandom = { version = "=0.3.4", default-features = false }
riffdb-auth = { version = "0.1.0", path = "../riffdb-auth", default-features = false }
riffdb-api-mcp = { version = "0.1.0", path = "../riffdb-api-mcp", default-features = false, features = ["streamable-http"] }
riffdb-api-grpc = { version = "0.1.0", path = "../riffdb-api-grpc", default-features = false, features = ["server"] }
riffdb-catalog = { version = "0.1.0", path = "../riffdb-catalog", default-features = false }
riffdb-commit = { version = "0.1.0", path = "../riffdb-commit", default-features = false }
riffdb-conflict = { version = "0.1.0", path = "../riffdb-conflict", default-features = false }
riffdb-contract-ir = { version = "0.1.0", path = "../riffdb-contract-ir", default-features = false }
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false }
riffdb-idempotency = { version = "0.1.0", path = "../riffdb-idempotency", default-features = false }
riffdb-outbox = { version = "0.1.0", path = "../riffdb-outbox", default-features = false }
riffdb-observability = { version = "0.1.0", path = "../riffdb-observability", default-features = false }
riffdb-policy = { version = "0.1.0", path = "../riffdb-policy", default-features = false }
riffdb-projection = { version = "0.1.0", path = "../riffdb-projection", default-features = false }
riffdb-service = { version = "0.1.0", path = "../riffdb-service", default-features = false }
riffdb-storage-api = { version = "0.1.0", path = "../riffdb-storage-api", default-features = false }
riffdb-storage-redb = { version = "0.1.0", path = "../riffdb-storage-redb", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "=1.1.3", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "=0.14.6", default-features = false, features = ["router", "server"] }
tower-service = { version = "=0.3.3", default-features = false }

[dev-dependencies]
riffdb-client-rust = { version = "0.1.0", path = "../riffdb-client-rust", default-features = false }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto", default-features = false }
riffdb-storage-redb = { version = "0.1.0", path = "../riffdb-storage-redb", default-features = false, features = ["test-fixtures"] }
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "p1_riffdbd_restart"
path = "../../tests/grpc/p1_riffdbd_restart.rs"

[[test]]
name = "offline_maintenance_recovery"
path = "../../tests/maintenance/offline_maintenance_recovery.rs"

[[test]]
name = "server_composition"
path = "../../tests/server_composition/server_composition.rs"

[[test]]
name = "server_configuration"
path = "../../tests/server_configuration/server_configuration.rs"

[[bin]]
name = "riffdbd"
path = "src/main.rs"

[lints]
workspace = true
