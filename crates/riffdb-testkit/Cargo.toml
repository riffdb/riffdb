[[test]]
name = "contract_migration_gate_b"
path = "../../tests/migrations/contract_migration_gate_b.rs"

[[test]]
name = "contract_migration_gate_c"
path = "../../tests/migrations/contract_migration_gate_c.rs"

[[test]]
name = "contract_migration_acceptance"
path = "../../tests/migrations/contract_migration_acceptance.rs"

[[test]]
name = "durable_event_consumers"
path = "../../tests/durable_event_consumers.rs"

[[test]]
name = "live_named_queries"
path = "../../tests/live_named_queries.rs"

[[test]]
name = "contextual_agent_subscriptions"
path = "../../tests/contextual_agent_subscriptions.rs"

[[test]]
name = "reactive_ticketdesk_acceptance"
path = "../../tests/reactive_ticketdesk_acceptance.rs"

[[test]]
name = "remote_ingress"
