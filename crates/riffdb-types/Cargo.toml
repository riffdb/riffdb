[package]
name = "riffdb-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
# ADR-0172: the frozen `unicode_fold_v1` transform. Pinned exactly, because the
# Unicode version these crates carry decides durable index contents; an
# unpinned bump would silently re-fold every text index. The pin is asserted by
# `unicode_fold::tests::the_pinned_unicode_version_is_exact`.
caseless = { version = "=0.2.2", default-features = false }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
# ADR-0173: `standard_v1` durable term identity is Unicode 17.0.0 UAX #29
# word segmentation followed by `unicode_fold_v1`. Exact pinning and the
# analyzer conformance test prevent a dependency bump from silently changing
# deployed index contents.
unicode-segmentation = { version = "=1.13.3", default-features = false }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
