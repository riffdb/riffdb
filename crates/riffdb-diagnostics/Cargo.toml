[package]
name = "riffdb-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Syntax crates are intentional direct inputs to the diagnostic compatibility
# boundary even when the current renderer reaches their values through the
# compiler/module crates.
[package.metadata.cargo-machete]
ignored = ["riffdb-contract-syntax", "riffdb-riffql-syntax"]

[features]
default = []

[dependencies]
riffdb-contract-compiler = { version = "0.1.0", path = "../riffdb-contract-compiler", default-features = false }
riffdb-contract-ir = { version = "0.1.0", path = "../riffdb-contract-ir", default-features = false }
riffdb-contract-syntax = { version = "0.1.0", path = "../riffdb-contract-syntax", default-features = false }
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false }
riffdb-query-compiler = { version = "0.1.0", path = "../riffdb-query-compiler", default-features = false }
riffdb-query-module = { version = "0.1.0", path = "../riffdb-query-module", default-features = false }
riffdb-riffql-syntax = { version = "0.1.0", path = "../riffdb-riffql-syntax", default-features = false }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }

[dev-dependencies]
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }

[lints]
workspace = true
