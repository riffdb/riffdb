riffdb-query-syntax = { version = "0.1.0", path = "../riffdb-query-syntax", default-features = false }
riffdb-riffql-syntax = { version = "0.1.0", path = "../riffdb-riffql-syntax", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
riffdb-client-rust = { version = "0.1.0", path = "../riffdb-client-rust", default-features = false }
riffdb-contract-compiler = { version = "0.1.0", path = "../riffdb-contract-compiler", default-features = false }

