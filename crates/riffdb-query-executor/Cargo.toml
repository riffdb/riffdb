[package]
name = "riffdb-query-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Test-only constructors for cross-crate tests; never enabled by shipped code.
test-fixtures = ["riffdb-policy/test-fixtures"]

[dependencies]
riffdb-auth = { version = "0.1.0", path = "../riffdb-auth", default-features = false }
riffdb-contract-ir = { version = "0.1.0", path = "../riffdb-contract-ir", default-features = false }
riffdb-policy = { version = "0.1.0", path = "../riffdb-policy", default-features = false }
riffdb-projection = { version = "0.1.0", path = "../riffdb-projection", default-features = false }
riffdb-query-ir = { version = "0.1.0", path = "../riffdb-query-ir", default-features = false }
riffdb-riffql-syntax = { version = "0.1.0", path = "../riffdb-riffql-syntax", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }

[lints]
workspace = true

[dev-dependencies]
riffdb-contract-compiler = { version = "0.1.0", path = "../riffdb-contract-compiler", default-features = false }
riffdb-query-compiler = { version = "0.1.0", path = "../riffdb-query-compiler", default-features = false }
