[package]
name = "riffdb-client-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
futures-util = { version = "=0.3.33", default-features = false, features = ["async-await", "std"] }
getrandom = { version = "=0.3.4", default-features = false }
riffdb-api-grpc = { version = "0.1.0", path = "../riffdb-api-grpc", default-features = false, features = ["client"] }
riffdb-api-frame = { version = "0.1.0", path = "../riffdb-api-frame", default-features = false }
riffdb-application = { version = "0.1.0", path = "../riffdb-application", default-features = false }
riffdb-config = { version = "0.1.0", path = "../riffdb-config", default-features = false }
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
rustls-webpki = { version = "=0.103.13", default-features = false, features = ["std"] }
# Already transitive via tonic; direct dep with only `time` for non-blocking
# Overloaded backoff (must not block the async runtime during saturation).
tokio = { version = "=1.52.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = { version = "=0.14.6", default-features = false }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
# Current-thread runtime for batch re-entry tests that exercise real Overloaded
# backoff sleeps via execute_retry_attempts (needs `rt` + `time`).
tokio = { version = "=1.52.0", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true
