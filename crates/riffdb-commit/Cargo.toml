[package]
name = "riffdb-commit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
riffdb-catalog = { version = "0.1.0", path = "../riffdb-catalog", default-features = false }
riffdb-conflict = { version = "0.1.0", path = "../riffdb-conflict", default-features = false }
riffdb-contract-ir = { version = "0.1.0", path = "../riffdb-contract-ir", default-features = false }
riffdb-idempotency = { version = "0.1.0", path = "../riffdb-idempotency", default-features = false }
riffdb-invariant = { version = "0.1.0", path = "../riffdb-invariant", default-features = false }
riffdb-policy = { version = "0.1.0", path = "../riffdb-policy", default-features = false }
riffdb-projection = { version = "0.1.0", path = "../riffdb-projection", default-features = false }
riffdb-runtime = { version = "0.1.0", path = "../riffdb-runtime", default-features = false }
riffdb-storage-api = { version = "0.1.0", path = "../riffdb-storage-api", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
tokio = { version = "=1.52.0", default-features = false, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
riffdb-contract-compiler = { version = "0.1.0", path = "../riffdb-contract-compiler", default-features = false }
riffdb-storage-redb = { version = "0.1.0", path = "../riffdb-storage-redb", default-features = false }
riffdb-testkit = { version = "0.1.0", path = "../riffdb-testkit", default-features = false }

[[test]]
name = "command_concurrency"
path = "../../tests/command_semantics/command_concurrency.rs"

[[test]]
name = "lost_response_replay"
path = "../../tests/command_semantics/lost_response_replay.rs"

[[test]]
name = "service_audit_ordering"
path = "../../tests/service_audit/service_audit_ordering.rs"

[[test]]
name = "control_plane_execution"
path = "../../tests/service_audit/control_plane_execution.rs"

[lints]
workspace = true
