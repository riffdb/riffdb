[package]
name = "riffdb-client-python-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
riffdb-client-rust = { version = "0.1.0", path = "../riffdb-client-rust", default-features = false }
riffdb-config = { version = "0.1.0", path = "../riffdb-config", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.52.0", default-features = false, features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
