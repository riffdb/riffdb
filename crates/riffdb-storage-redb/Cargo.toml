[package]
name = "riffdb-storage-redb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
benchmark-support = []
test-fixtures = ["riffdb-storage-api/test-fixtures"]

[dependencies]
cap-std = { version = "=4.0.2", default-features = false }
redb = { version = "=4.2.0", default-features = false }
riffdb-catalog = { version = "0.1.0", path = "../riffdb-catalog", default-features = false }
riffdb-policy = { version = "0.1.0", path = "../riffdb-policy", default-features = false }
riffdb-query-executor = { version = "0.1.0", path = "../riffdb-query-executor", default-features = false }
riffdb-projection = { version = "0.1.0", path = "../riffdb-projection", default-features = false }
riffdb-query-ir = { version = "0.1.0", path = "../riffdb-query-ir", default-features = false }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto" }
riffdb-storage-api = { version = "0.1.0", path = "../riffdb-storage-api" }
riffdb-types = { version = "0.1.0", path = "../riffdb-types" }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
riffdb-contract-compiler = { version = "0.1.0", path = "../riffdb-contract-compiler", default-features = false }
riffdb-query-compiler = { version = "0.1.0", path = "../riffdb-query-compiler", default-features = false }
riffdb-query-executor = { version = "0.1.0", path = "../riffdb-query-executor", default-features = false, features = ["test-fixtures"] }
riffdb-riffql-syntax = { version = "0.1.0", path = "../riffdb-riffql-syntax", default-features = false }
riffdb-storage-api = { version = "0.1.0", path = "../riffdb-storage-api", features = ["test-fixtures"] }

[[test]]
name = "storage_recovery_matrix"
path = "../../tests/storage_recovery/storage_recovery_matrix.rs"

[[test]]
name = "service_audit_recovery"
path = "../../tests/service_audit_recovery/service_audit_recovery.rs"

[[bench]]
name = "storage_baseline"
harness = false

[lints]
workspace = true

[[example]]
name = "generate_migration_durable_fixtures"
required-features = ["test-fixtures"]
