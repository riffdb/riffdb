[package]
name = "riffdb-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-fixtures = []

[dependencies]
riffdb-auth = { version = "0.1.0", path = "../riffdb-auth", default-features = false }
riffdb-contract-ir = { version = "0.1.0", path = "../riffdb-contract-ir", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }

[dev-dependencies]
# serde exists here ONLY so the compile-fail doctest can prove SecretValue
# is unserializable; it is not a production dependency of the policy crate.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
riffdb-testkit = { version = "0.1.0", path = "../riffdb-testkit", default-features = false }

[[test]]
name = "authorization_non_bypass"
path = "../../tests/authorization/authorization_non_bypass.rs"

[lints]
workspace = true
