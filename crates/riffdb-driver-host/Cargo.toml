[package]
name = "riffdb-driver-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "riffdb-driverd"
path = "src/main.rs"

[[bin]]
name = "riffdb-operator-driverd"
path = "src/operator_main.rs"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
riffdb-client-rust = { version = "0.1.0", path = "../riffdb-client-rust", default-features = false }
riffdb-application = { version = "0.1.0", path = "../riffdb-application", default-features = false }
riffdb-config = { version = "0.1.0", path = "../riffdb-config", default-features = false }
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.0", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "=1.1.3", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tokio = { version = "=1.52.0", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["channel"] }

[lints]
workspace = true
