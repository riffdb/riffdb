[package]
name = "riffdb-api-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
client = ["tonic/channel"]
server = [
    "dep:futures-util",
    "dep:riffdb-auth",
    "dep:riffdb-errors",
    "dep:riffdb-service",
    "dep:riffdb-types",
    "dep:tokio",
    "tonic/router",
    "tonic/server",
]

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["alloc"], optional = true }
riffdb-auth = { version = "0.1.0", path = "../riffdb-auth", default-features = false, optional = true }
riffdb-errors = { version = "0.1.0", path = "../riffdb-errors", default-features = false, optional = true }
riffdb-proto = { version = "0.1.0", path = "../riffdb-proto", default-features = false }
riffdb-service = { version = "0.1.0", path = "../riffdb-service", default-features = false, optional = true }
riffdb-types = { version = "0.1.0", path = "../riffdb-types", default-features = false, optional = true }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = { version = "=0.14.6", default-features = false }
tokio = { version = "=1.52.0", default-features = false, features = ["rt"], optional = true }

[build-dependencies]
prost = { version = "=0.14.4", default-features = false, features = ["std"] }
prost-types = { version = "=0.14.4", default-features = false, features = ["std"] }
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }

[dev-dependencies]
riffdb-client-rust = { version = "0.1.0", path = "../riffdb-client-rust", default-features = false }
riffdb-testkit = { version = "0.1.0", path = "../riffdb-testkit", default-features = false }
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "grpc_end_to_end"
path = "../../tests/grpc/grpc_end_to_end.rs"

[lints]
workspace = true
