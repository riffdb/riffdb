[package]
name = "riffdb-command-growth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
default-run = "riffdb-command-growth"

[workspace]
resolver = "3"

[dependencies]
# Runtime harness dependency (BenchRoot in main); not test-only — keep in [dependencies].
riffdb-bench-root = { path = "../../crates/riffdb-bench-root", version = "0.1.0", default-features = false }
riffdb-storage-redb = { path = "../../crates/riffdb-storage-redb", features = ["benchmark-support"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[[bin]]
name = "state-segment-projection"
path = "src/bin/state_segment_projection.rs"

[[bin]]
name = "journal-state-overlay"
path = "src/bin/journal_state_overlay.rs"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"
