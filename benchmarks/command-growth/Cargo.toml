[package]
name = "riffdb-command-growth"
version = "0.2.2"
edition = "2024"
rust-version = "1.99.1"
publish = false
default-run = "riffdb-command-growth"

[workspace]
resolver = "3"

[dependencies]
# Runtime harness dependency (BenchRoot in main); not test-only — keep in [dependencies].
riffdb-bench-root = { path = "../../crates/riffdb-bench-root", version = "0.2.2", default-features = false }
riffdb-storage-redb = { path = "../../crates/riffdb-storage-redb", features = ["benchmark-support"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[[bin]]
name = "state-segment-projection"
path = "src/bin/state_segment_projection.rs"

[[bin]]
name = "journal-state-overlay"
path = "src/bin/journal_state_overlay.rs"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[patch.crates-io]
redb = { git = "https://github.com/koshea/redb", rev = "fdb728c4097471323f5c1fa3f6fbb7f47d242882" }
rustix = { git = "https://github.com/koshea/rustix", rev = "12b1a39f8a327cdb554322b81b1bd04606b2fdd7" }
