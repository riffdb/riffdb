[package]
name = "riffdb-perf-surface"
version = "0.2.5"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "riffdb-perf-surface"
path = "src/main.rs"

[dependencies]
riffdb-contract-compiler = { path = "../../crates/riffdb-contract-compiler", version = "0.2.5", default-features = false }
riffdb-contract-ir = { path = "../../crates/riffdb-contract-ir", version = "0.2.5", default-features = false }
riffdb-client-rust = { path = "../../crates/riffdb-client-rust", version = "0.2.5", default-features = false }
riffdb-auth = { path = "../../crates/riffdb-auth", version = "0.2.5", default-features = false }
riffdb-types = { path = "../../crates/riffdb-types", version = "0.2.5", default-features = false }
riffdb-proto = { path = "../../crates/riffdb-proto", version = "0.2.5", default-features = false }
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[dev-dependencies]

[patch.crates-io]
h2 = { git = "https://github.com/koshea/h2", rev = "e9554c2cb105845d0ed6f0a7f89c8032ba24edba" }
rustix = { git = "https://github.com/koshea/rustix", rev = "12b1a39f8a327cdb554322b81b1bd04606b2fdd7" }
