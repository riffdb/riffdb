[package]
name = "riffdb-perf-surface"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
riffdb-contract-compiler = { path = "../../crates/riffdb-contract-compiler", version = "0.1.0", default-features = false }
riffdb-contract-ir = { path = "../../crates/riffdb-contract-ir", version = "0.1.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"
