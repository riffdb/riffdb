# RiffDB governance tiers (process version 2, cutover 2026-09-02).
#
# `rules` classify a change: the first matching rule wins for a single file and
# a change's tier is the maximum over its files. `checks` are path-triggered;
# `always` runs for every change. Glob semantics are documented in
# scripts/lib/riffdb_governance.rb and shared by work-package allowed_paths.
#
# Governance-cost baseline (./scripts/governance-cost --since 2026-06-01):
# 2026-09-01 baseline over 1273 commits: 101,477 governance lines against
# 1,771,277 other lines (1,872,754 total), a governance share of 5.4% of all
# changed lines, with 519 of those commits touching a governance path.
version: 1
cutover: "2026-09-02"
tiers:
  internal:
    ceremony: tests and acceptance only; no record required; commit message names the tier
  surface:
    ceremony: short-form decision record (ADR v2, surface tier) and human review of fixture diffs
  guarantee:
    ceremony: full decision record with exact-text acceptance before merge; human review
rules:            # first match wins per file; a change's tier is the maximum over its files
  - tier: guarantee
    paths:
      - crates/riffdb-commit/src/**
      - crates/riffdb-conflict/src/**
      - crates/riffdb-idempotency/src/**
      - crates/riffdb-auth/src/**
      - crates/riffdb-policy/src/**
      - crates/riffdb-runtime/src/**
      - crates/riffdb-invariant/src/**
      - crates/riffdb-storage-redb/src/store.rs
      - crates/riffdb-storage-redb/src/store/fresh_locator_validation.rs
      - crates/riffdb-storage-redb/src/columnar_projection_control.rs
      - crates/riffdb-storage-redb/src/journal.rs
      - crates/riffdb-storage-redb/src/command_authority.rs
      - crates/riffdb-storage-redb/src/validated_prefix.rs
      - crates/riffdb-storage-redb/src/clean_close.rs
      - crates/riffdb-storage-redb/src/retention.rs
      - crates/riffdb-storage-redb/src/gate.rs
      - crates/riffdb-storage-redb/src/startup.rs
      - crates/riffdb-storage-api/src/command_txn.rs
      - crates/riffdb-storage-api/src/admission.rs
      - crates/riffdb-storage-api/src/changelog.rs
      - crates/riffdb-storage-api/src/changelog_v2.rs
      - crates/riffdb-storage-api/src/capability.rs
      - crates/riffdb-storage-api/src/sequence.rs
      - crates/riffdb-api-mcp/src/handler.rs
      - crates/riffdb-api-mcp/src/observer.rs
      - AGENTS.md
  - tier: surface
    paths:
      - proto/**
      - crates/riffdb-proto/**
      - crates/riffdb-storage-api/**
      - crates/riffdb-storage-redb/src/layout.rs
      - crates/riffdb-storage-redb/src/keys.rs
      - crates/riffdb-storage-redb/src/codec.rs
      - crates/riffdb-storage-redb/src/format_upgrade.rs
      - crates/riffdb-storage-redb/src/format_preflight.rs
      - crates/riffdb-contract-syntax/**
      - crates/riffdb-riffql-syntax/**
      - crates/riffdb-reactive-syntax/**
      - crates/riffdb-query-syntax/**
      - crates/riffdb-contract-ir/**
      - crates/riffdb-query-ir/**
      - crates/riffdb-contract-compiler/**
      - crates/riffdb-query-compiler/**
      - crates/riffdb-query-module/**
      - crates/riffdb-operation-registry/**
      - crates/riffdb-api-grpc/**
      - crates/riffdb-api-mcp/**
      - crates/riffdb-client-rust/**
      - crates/riffdb-driver-host/**
      - crates/riffdb-client-python-native/**
      - crates/riffdb-cli/src/cli.rs
      - crates/riffdb-cli/src/output.rs
      - crates/riffdb-config/**
      - clients/**
      - templates/**
      - fixtures/**
      - release/**
      - SPEC.md
      - adr/**
  - tier: internal
    paths: ["**"]
checks:           # path-triggered checks; `run` entries are executed in order; all `when` globs are OR
  - when: [proto/**, crates/riffdb-proto/**, fixtures/**, release/**, crates/riffdb-query-module/**, templates/**, clients/**, crates/riffdb-operation-registry/**, crates/riffdb-cli/**]
    run: [./scripts/check-generated]
  - when: [release/**, crates/riffdb-storage-api/**, crates/riffdb-proto/**]
    run: [./scripts/check-version-topology]
  - when: [docs/**, crates/riffdb-cli/**, README.md]
    run: [./scripts/handbook check]
  - when: [crates/riffdb-contract-syntax/**, crates/riffdb-riffql-syntax/**, crates/riffdb-contract-compiler/**, crates/riffdb-query-compiler/**]
    run: [./scripts/downstream-adapter-check]
  - when: [crates/riffdb-columnar/src/batch/**, scripts/check-columnar-batch-architecture, scripts/check-workspace-policy]
    run: [./scripts/check-columnar-batch-architecture, ./scripts/check-columnar-batch-architecture --self-test]
  - when: [Cargo.toml, Cargo.lock, crates/*/Cargo.toml, deny.toml, xtask/**]
    run: [./scripts/check-workspace-policy, cargo deny check, cargo machete]
  - when: [adr/**, SPEC.md, work_packages.yaml, governance/**]
    run: [./scripts/check-requirement-coverage, ./scripts/check-adr-obligations,
      ./scripts/adr-new --self-test, ./scripts/adr-index --check,
      ./scripts/check-acceptance-commits, ./scripts/check-performance-freeze]
  - when: [crates/**]
    run: [./scripts/check-file-size-guard, ./scripts/check-panic-allowances]
  - when: [release/container/**, release/kubernetes/**, release/helm/**]
    run: [./scripts/check-container-startup, ./scripts/check-helm-render]
always:
  - cargo fmt --all -- --check
governance_paths:   # used by governance-cost
  - SPEC.md
  - work_packages.yaml
  - adr/**
  - AGENTS.md
  - docs/CONTRIBUTING.md
  - governance/**
scope:              # what check-allowed-paths permits beyond a package's own allowed_paths
  # Consequence paths: where a change's effects land, not where its scope is.
  # Every package may touch these without listing them. A package's own records
  # (the ADRs it names in required_adrs) are always allowed as well.
  always_allowed_paths:
    - adr/README.md
    - work_packages.yaml
    - SPEC.md
    - Cargo.lock
    - "**/generated/**"
    - fixtures/**
    - tests/**
    - docs/**
    - release/evidence/**
    - release/version-topology-v1.json
    - templates/**
    - clients/**
    - examples/**
    - evaluations/**
    - scripts/**
    - .config/**
  # A touched file outside scope fails the check only when it sits on one of
  # these tiers' paths. An internal-tier file outside scope is a warning.
  block_tiers: [surface, guarantee]
acceptance:         # accepting a record is a human act and must be visible as one
  # A v2 record accepted on or after this date must carry a non-empty
  # `acceptance:` front-matter reference naming who accepted it and how.
  reference_required_since: "2026-09-12"
  # A commit that sets a record to accepted may touch only these paths.
  own_commit_paths: [adr/**, work_packages.yaml, SPEC.md]
directives:         # standing maintainer directives; ./scripts/brief prints them first
  - id: D-001
    since: "2026-09-15"
    text: "While WP-757, WP-760, and WP-772 are open, new decision records adding
      functionality are restricted. Records needed to address discovered high or critical
      issues may be opened; this restriction must not block their investigation or repair.
      Those packages are otherwise executed, not re-decided. Implementation choices remain
      governed by D-003. Changing an accepted decision or a SPEC MUST still requires human
      acceptance of the exact decision record before the change is implemented."
  - id: D-002
    since: "2026-09-12"
    text: "Acceptance is the maintainer's decision, never the agent's. An agent never sets
      `status: accepted` on its own initiative. Once the maintainer has said a record is accepted,
      the agent makes the acceptance commit itself: set `status: accepted`, `accepted:`, and an
      `acceptance:` value quoting where and when the maintainer said so (for example
      `maintainer, in session, 2026-09-14`), regenerate the index, and commit only adr/**,
      work_packages.yaml, and SPEC.md. Do not ask the maintainer to perform the mechanics.
      `./scripts/check-acceptance-commits` enforces the standalone commit and the reference."
  - id: D-003
    since: "2026-09-14"
    text: "Inside an accepted record's decisions, the implementer decides. Apply this test:
      would the change alter the text of an accepted record's Decision section or a SPEC MUST,
      or add a durable identity, public surface, or guarantee that no accepted record names?
      If no, it is an implementation choice: make it, do not ask, and record it under
      `Decisions:` in the commit message and `decisions_taken:` in the closure block. If yes,
      propose a record and stop. Questions that are not stop conditions are batched into the
      closure report, not raised mid-package."
  - id: D-004
    since: "2026-09-14"
    text: "A closed set fixed by an accepted record (attribution tags, enum variants, namespace
      classes, error codes) may be completed by its implementing package, without asking, until
      the format's first durable write outside the test tree. The completion is recorded as an
      amendment in the record's own commit, touching only adr/**, in the form
      `Amendment N (completed by WP-NNN on <date>): <what was added and why>`, and is listed in
      `decisions_taken:`. Removing or reinterpreting a member of a closed set, or completing a
      set after its first durable write, remains a record change that stops."
  - id: D-005
    since: "2026-09-14"
    text: "A patch-level or security-advisory bump of a dependency that an accepted record already
      admits is an implementation choice, not a record change: make it, keep the exact pin, run
      `cargo deny check` and `cargo audit`, and record the version, the advisory or reason, and
      both results in `Decisions:` and `decisions_taken:`. If the pinning record names the exact
      version, update that one token in the record's own commit with the same line. A new
      dependency, a minor or major change to a pinned critical dependency, a feature-set change,
      or any bump that alters a public or durable behavior still stops under AGENTS.md."
