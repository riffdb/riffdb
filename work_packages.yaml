- id: WP-474
  name: Sealed entity post-image materialization
  depends_on: [WP-060, WP-065, WP-367, WP-458, WP-459, WP-472]
  objective: Retain the canonical fields and bytes already checked when deterministic evaluation
    creates an EntityPostImage, then reuse that sealed immutable representation when constructing
    the commit-time StoredEntityRecordV1 instead of deep-cloning and re-encoding the same record.
  requirements: [PERF-008, STO-002, TXN-041, TXN-042, TXN-044]
  required_adrs: [ADR-0004, ADR-0006, ADR-0059, ADR-0060, ADR-0061]
  allowed_paths: [SPEC.md, work_packages.yaml, crates/riffdb-storage-api/**,
    crates/riffdb-commit/**, tests/command_semantics/**, tests/storage_recovery/**,
    docs/SUMMARY.md, docs/performance/**]
  deliverables:
  - EntityPostImage owns one immutable Arc-backed canonical record and its exact canonical encoded
    bytes, both created together by the existing bounded canonical encoder
  - A narrow checked StoredEntityRecordV1 constructor consumes only a sealed EntityPostImage
    reference, commit-time version, and exact durable schema binding, revalidates the contract
    identity, and shares the immutable record and bytes without re-encoding
  - Ordinary command graph construction uses the sealed constructor; durable decoders, external
    fixtures, recovery, migration, and arbitrary semantic construction retain StoredEntityRecordV1::new
    and its complete canonical encoding, bound, and identity checks
  - Pointer-sharing and byte-equivalence tests prove the sealed and full constructors produce the
    same semantic record and exact durable envelope while malformed or mismatched bindings fail closed
  - No durable schema, envelope, payload, key, hash, record ordering, transaction membership,
    acknowledgement, uncertainty, authorization, or public application/transport behavior changes
  - Full public seed evidence records evaluation, validation/encoding/staging, commit, total seed,
    and representative unary latency, with revert required for a material regression
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-api --all-features
  - cargo +1.97.0 test -p riffdb-commit --all-features
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test -p riffdb-commit --test command_concurrency --test lost_response_replay
      --all-features
  - cargo +1.97.0 test --test storage_recovery_matrix
  - ./benchmarks/run-app-baseline --self-test
  - ./scripts/check-generated
  - ./scripts/check-requirement-coverage
  - ./scripts/handbook check
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: Evaluation and commit graph construction share one exact canonical entity post-image,
    external and recovered paths retain full validation, all semantic and recovery suites pass, and
    same-host evidence reduces validation/staging CPU or total seed without a material unary regression.
  human_review_triggers: *id001
- id: WP-475
  name: Retained canonical permission lookup
  depends_on: [WP-110, WP-378, WP-465]
  objective: Preserve complete fresh command authorization while retaining the exact ordered
    canonical keys already derived for an immutable capability permission set, eliminating one
    candidate-key allocation per binary-search comparison.
  requirements: [PERF-008, AAA-006, AAA-007]
  required_adrs: [ADR-0009, ADR-0060]
  allowed_paths: [SPEC.md, work_packages.yaml, crates/riffdb-types/**,
    crates/riffdb-policy/**, docs/SUMMARY.md, docs/performance/**]
  deliverables:
  - CapabilityPermissionsV1 constructs each exact canonical key once, sorts permission/key pairs by
    those bytes, rejects adjacent equal keys exactly as before, and retains keys in immutable Arc
    storage shared by grant clones
  - Exact permission membership builds only the requested target key and searches retained keys;
    all unparameterized, command, entity, index, projection, query, role, migration, stream, watch,
    and contextual-subscription permission identities retain byte-exact comparison
  - Current authorization still reloads the capability, samples fresh authorization time, validates
    principal/current identity, evaluates tenant/partition/field/approval obligations, and produces
    a new proof at every existing safe point
  - Public grant construction, slices, equality, canonical semantic bytes, durable encoding,
    decoding, redaction, denial taxonomy, and authorization results remain unchanged
  - Full public seed evidence records authorization CPU, total seed, and representative unary
    latency, with revert required for a material regression
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-types --all-features
  - cargo +1.97.0 test -p riffdb-policy --all-features
  - cargo +1.97.0 test -p riffdb-auth --all-features
  - ./benchmarks/run-app-baseline --self-test
  - ./scripts/check-generated
  - ./scripts/check-requirement-coverage
  - ./scripts/handbook check
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: Every authorization result and canonical grant byte remains exact, every fresh safe
    point still reloads and fully evaluates current authority, permission-set clones share retained
    immutable keys, and same-host evidence reduces authorization CPU or total seed without a
    material unary regression.
  human_review_triggers: *id001
- id: WP-476
  name: Constant-time durable shape dispatch
  depends_on: [WP-020, WP-065, WP-459]
  objective: Preserve the complete allocation-free durable Protobuf structural preflight while
    replacing its per-field linear rule scan with one compile-time-checked direct dispatch table
    for each closed durable shape.
  requirements: [PERF-008, STO-002, STO-020, STO-021]
  required_adrs: [ADR-0006, ADR-0060]
  allowed_paths: [SPEC.md, work_packages.yaml, crates/riffdb-proto/**,
    tests/storage_recovery/**, docs/SUMMARY.md, docs/performance/**]
  deliverables:
  - Every closed durable shape constructs a fixed direct field-number dispatch table at compile
    time, rejecting zero, out-of-range, duplicate, or over-limit internal rule declarations
  - Structural preflight performs one bounded table lookup for each parsed field while retaining
    the same allocation-free cursor, recursion depth, visited-field budget, packed-item budget,
    occurrence counts, wire-type checks, byte bounds, UTF-8 checks, and nested validation
  - Unknown field numbers, including numbers beyond the closed dispatch ceiling, remain ignored by
    structural preflight and are still rejected by the existing exact durable re-encode boundary
  - A recursive registry test compares direct dispatch with the prior linear rule definition for
    every field number and every root or nested durable shape
  - Malformed, noncanonical, and resource-limit errors retain their exact classification; durable
    schemas, descriptors, hashes, envelope bytes, record bytes, keys, and public interfaces do not change
  - Full public seed evidence records total seed and representative unary latency, with revert
    required for a material regression
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-proto --all-features
  - cargo +1.97.0 test --test storage_recovery_matrix
  - ./benchmarks/run-app-baseline --self-test
  - ./scripts/check-generated
  - ./scripts/check-requirement-coverage
  - ./scripts/handbook check
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: Every durable structural and semantic result remains exact, the direct table is proven
    equivalent to every closed rule set, all malformed and recovery suites pass, and same-host
    evidence reduces durable preflight CPU or total seed without a material unary regression.
  human_review_triggers: *id001
