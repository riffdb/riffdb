    crates/riffdb-storage-redb/**, crates/riffdb-storage-memory/**,
    crates/riffdb-commit/**, crates/riffdb-observability/**,
    tests/storage_recovery/**, tests/server_composition/**,
    examples/app-baseline/**, benchmarks/run-app-baseline,
    docs/SUMMARY.md, docs/architecture/**, docs/performance/**]
  deliverables:
  - Standard command staging constructs, validates, charges, and applies exact journal mutations to
    the writer-private overlay without opening a redb write transaction; hardened staging remains
    the independent two-phase redb oracle
  - FIFO successors evaluate and transaction-current validate against every complete private
    predecessor, with conflict authority transfer and disjoint same-snapshot proofs unchanged
  - A known journal fence atomically publishes the complete covered composite view before any
    result, audit, transient index, event, projection, outbox, subscription, or response release
  - Idle singletons use one immediate journal submission with no batching wait or redb apply;
    grouped commands retain all 256-transition, 16-MiB, scheduler, and independent-identity bounds
  - Standalone service-audit frames use the same overlay publication order; every redb-writing
    control-plane or lifecycle message remains a hard drain/checkpoint barrier
  - Deterministic concurrency and failpoint tests cover frame construction failure, overlay
    capacity, same-identity races, overlapping FIFO successors, fence failure/uncertainty, stale
    publication, cancellation, and result withholding
  acceptance_commands:
