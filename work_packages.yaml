  - ADR-0004
  - ADR-0005
  - ADR-0006
  - ADR-0007
  - ADR-0009
  - ADR-0010
  - ADR-0011
  - ADR-0012
  - ADR-0013
  - ADR-0016
  - ADR-0017
  - ADR-0018
  - ADR-0019
  - ADR-0021
  allowed_paths:
  - Cargo.lock
  - crates/riffdb-types/src/codec.rs
  - crates/riffdb-storage-api/**
  - crates/riffdb-storage-memory/**
  - crates/riffdb-testkit/Cargo.toml
  - crates/riffdb-testkit/src/lib.rs
  - crates/riffdb-testkit/src/model/**
  deliverables:
  - Bounded materialized ReadSnapshot and coordinator-driven atomic commit interfaces
  - Consuming command-candidate type state with count-only start, admission/current-dependency recheck, private
    validation and mutation-affected prefix derivation, same-transaction affected-epoch reads, exact sequence-free
    CommandWriteSetPlanV1 and semantic/conservative encoded-capacity reservation, sequence assignment only after
    reservation, retained intent/plan/assignment verification, and complete graph staging; the WP-060 interface and
    memory conformance use explicit synthetic charges and do not depend on the later WP-065 codec
  - Storage-API-owned EventHash derivation and constructor validation over the exact ADR-0011 EventId, EventTypeId,
    u32-length-framed canonical Value::Record preimage, including reciprocal commit/event/outbox mismatch rejection
  - Closed Next(nonzero) or Exhausted application/administration allocator semantics, including atomic multi-slot
    preflight for compound bootstrap
  - Semantic key/value records
  - Catalog, capability, outbox, and projection persistence ports
  - In-memory storage implementation
  - Ordered commit scan with a dedicated internal ceiling of 500 complete records and 16 MiB encoded page content;
    semantic commit records are never chunked and generic scan pages remain limited to 500 entries and 4 MiB
  - Integrity-check interface
  - Checked EvaluatedCommand and complete dependency-validation request, terminal non-commit admission transition,
    and memory conformance cases
  - Source-free Existing(DatabaseId) or NeedsInitialization probe, checked candidate initialization that atomically
    re-proves emptiness and returns any concurrent durable winner without candidate comparison, plus
    CommitIntent-carried ProvenanceId, collision/no-overwrite results, and architecture checks excluding
    clock/entropy from storage
  - StoredAdmittedProvenanceClaimsV1 admission fields and storage-structural DTOs with coordinator-private proof and
    write-authority conformance cases
  - StoredServiceAuditRecordV1 plus specialized ordered append/read, administration sequence, and compound bootstrap
    transitions, exact linked-result sum type, checked ADR-0021 target collection preserved without storage-side
    derivation, and pre-start/post-start phase invariants
  - Bounded capability record, token-lookup, bootstrap-marker, and closed capability transition semantics
  - Nonsecret readable digest-scheme/key inventories and fail-closed integrity results for every pending/terminal
    idempotency identity and active capability, without exposing operational key bytes to storage
  - Canonical absent outbox-status as initial Pending, no-orphan status transitions, reciprocal event/intent checks,
    and component-scoped projection/outbox structural findings distinct from authoritative readiness
  - Exact projection state, control, marker, lifecycle, retirement, checked apply/hash, query snapshot, lower
    continuation, status-read, and epoch/frontier-position semantics
  - Exact ADR-0019 retained metadata surface, canonical validity of absent deferred operational metadata, and
    architecture checks rejecting NodeId, clean-shutdown, persisted-integrity-result, or substitute placeholder
    types, keys, ports, and records
  - Engine-neutral StructuralEvidenceSession type-state, bounded HistoricalSemanticEvidence pages with an unambiguous
    exact-end result, and StructurallyOpened dormant-port handoff bound to one database/open session; initialization
    precedes evidence, no mutation port is available during the session, and failure releases no operational ports
  - Bounded IR-opaque exact-end evidence for every persisted entity key, index-entry key, and range-prefix key, carrying
    only the durable owner/reference facts needed for catalog-owned exact historical KeySchema validation
  - Memory conformance for initialization-before-evidence, exclusive noninterleaving scans, page continuation and
    exact-end coverage, session/database mismatch rejection, dropped/failed session behavior, and dormant ports that
    cannot become operational without the separate catalog-owned same-session ValidatedCatalogHistory
  acceptance_commands:
  - cargo test -p riffdb-storage-api -p riffdb-storage-memory
  exit_gate: Reference storage satisfies atomicity, pre-sequence reservation and no-gap ordering, exact event-hash,
    snapshot, metadata-deferral, startup type-state, exact-end historical-evidence, and model-state properties without
    introducing a storage-to-IR dependency.
  human_review_triggers: *id001
- id: WP-065
  name: Durable semantic record schema
  depends_on:
  - WP-020
  - WP-060
  objective: Freeze versioned durable semantic-record Protobuf messages and the one-way checked storage codec bridge
    before a concrete engine persists them.
  requirements:
  - STO-002
  - STO-020
  - STO-021
  - STO-022
  - VAL-003
  - TXN-031
  - EFF-003
  - MCP-046
