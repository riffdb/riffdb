  - name: offline_maintenance_matrix
    owner_crate: riffdb-testkit
    manifest: crates/riffdb-testkit/Cargo.toml
    path: ../../tests/recovery/offline_maintenance_matrix.rs
  exit_gate: Every failpoint produces exactly the allowed pre-commit or post-commit state with no sequence consumed by
    failed capacity/envelope checks and exact durable event-hash recomputation; migration failpoints restart through
    the complete V2-only validation path; synchronized TCP-response loss and post-commit process termination both
    recover the original result through a fresh public-client request without a second authoritative graph; offline
    maintenance failpoints reconcile only from exact receipt/filesystem evidence and preserve the accepted rewind
    semantics; every reopen performs complete authoritative integrity validation; and repeated recovery is stable
    without deferred metadata writes.
