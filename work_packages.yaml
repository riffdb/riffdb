  deliverables:
  - Per-point delta evidence for commit/flush latency, durable batch size, writer busy/idle time,
    command queue delay, dispatch selection, and compatibility splitting, with closed fixed labels
  - Fresh identical database state by default for 1/8/32/128-client read-only, write-only, and mixed
    sweeps; retained-history mode remains explicit and cannot satisfy concurrency-only gates
  - Exact per-operation logical and physical command rates plus process CPU, RSS, durable growth, and
