    crates/riffdb-contract-compiler/**, crates/riffdb-catalog/**, crates/riffdb-commit/**,
    crates/riffdb-cli/assets/editor/**, docs/**, fixtures/**, Cargo.toml, Cargo.lock, deny.toml]
