- id: WP-580
  name: DST foundation — simulator crate, simulated disk, redb backend adapter, determinism pin
  depends_on: [WP-478]
  objective: Begin ADR-0113 Phase 1 with a dev-only riffdb-sim crate whose seeded SimDisk
    (durable/volatile images, crash-torn unsynced writes, transient errors, capacity exhaustion)
    drives the pinned redb engine through redb's public StorageBackend seam, prove determinism
    with a versioned trace digest, and land the two commit-path hygiene items that freeze ambient
    nondeterminism out of conflict grouping and evaluation-pool sizing.
  requirements: [SIM-001, SIM-002, SIM-003, SIM-004, SIM-005, SIM-006, SIM-007]
  required_adrs: [ADR-0012, ADR-0113]
  allowed_paths: [Cargo.toml, Cargo.lock, SPEC.md, work_packages.yaml,
    adr/0113-deterministic-simulation-testing.md,
    crates/riffdb-sim/**, crates/riffdb-commit/src/command_execution.rs,
    crates/riffdb-commit/src/audit_executor.rs, crates/riffdb-commit/tests/architecture.rs,
    scripts/check-workspace-policy]
  deliverables:
  - Dev-only riffdb-sim crate (redb pinned at 4.1.0 as its only dependency, hand-rolled
    splitmix64, no clocks, no entropy crates, no hash-randomized collections) with SimDisk
    durable/volatile images, first-class crash and recovery, seeded keep/drop/prefix-truncate
    torn-write decisions at configurable granularity, transient errors, capacity exhaustion,
    and a versioned FNV trace chain over every operation and fault decision
  - SimBackend implementing redb's StorageBackend contract (zero-initialized growth,
    out-of-range refusal, fail-closed after close and across crash epochs) with a conformance
    suite
  - Phase-0 campaign; seeded single-table-per-transaction workloads under Durability::Immediate,
    crash-recover-continue loops with crashes placed inside the reopen window, a shadow BTreeMap
    oracle snapshotted at acknowledged durable commits with an explicit two-state acceptance
    while a commit is in flight, and the observed one-sync-per-Immediate-commit correspondence
    asserted from backend counters (a one-phase-commit precondition; two-phase commit doubles
    the sync count and the identity does not survive it)
  - Determinism pin (same seed twice, byte-identical trace and summary digests; different seed
    diverges) plus digest-sensitivity pins proving every fault family's decisions feed the
    versioned trace chain, plus a 32-seed sweep as the standing regression battery with
    live-fault-arm aggregate assertions
  - Architecture tests preventing riffdb-sim from entering any production dependency graph
    (driven from cargo metadata over the complete resolved member set, normal and build
    dependency kinds across all targets) and banning ambient time, entropy, and hash-randomized
    iteration from the simulator itself
  - Conflict-path HashSet-to-BTreeSet hygiene in riffdb-commit with an architecture pin, and the
    evaluation-pool worker count as an explicit constructor input with the
    available_parallelism-derived value as the production default at the existing call site
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-sim --all-features
  - cargo +1.97.0 test -p riffdb-commit --all-features
  - cargo +1.97.0 test -p riffdb-runtime --all-features
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  deferred:
  - Full SIM-003 evidence (AuthoritativeCommandModel equality at the recovered durable frontier,
    with model extension and the startup-validation plus structural-inspection passes on every
    simulated recovery) belongs to WP-582, the ADR-0113 oracle-wiring package; this package
    delivers the engine-level shadow-map form only
  - SIM-004 evidence (simulator-found failures retained as seed-replayable regression fixtures
    replayed per merge, nightly exploration budget) delivered by WP-583 (found-seed corpus with
    per-merge replay and the env-gated deep-exploration budget)
  - SIM-006 evidence (every storage-layer storage_recovery_matrix / RECOVERY_SCENARIOS arm
    reproduced as a pinned simulation schedule) delivered by WP-583 (campaign-covered pinned
    schedules plus the closed typed-exclusion classification)
  exit_gate: The same seed replays a byte-identical versioned trace digest through the full
    crash-recover-continue campaign, every fault arm is provably reachable, torn unsynced state
    never bricks or diverges the reopened engine from the shadow oracle for any swept seed, no
    production crate can link the simulator, and the commit conflict path carries no
    hash-randomized collection.
  standing_design_tests:
    interface_safety: No application-facing surface changes; the simulator is a dev-only crate
      unreachable from client, CLI, MCP, or SDK paths, and its absence from production dependency
      graphs is pinned by an architecture test.
    scale: Simulated disk state is bounded by the configured workload and capacity, campaigns run
      in seconds on one core, and the sweep budget is fixed by seed count rather than database
      size.
  human_review_triggers: *id001
