- id: WP-494
  name: Segmented independent command-audit link resolution
  depends_on: [WP-473, WP-479]
  objective: Restore replay of a known command outcome after ADR-0102 segmentation by resolving an
    independently supplied Command audit link through the canonical segment member instead of the
    pre-segmentation per-command commit and provenance rows, on both the audit append path and the
    startup structural-validation walk.
  requirements: [STO-002, STO-020, TXN-041, TXN-042, TXN-043, TXN-044, REC-001, REC-002]
  required_adrs: [ADR-0021, ADR-0058, ADR-0060, ADR-0099, ADR-0102]
  allowed_paths: [work_packages.yaml, crates/riffdb-storage-redb/**,
    tests/service/**, tests/service_audit/**, tests/storage_recovery/**]
  deliverables:
  - An independently supplied Command audit link resolves its commit through the shared segmented
    lookup, which proves the requested sequence lies inside the canonical segment, rather than an
    exact-key commit-row read that decodes a segment as a single commit record
  - Both halves of the link reciprocity (commit-to-provenance and provenance-to-commit) are proven
    from the one canonical segment member, because a segmented command owns no independent
    provenance row
  - The startup structural-validation walk reciprocates a Command audit link against the segment
    member when no provenance row exists, preserving the existing retention/prune tolerance and the
    permissive treatment of already-durable records
  - Pre-segmentation per-command commit rows, capsule revisions, and provenance rows retain their
    complete existing decoding and reciprocal identity checks
  - Replaying a known command returns its persisted outcome with the exact original commit sequence,
    provenance identity, and Succeeded audit link, and submits exactly one fused coordinator message
  - No durable format, key, transaction membership, acknowledgement, uncertainty, or public
    application/transport interface changes
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test -p riffdb-storage-api --all-features
  - cargo +1.97.0 test -p riffdb-commit --all-features
  - cargo +1.97.0 test -p riffdb-service --all-features
  - cargo +1.97.0 test --workspace --all-features
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: A known-command replay and a control-plane already-active replay each keep the exact
    original Succeeded link, the audit append and startup validation paths agree about which
    Command links are admissible under segmented authority, legacy row shapes remain fully decoded,
    and the full workspace suite passes.
  standing_design_tests:
    interface_safety: No. This restores an existing guarantee rather than adding surface. It changes
      only how storage internals resolve a durable link that is already established below the public
      boundary; no application-facing type, request, or option is added or relaxed, and the repaired
      behaviour makes idempotent replay honour its persisted outcome instead of returning a public
      outcome-unknown error.
    scale: No. Both resolutions are bounded point lookups against the same co-located redb authority
      already assumed by ADR-0102 — one predecessor range lookup plus in-segment membership proof.
      No new single-node memory residency, full-state rewrite, or whole-history scan is introduced,
      so the billion-row tier is not foreclosed any further than the accepted segmented design
      already does.
  human_review_triggers: *id001
- id: WP-491
  name: Changelog emitter core at the storage boundary
  depends_on: [WP-487, WP-488, WP-489]
  objective: Open the replication arc by attaching an ADR-0100 changelog emitter to the ADR-0101
    publication edge, so a first-party in-process consumer obtains exact, gap-free, checksummed
    changelog frames derived only from published durable snapshots, with no wire format, no
    capability, no RPC, and no durable state of its own.
  requirements: [PERF-015, PERF-017]
  required_adrs: [ADR-0019, ADR-0061, ADR-0082, ADR-0083, ADR-0085, ADR-0086,
    ADR-0093, ADR-0098, ADR-0100, ADR-0101, ADR-0102, ADR-0104]
  allowed_paths: [work_packages.yaml, crates/riffdb-types/**,
    crates/riffdb-storage-api/**, crates/riffdb-storage-redb/**,
    tests/storage_recovery/**]
  deliverables:
  - A dual-frontier pair type in riffdb-types addresses a changelog frame by application
    commit-sequence and administration-sequence, each independently optional with explicit
    unchanged encoding, compared under a partial componentwise order that refuses to call an
    incomparable pair an advance; CommitToken and ProjectionFrontier are untouched
  - A publication observer port in riffdb-storage-api receives one published durable-frontier
    advancement per publication as a wakeup carrying a pinned published snapshot; it is
    fire-and-forget, cannot fail, cannot wait on its consumer, and absorbs overflow as a typed
    lagging state instead of applying backpressure to the writer
  - A closed, versioned, canonically ordered, checksummed changelog frame and entry encoding that
    shares no magic, version space, or code path with the durability journal (ADR-0101 section 6,
    ADR-0104 section 8), with a length-delimited footer that discriminates a torn tail, plus a
    fail-closed validating decode covering database identity, history incarnation, frontier gaps,
    hash-chain continuity, per-class counts, canonical order, and checksum
  - The emitter derives every frame by range-reading and point-reading the pinned published
    snapshot for the covered interval only; it holds no storage handle, opens no transaction, and
    reads no journal byte or overlay internal, pinned by a source guard architecture test
  - The publication observer is called at all three durable-frontier publication sites strictly
    after the frontier swap, at the same release rank as every other covered effect; the default
    port observes nothing and changes no durable byte
  - Frame-boundary coalescing for a lagging emitter is a named deferral; v1 emits exactly one
    frame per observed advancement, and a resynced emitter re-anchors through the later bootstrap
    path rather than inventing boundaries ADR-0100 section 1 defines as observed facts
  - Differential exactness evidence applies every emitted frame to a bootstrap anchor and compares
    byte-for-byte against the materialized final published snapshot across command and
    service-audit frames; a supersession fixture writes one entity key in two separate fenced
    epochs and asserts the earlier frame carries the earlier post-image, so prefix exactness is
    proven at an intermediate frame boundary and not only at the final state
  - The redb-Immediate control-plane lane, which publishes durable frontiers for catalog,
    capability, query-module, reactive-module, migration and retention writes, is deliberately not
    observed; no frame covers it, rows it writes are only incidentally swept into a later frame's
    range read, and rows before the first or after the last observed advancement are never emitted.
    The frame chain is an exact gap-free tail, never a complete history from empty, and RE3's
    bootstrap is the only correct way to close that. Recorded on ChangelogPublicationPort and at
    the lane itself
  - The ADR-0100 section 2 gating obligation is discharged by a falsifiable test in which a
    sealed applied-but-unflushed sibling subgroup is invisible to the framing pass, and neutering
    the gate turns exactly that test red
  - No durable table, meta key, ServiceOperationV1 variant, capability kind, proto message, server
    configuration, lifecycle stage, or MCP surface is added
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-types --all-features
  - cargo +1.97.0 test -p riffdb-storage-api --all-features
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test --test storage_recovery_matrix --all-features
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  design_tests:
    interface_safety: RE1 adds no application-facing interface. The port, snapshot, frame, and
      consumer types are internal crate surfaces consumed only by first-party storage and by the
      later replication packages; no application developer or agent can reach them, and no public
      operation, capability, tool, or configuration is added. Unsafety is unexpressible rather than
      merely discouraged. The one read capability an emitter is handed is a pinned published
      snapshot, so opting out of the durability guarantee is not a call it can make wrongly; it is
      a call it cannot make at all. Every decode fails closed, and every stop is typed rather than
      silent.
    scale: The emitter reads published snapshots through the same bounded range-scan discipline as
      every other reader, over the covered sequence interval only; it never rewrites or rescans
      full state, and its per-frame work is bounded by the same flush-cover ceiling ADR-0101
      section 3 already imposes. It holds no durable state and no second bookkeeping structure.
      The only co-location it assumes is the in-process consumer ADR-0093 section 1 already
      records for a local emitter; nothing in the frame, its addressing, or its validation assumes
      one node, and the bounded delivery buffer converts a slow consumer into typed lag rather than
      into memory growth.
  exit_gate: An in-process consumer receives a gap-free checksummed frame chain whose entries
    reconstruct the published snapshot byte-for-byte, an applied-but-unflushed subgroup is provably
    invisible with a recorded falsifiability transcript, a stalled consumer never delays
    publication, and no durable, registry, transport, or public surface changes.
  human_review_triggers: *id001
- id: WP-492
  name: Projected aggregate and group-by wire carriage (CP2b deferral closure)
  depends_on: [WP-433, WP-434]
  objective: Finish the deliberately deferred half of the ADR-0087 projected grammar — the engine
    has folded count/sum/min/max and bounded group-by since CP2a and the service has authorized
    and carried those results since CP2b, but the wire rejected every aggregate body typed because
    no response arm existed. Add the response arm, the conversion lowering, the SDK facade, and
    the CLI verb so a bounded aggregate is expressible and readable end to end.
  requirements: []
  required_adrs: [ADR-0086, ADR-0087, ADR-0011]
  allowed_paths: [work_packages.yaml, docs/reference/CLI.md, proto/riffdb/app/v1/application.proto,
    fixtures/proto/**, crates/riffdb-proto/**, crates/riffdb-api-grpc/**, crates/riffdb-service/**,
    crates/riffdb-client-rust/**, crates/riffdb-cli/**, tests/service/**]
  deliverables:
  - ExecuteProjectedQueryResponse gains one aggregate arm at tag 8 carrying group key names, an
    echo of the request's aggregate descriptors, groups, and the same frontier/head/commit_token
    a row Ready carries; a whole-set aggregate is exactly one group with an empty key list, with
    no second ungrouped response shape
  - ProjectedQueryBody field 7 becomes repeated aggregates; the singular form was rejected typed
    from the day it was defined so no client can have used it, and proto3 encodes both identically
  - Aggregate sums ride as a scale-0 riffdb.v1.Decimal through one encoder/decoder pair shared by
    the adapter and the SDK, exact across the full i128 range, with no asserted precision and no
    floating point anywhere on the path
  - An empty group's MIN/MAX is carried by field absence and stays distinguishable from a real
    NULL extreme over an optional column
  - Response encoding governs the two row arms only; requesting PACKED with an aggregate body is
    documented and pinned as inapplicable rather than an error
  - Group emission order is the engine's encoded-group-key byte order, documented on the wire,
    never re-sorted by the service, the adapter, the SDK, or the CLI, and verified strictly
    ascending on decode so a repeated key cannot double-count in a folding caller
  - The declared row limit bounds grouped output volume - the service clamps the grouping budget
    to the authorized row count before execution, and an overrun stays a typed rejection
  - The SDK checks every aggregate response against the request that produced it - echoed group
    key names, echoed descriptors, and exactly one empty-key group for a whole-set fold - so a
    self-consistent answer to a different question cannot pass
  - The conversion handles every engine result variant exhaustively; the wildcard that silently
    dropped non-row results is gone and a future variant breaks compilation
  - Projected plan hashes incorporate group keys and aggregate op kinds so a filter and an
    aggregate over the same columns no longer collide, with row-shaped plan hashes pinned
    byte-identical to their pre-extension values
  - SDK builder gains repeatable aggregate and group_by, a typed ReadyAggregates outcome, and
    decode rigor mirroring the packed decoder — per-group arity, descriptor/arm agreement,
    bounded sum coefficients, and arm-versus-request cross-checks in both directions
  - riffdb query projected gains repeatable --aggregate OP:FIELD (bare count) and --group-by FIELD
    with a JSON renderer that keeps wide sums as decimal strings
  - Differential truth acceptance over real storage, real columnar apply, and real authorization
    — every engine fold equals the same value recomputed client-side from the row results of the
    same query, plus org isolation, typed budget rejections, empty-set identity values, a typed
    actionable money-sum rejection, and shape-independent causal frontier and token
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-proto --all-features
  - cargo +1.97.0 test -p riffdb-api-grpc --all-features
  - cargo +1.97.0 test -p riffdb-api-grpc
  - cargo +1.97.0 test -p riffdb-service --test projected_read_acceptance --all-features
  - cargo +1.97.0 test -p riffdb-client-rust --all-features
  - cargo +1.97.0 test -p riffdb-cli --all-features
  - ./scripts/generate-proto --check
  - ./scripts/generate-cli-reference --check
  - ./scripts/check-handbook-source
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  design_tests:
    interface_safety: An aggregate adds no unsafe expressibility, on either the field axis or
      the volume axis. Fields - an aggregate is authorized against the union of selected,
      predicate, order, group-key, and aggregate-input fields that ADR-0086 section 5 already
      required, so it cannot read a column a row read could not, and it is confined to exactly
      one organization scope. Volume - grouped output is bounded by the minimum of the caller's
      declared row limit and the server grouping budget; the service clamps
      max_group_cardinality to the authorized row count before execution, because the engine
      ignores limit on the grouped path and would otherwise return up to the full server budget
      in group rows of raw key-column values to a caller that declared one row. Ungrouped
      aggregates return a fixed cardinality - one value per requested descriptor - independent of
      how many rows were folded. Budgets stay server-side with no wire vocabulary, so a caller
      cannot raise a bound, and an exceeded budget is a typed rejection, never a partial fold.
      Accepted current semantics - a pure COUNT with primary-key-only field visibility discloses
      row cardinality without naming a field; this matches the disclosure a caller already has by
      listing rows under the same grant, and is not a new capability.
    scale: Aggregation folds over the same published-snapshot org partition scan a row read
      already performs, adding no co-location assumption, no cross-partition fan-out, and no new
      storage access. Group cardinality is bounded before results are materialized.
    reversibility: The arm is additive at tag 8 and the request field change is wire-compatible;
      clients that never send aggregates are byte-for-byte unaffected, and row plan hashes are
      pinned unchanged.
  deferred:
  - Wire budget vocabulary (ADR-0087 per-query scan/grouping/memory/wall-time budgets remain
    server-side defaults; callers cannot yet declare or observe them)
  - Explain output for projected queries (ADR-0087 requires reporting access shape and budget
    consumption without executing; no ExplainProjected surface exists)
  - Decimal and money column sums (engine limitation - sum accepts i64/u64 only; rejected typed
    with a distinct type_mismatch code and an actionable fix, not silently coerced)
  - Two or more whole-set aggregates in one ungrouped request (the engine computes a single
    whole-set function and is the only path that answers an empty matching set with identity
    values rather than zero groups; rejected typed, and accepted today with group keys)
  exit_gate: A bounded aggregate or grouped projected query is expressible from the proto, the
    Rust SDK, and the CLI, and every value it returns equals the same value recomputed
    client-side from the rows it summarized over a real service, real storage, and real columnar
    apply; row-path bytes, packed goldens, preflight pins, and row plan hashes are unchanged.
  human_review_triggers: *id001
