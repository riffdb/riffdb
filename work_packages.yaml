  required_adrs: [ADR-0056, ADR-0059, ADR-0060, ADR-0061]
  allowed_paths: [work_packages.yaml, examples/app-baseline/**, benchmarks/run-app-baseline,
    crates/riffdb-commit/**, crates/riffdb-observability/**, crates/riffdb-server/**,
