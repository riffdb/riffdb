    deterministically, and the sole coordinator is still the only authoritative mutation owner.
  human_review_triggers: *id001
- id: WP-451
  name: Compiler-proved commutative child-append grouping
  depends_on: [WP-450]
  objective: Increase safe durable group fill for exact-key-disjoint child appends sharing one hot
    aggregate without delaying lone commands, bypassing barriers, weakening invariants, or changing
    FIFO order.
  requirements: [PERF-004, PERF-005, PERF-006, PERF-008]
  required_adrs: [ADR-0058, ADR-0059, ADR-0060, ADR-0061, ADR-0094]
  allowed_paths: [SPEC.md, work_packages.yaml, adr/**, crates/riffdb-conflict/**,
    crates/riffdb-contract-ir/**, crates/riffdb-commit/**, crates/riffdb-observability/**,
    crates/riffdb-server/**, tests/command_semantics/**, tests/observability/**,
    examples/app-baseline/**, benchmarks/run-app-baseline, docs/performance/**]
  deliverables:
  - Bounded scheduler evidence distinguishing intake group size, compatible completion groups,
    strict conflict cuts, proved shared-key groups, hard barriers, byte/count limits, and oldest-item
    age
  - An ephemeral compiler proof limited to input-keyed child creates with no root/existing-row
    mutation, uniqueness, requirement, root/range validation, commit invariant, or unclassified
    dependency
