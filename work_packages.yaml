  - cargo +1.97.0 test -p riffdb-contract-ir --all-features
  - cargo +1.97.0 test -p riffdb-conflict --all-features
  - cargo +1.97.0 test -p riffdb-commit --all-features
  - cargo +1.97.0 test -p riffdb-server --all-features
  - ./benchmarks/run-app-baseline --self-test
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: Proved disjoint child appends sharing one hot aggregate co-commit and remain equivalent
    to FIFO serial execution; every unproved or overlapping command remains strictly serialized,
    barriers never move, and unary latency does not regain a timer park.
  human_review_triggers: *id001
