- id: WP-489
  name: Ordered asynchronous checkpoint, recovery, and maintenance barriers
  depends_on: [WP-488]
  objective: Make acknowledged overlay state operationally complete through bounded asynchronous
    redb checkpoints, deterministic restart rebuild, crash-safe reclamation, backup/restore, and
    exact redb-writing barriers.
  requirements: [STO-001, STO-002, REC-001, REC-002, TXN-043, TXN-044,
    PERF-007, PERF-009, PERF-015, PERF-017]
  required_adrs: [ADR-0006, ADR-0050, ADR-0061, ADR-0070, ADR-0082, ADR-0085,
    ADR-0098, ADR-0101, ADR-0102, ADR-0103, ADR-0104]
  allowed_paths: [work_packages.yaml, crates/riffdb-storage-api/**,
    crates/riffdb-storage-redb/**, crates/riffdb-server/**,
    tests/storage_recovery/**, tests/backup_restore/**,
    tests/server_composition/**, examples/app-baseline/**,
    benchmarks/run-app-baseline, docs/SUMMARY.md, docs/architecture/**,
    docs/operations/**, docs/performance/**]
  deliverables:
  - One bounded checkpointer applies a captured published suffix in exact writer order, validates
    every expected prior and frontier, commits one Immediate redb checkpoint, and compacts only the
    proven covered overlay prefix while retaining concurrent newer entries
  - Checkpoint admission starts at 4,096 transitions or 16 MiB and before the physical extent reserve;
    the complete published-plus-checkpoint-in-flight suffix remains below 8,192 transitions and
    32 MiB, the overlay remains below 128 MiB, and insufficient headroom backpressures writes while
    reads remain live
  - Standard restart deterministically validates checkpoint plus suffix, rebuilds the exact overlay,
    reaches readiness without a mandatory redb rewrite, and starts the ordinary checkpointer
  - Redb-writing barriers drain unpublished fences and checkpoint the complete published suffix
    before their own transaction; checkpoint failure or uncertainty prevents barrier execution
  - Backup/restore preserve the checkpoint-plus-extent unit, and reclamation/recycle occurs only
    after a successor checkpoint and compacted view independently prove recovery sufficiency
  - Process crash arms cover every ADR-0104 boundary, including checkpoint apply/commit,
    compacted-view publication, concurrent suffix growth, barrier drain, backup, reclamation, and
    repeated restart
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test -p riffdb-server --all-features
  - cargo +1.97.0 test --test storage_recovery_matrix
