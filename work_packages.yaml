  - Staged startup gate that performs identity initialization first, drives redb structural evidence to exact end,
    obtains catalog-owned opaque same-session ValidatedCatalogHistory, and only then activates the matching
    StructurallyOpened dormant ports; no proof crosses the storage trait and any mismatch leaves the process unready
  - P1 lifecycle exposing only health and one-time loopback bootstrap before the marker, authenticated deployment after
    bootstrap, and general command/read readiness only after a valid active catalog; exact bootstrap replay uses the
    caller-retained credential, returns the existing capability result without echoing or reissuing the token, and
    appends only the required linked audit records
  - Real child-process temporary-redb restart test over public gRPC covering bootstrap, budget deployment,
    CreateBudget, entity read, AllocateBudget, outcome resolution, clean stop, reopen, repeated entity/outcome reads,
    and retained bootstrap replay without an in-process storage or service shortcut
