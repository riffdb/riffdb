spec_version: '1.01'
product: RiffDB
repository: riffdb
status: deployable-application-alpha-architecture-accepted
source_spec: SPEC.md
normative_terms:
- MUST
- MUST NOT
- SHOULD
- SHOULD NOT
- MAY
global_rules:
- Database semantics, protocols, transport trust decisions, and authoritative runtime code are first-party Rust;
  target-language generated application bindings require an accepted interface ADR and equivalent semantic tests.
- All application mutation passes through the shared application service and commit coordinator.
- No work package may weaken a normative guarantee without an accepted ADR.
- Every work package must map requirements to automated tests or an explicitly approved manual artifact.
- Generated sources and fixtures must be reproducible and checked for a clean worktree.
- Every root-level integration test is an explicit [[test]] target in exactly one owning crate manifest, and its
  acceptance command is package-qualified.
requirement_coverage:
  source: SPEC.md
  excluded_ids:
  - id: TXN-004
    reason: Illustrative identifier in the normative-language explanation, not a defined requirement.
