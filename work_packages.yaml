- id: WP-609
  name: Rebase the durability journal before offline history retention
  depends_on: [WP-423]
  objective: Close the ADR-0085/ADR-0103 boundary exposed by the installed WP-578 endurance
    rehearsal. Offline retention currently commits tombstones and deletes retained command/event
    rows directly in redb while a clean-shutdown durability journal still names the pre-prune
    suffix; the next RedbStore open therefore fails CorruptData. Define and implement one
    fail-closed pre-prune recovery/rebase ceremony so no retention mutation can begin until the
    redb checkpoint is reconciled and an empty strictly newer journal generation is durable.
  requirements: [PERF-013, PERF-014, REC-001, REC-002, STO-001, STO-002]
