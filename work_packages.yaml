  name: DST storage seams — journal media port, backend-parameterized open, first simulated store open
  depends_on: [WP-580]
  objective: Continue ADR-0113 Phase 1 by cutting the two production seams the simulator needs —
    an object-safe journal media port over the journal/checkpoint/spare/marker side-file family
    with a byte-identical real-filesystem default, and a hidden backend-parameterized RedbStore
    open that routes the format preflight, marker publication, and every journal side-file
    operation through one simulated media instance — then prove the seams with a shared media
    conformance suite and the first fully simulated store open.
