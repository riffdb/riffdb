  - Delete-aware validated-prefix proof replaces every `len() == count-at-bound` assumption that
    command-time deletion invalidates and keeps retention-below-bound semantics separately typed
  - Entity-chain fingerprints incorporate tombstone transitions and distinguish live cardinality
