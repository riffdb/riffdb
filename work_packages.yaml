  - Golden workload and observation fixtures
  - >-
    Exact isolated dependencies: postgres 0.19.14 with default features disabled and synchronous NoTls only, plus
    serde_json 1.0.150 with default features disabled and only std; no ORM, pool, TLS integration, native dependency,
    or root-workspace production dependency
  - CI live-adapter evidence against exactly
    postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818,
    running the declared acceptance command with PostgreSQL required rather than treating a local skipped-live test
