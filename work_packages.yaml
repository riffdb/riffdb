  - proto/**
  - crates/riffdb-proto/**
  - fixtures/proto/**
  - scripts/generate-proto*
  deliverables:
  - Versioned service and record messages
  - Protox/Prost generation and Tonic-compatible service descriptors; Tonic Rust stubs are deferred to WP-130
  - Size limits and decode validation
  - Golden compatibility fixtures
  - Reserved-field policy
  acceptance_commands:
  - cargo test -p riffdb-proto
  - ./scripts/generate-proto --check
  exit_gate: Golden fixtures decode and generated sources reproduce with a clean worktree.
  human_review_triggers: *id001
- id: WP-030
