  - P1 component graph explicitly constructs the production coordinator with the code-level Sync value and no
    constructor/backend default; it exposes no operator durability selector, admits no production Memory path, and
    keeps Group server-disabled until its existing scheduling, fairness, latency, crash-evidence, and human-review gate
  - Initialization composition only through the commit-owned DatabaseInitializationExecutor; the server invokes no
    storage mutation transition directly, does not request a DatabaseId candidate on reopen, and preserves the
    durable winner across restart
  - Four disjoint concrete wall-clock providers for auth-owned authentication time, policy-owned AuthorizationClock,
    and commit-owned AdmissionClock and AdministrationClock; one implementation may be shared, but consumer ports and
    call sites remain distinct and bootstrap shares exactly one AdministrationClock sample
  - Production CursorTokenGenerator and CursorMonotonicClock providers, including reviewed cursor entropy and one
    private std::time::Instant origin, with restart invalidation, checked regression/overflow, and no test sleeps
  - Production capability-token and idempotency digest-key providers, cross-namespace key-material reuse rejection,
    and nonsecret readable scheme/key inventories supplied to fail-closed startup validation
  - Staged startup gate that performs identity initialization first, drives redb structural evidence to exact end,
    obtains catalog-owned opaque same-session ValidatedCatalogHistory, and only then activates the matching
    StructurallyOpened dormant ports; the catalog history includes ADR-0030 validation of every qualifying explicit
    capability partition, while StructurallyOpened carries the exact same-snapshot RetainedMetadataV1 used to check
    database identity, active-pointer agreement, bootstrap lifecycle, and allocator capacity; no catalog proof crosses
    the storage trait, and any mismatch leaves the process unready
  - Migration startup composition that only joins matching CatalogIndexMigrationContext and the privately constructed
    RedbStartupIndexMigrationPort, invokes the catalog-owned consuming driver, and receives dormant unopened state;
    server source cannot import or receive catalog-branded requests/responses, instructions, batches, completions, or
    concrete backend page/read/apply/end helpers
  - Exact 256-item lower commit-subscription buffers and retained supervision handles for every accepted service task;
    buffer overflow remains resumable and any accepted task panic or disappearance stops routing rather than silently
    dropping work
  - P1 lifecycle exposing only the unchanged Health RPC's restricted principal-less lifecycle/liveness/readiness view
    during initializing validation/bootstrap and one-time loopback bootstrap after validation while the marker is
    absent; the server constructs no pre-bootstrap health context after the marker and requires normal credential
    handoff, RequestContext, current policy, and obligations for Health in deployment-required, ready, and later states
  - Bootstrap remains the sole principal-less mutation and sole operation allowed to create durable service-audit
    records without a principal; pre-bootstrap Health has no policy or storage access and emits no durable audit
  - Authenticated deployment after bootstrap and general command/read readiness only after a valid active catalog;
    exact bootstrap replay uses the caller-retained credential, returns the existing capability result without echoing
    or reissuing the token, and appends only the required linked audit records
  - Real child-process temporary-redb restart test over public gRPC covering bootstrap, budget deployment,
    CreateBudget, entity read, AllocateBudget, outcome resolution, clean stop, reopen, repeated entity/outcome reads,
    and retained bootstrap replay without an in-process storage or service shortcut
  - Restart-from-V1 integration proving the exclusive migration completes before readiness, a fresh V2-only startup
    pass joins Ready with Clean, migrated rows participate in partition-filtered reads and return-time authorization,
    and no transport or server path becomes a migration constructor or backend transition consumer
  acceptance_commands:
  - cargo test -p riffdb-api-grpc -p riffdb-client-rust -p riffdb-server
  - cargo test -p riffdb-api-grpc --features server,client --test grpc_end_to_end
  - cargo test -p riffdb-server --test p1_riffdbd_restart
