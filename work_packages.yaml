- id: WP-446
  name: Reactive-module storage hygiene — republish off the write lock, memory structural
    inspection, and the read-path cost ruling (FZ)
  depends_on: [WP-436]
  objective: Close the three storage-hygiene items the WP-436 review confirmed — the redb
    republish path walked the unbounded, never-pruned AUDIT table while holding the redb
    write lock, stalling every other writer including commands; the memory structural pass
    never inspected state.reactive_modules at all, so a retained reactive-module row that no
    publication record names, or whose identity disagreed with its own artifact bytes,
    produced no finding while redb reported both; and redb read_reactive_module did not fail
    closed on a module with no publication record, where the cost of the only correct check
    had to be established before shipping it rather than after.
  requirements: []
  required_adrs: [ADR-0021]
  allowed_paths: [work_packages.yaml, crates/riffdb-storage-api/src/audit.rs, crates/riffdb-storage-redb/src/administration.rs,
    crates/riffdb-storage-redb/src/gate.rs, crates/riffdb-storage-redb/src/store.rs, crates/riffdb-storage-memory/src/administration.rs,
    crates/riffdb-storage-memory/src/integrity_administration.rs, crates/riffdb-storage-memory/src/startup.rs]
  deliverables:
  - The redb idempotent-republish answer — allocator/tail proof, contract and query-module
    preconditions, presence probe, and the original publication's sequence — computed in a
    read transaction, so the unbounded AUDIT walk no longer runs under the exclusive
    mutation gate; a restructure only, with no durable encoding, schema hash, registry pin,
    or reverse index touched
  - The write path retained unchanged behind that probe and re-probing presence under its own
    write transaction, so a publish that lands between the read answer and begin_write is
    served the same republish outcome instead of writing a duplicate, with the rare
    under-lock scan documented as the bounded-probability exception
  - Shared table-generic tail validation and precondition predicates so the read probe and
    the write path cannot drift about which streams and dependencies are admissible
  - Memory structural inspection of every retained reactive-module row, mirroring redb's
    inspect_reactive_module_row arm for arm and code for code — artifact and source hash
    agreement plus ordering (CrossLinkMismatch), the exact contract artifact, every exact
    query-module dependency, and the row's own publication record (MissingCrossLink)
  - A recorded cost ruling for redb read_reactive_module's fail-closed check rather than the
    check itself — its callers are every consumer consume, acknowledge, negative-acknowledge,
    seek, retire, and status RPC plus WatchNamedQuery setup with no cache, and the frozen
    durable layout offers no bounded witness for "a publication record exists for this
    module_hash", so the check would turn an O(1) read into an O(|AUDIT|) decode scan over a
    stream that those same RPCs grow — deliberately not shipped, and reported for a
    maintainer decision
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --lib --all-features -- administration::tests
  - cargo +1.97.0 test -p riffdb-storage-memory --lib --all-features -- administration::tests
  - cargo +1.97.0 test -p riffdb-storage-api --lib --all-features -- audit::tests
  - cargo +1.97.0 test -p riffdb-server --test p1_riffdbd_restart --all-features
  - cargo +1.97.0 test --workspace --all-features
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  exit_gate: An idempotent redb republish returns the original publication's sequence while
    the exclusive mutation gate issues zero new tickets, and routing that answer through the
    write transaction unconditionally turns that pin red; driving the locked path directly
    still serves the same republish answer and writes nothing; a retained redb module with no
    publication record is still refused with CorruptData; a retained memory reactive-module
    row that no publication record names, and one whose identity disagrees with its artifact,
    each yield exactly one typed authoritative finding, while a published module validates
    clean, and removing the new inspection arm returns all of them to zero findings; the full
    workspace battery reports zero failures.
  human_review_triggers: *id001
- id: WP-447
  name: Storage-scan hygiene — single-pass startup verification of reactive publications,
    memory's redundant per-read scan removed, and memory consumer/delivery structural
    inspection (GA)
  depends_on: [WP-446]
  objective: Close the three storage-hygiene items the WP-437 review ledgered — redb's
    startup proof that every retained reactive-module row still has its publication record
    scanned the entire unbounded, never-pruned AUDIT table once PER ROW, so a long-lived
    database paid up to MAX_RETAINED_REACTIVE_MODULES full protobuf decode passes at every
    open; memory still walked its whole administration audit vector on every consumer RPC to
    re-prove the same property its own structural pass now proves at open, the redundant scan
    the WP-437 ruling identified; and memory's structural pass never inspected
    state.event_consumers or state.event_consumer_deliveries at all, so a consumer row naming
    an unretained reactive module, or a delivery row whose consumer is gone, produced no
    finding while redb reported both.
  requirements: []
  required_adrs: [ADR-0021, ADR-0085]
  allowed_paths: [work_packages.yaml, crates/riffdb-storage-redb/src/startup.rs, crates/riffdb-storage-memory/src/administration.rs,
    crates/riffdb-storage-memory/src/consumer.rs, crates/riffdb-storage-memory/src/integrity_administration.rs,
    crates/riffdb-storage-memory/src/startup.rs]
  deliverables:
  - The redb reactive-publication proof served from one transient witness set built in a
    single forward AUDIT pass and answered per row by set lookup, replacing the per-row full
    table scan; identical findings — same codes, scopes, and counts — on every fixture, a
    pure cost change with no durable encoding, schema hash, registry pin, or index touched
  - That witness pass kept UNCONDITIONAL and untruncated under the ADR-0085 validated-prefix
    checkpoint fast path — it is driven by the REACTIVE_MODULES phase, whose rows are an
    additive structural count the checkpoint guard never exempts, and it reads the whole AUDIT
    table itself rather than the checkpoint-truncated suffix the AUDIT phase walks, because
    the unconditional open-time proof is what licenses both backends' read paths to skip it
  - The witness set bounded by the table under inspection through a REACTIVE_MODULES
    membership filter, and released with its phase, plus a decode counter that pins the cost
    (one pass, not one per row) rather than asserting it in prose
  - Memory's per-read publication scan in read_reactive_module removed, converging its read
    with redb's O(1) read, with the ruling recorded at the code site in the style of redb's own
    note — the structural pass proves row-presence implies publication-record for every row,
    the sole writer commits row and record in one gated mutation, nothing removes either — and
    with the two honest caveats that memory's base case is weaker (crate tests reach
    operational ports without a pass) and is acceptable only because the backend has no
    production consumer, plus the recorded decision not to keep the check behind a
    debug_assert
  - Memory structural inspection of every retained event-consumer and delivery row, mirroring
    redb's inspect_event_consumer_row and inspect_event_consumer_delivery_row check for check
    — identity-hash derivation, retained database binding, and ordering standing in for redb's
    key agreement plus snapshot round trip (CrossLinkMismatch), and the reactive module a
    consumer names and the consumer a delivery names (MissingCrossLink)
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --lib --all-features -- startup::tests
  - cargo +1.97.0 test -p riffdb-storage-memory --lib --all-features -- administration::tests
  - cargo +1.97.0 test -p riffdb-storage-redb --lib --all-features
  - cargo +1.97.0 test -p riffdb-storage-memory --lib --all-features
  - cargo +1.97.0 test --workspace --all-features
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  exit_gate: A cleanly published redb database with three retained reactive modules validates
    with zero findings while decoding the audit stream exactly once for the whole
    REACTIVE_MODULES phase, and rebuilding the witness per row turns that count red at three
    times the stream length; a retained row that no publication record names still yields
    exactly one authoritative MissingCrossLink, and leaving the witness set unpopulated
    instead reds every retained module; the same orphan is still reported, and the same full
    audit stream still read, on an open driven by a verified validated-prefix checkpoint; a
    memory reactive-module row with no publication record is returned by read_reactive_module
    and reported by the structural pass, so the detection moved rather than vanished; a
    written memory consumer and its leased delivery validate clean while a consumer naming an
    unretained reactive module and a delivery whose consumer is absent each yield exactly one
    authoritative MissingCrossLink, and removing either new inspection arm returns its case to
    zero findings; the full workspace battery reports zero failures.
  human_review_triggers: *id001
- id: WP-448
  name: Graceful-shutdown checkpoint in O(1) — validated-prefix row counts read from table
    metadata instead of walking all history (GB)
  depends_on: [WP-447]
  objective: Close the measured graceful-shutdown defect the app-baseline sweep exposed —
    write_validated_prefix_checkpoint rebuilt every checkpoint field by WALKING, so a ~550k-op
    database spent 20,705ms in shutdown against 143ms with the write disabled (99.3% of
    shutdown), overrunning the harness PROCESS_STOP_TIMEOUT of 15s into SIGKILL, and the
    production mirror spends minutes at 10M commits. The eight recorded below-S row counts are
    the whole cost, and they are recoverable without touching a row — S and the audit bound are
    the LAST keys of COMMITS and AUDIT in the same snapshot, so "rows with sequence <= S" is
    "every row in the table" for every count class, and redb already maintains each table's row
    count in its table header. The single exception is idempotency_count, which admits only
    StoredOutcome rows, so the terminal ExecutionFailed census — the one quantity a row count
    cannot express — is maintained in process memory, seeded exactly by the startup walk that
    opens the checkpoint write gate and advanced by the single lane that writes such a row.
  requirements: []
  required_adrs: [ADR-0019, ADR-0085]
  allowed_paths: [work_packages.yaml, crates/riffdb-storage-redb/src/validated_prefix.rs,
    crates/riffdb-storage-redb/src/store.rs, crates/riffdb-storage-redb/src/startup.rs,
    crates/riffdb-storage-redb/src/application.rs, crates/riffdb-storage-redb/tests/architecture.rs]
  deliverables:
  - The checkpoint build given a closed CheckpointCountSource — Walked (the unchanged reference
    walk, retained as the definition of each count) and DurableLengths (eight redb table row
    counts plus the terminal census) — with the production write selecting DurableLengths and
    the record's format, semantics, hashing, and bindings untouched — this changes how the eight
    numbers are obtained, never what is written
  - The derivation's preconditions stated where it lives and CHECKED where checking is cheap —
    the three event-keyed tables have "no row above S" verified from their last key by one
    B-tree descent, an impossible census or a checked table that fails the probe falls back to
    the reference walk rather than writing counts the next open would refuse, and the S == 0 /
    audit-bound == 0 cases return the same zeros the walks return without classifying a row
  - The terminal ExecutionFailed census seeded in the same statement pair that opens the
    checkpoint write gate — so no checkpoint can ever be built from an unseeded census — from a
    single terminal-class decode the IDEMPOTENCY phase already performs on the full walk and on
    the checkpoint fast path alike, with the phase-8 prefix skip answered from that same decode
    rather than a second protobuf pass
  - That census advanced inside the mutation lease that made the row durable, through one
    commit path used by the one lane that writes a terminal ExecutionFailed row, so a checkpoint
    write acquiring the lease afterwards can never see the row without its census entry, plus a
    source guard that a second uncounted writer cannot be added silently
  - The byte-identity property test as the acceptance centrepiece — on randomized history shapes
    covering execution failures, empty history, a retention-pruned prefix, and a fully populated
    database, the two count sources encode the SAME checkpoint bytes and the O(1) source
    iterates zero rows; plus a zero-walk pin on the real graceful-shutdown write, a
    fail-closed test proving a drifted census is refused at the next open rather than trusted,
    and an ignored scale demonstration timing walked against derived
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --lib --all-features -- startup::tests
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test --workspace --all-features
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  - ./scripts/check-workspace-policy
  - ./scripts/check-requirement-coverage
  exit_gate: On randomized history shapes the metadata-derived counts encode byte-identical
    checkpoints to the reference walk while iterating zero rows, and dropping the ExecutionFailed
    subtraction turns those bytes unequal; the graceful-shutdown write on a real clean open
    iterates zero history rows and the checkpoint it writes is accepted by a reopen that
    verifies every recorded count against redb's own row counts, while re-pointing that write at
    CheckpointCountSource::Walked turns the row tally nonzero; one committed terminal execution
    failure advances the census and keeps the derived bytes equal to the walk's, while neutering
    that lane's counting turns them unequal; a census drifted by one is refused at the next open
    rather than silently trusted, and an impossible census falls back to the reference walk
    before the write; at 550k rows per counted table the build drops from 3,060ms over 4,400,000
    iterated rows to 432ms over zero, and to 63us with no live entities, leaving the
    entity-chain fingerprint's current-state ENTITIES pass as the sole remaining
    history-independent residual; the full workspace battery reports zero failures.
  human_review_triggers: *id001
- id: WP-449
  name: Mixed-load writer evidence and fresh-history diagnosis
  depends_on: [WP-445, WP-448]
  objective: Turn the failed PERF-008 mixed-load curve into per-point causal evidence before changing
    scheduling or durable semantics, and prevent accumulated history from being presented as a pure
    concurrency curve.
