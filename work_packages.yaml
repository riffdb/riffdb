- id: WP-493
  name: Contract-migration preflight reads the published overlay
  depends_on: [WP-487, WP-488, WP-490]
  objective: Restore fail-closed contract-migration preflight after ADR-0104 routed every
    standard-profile command, including the idle singleton, through the journal suffix, by reading
    predecessor rows from the published checkpoint-plus-overlay view instead of the redb checkpoint
    alone, without reintroducing the retired direct singleton path.
  requirements: [STO-001, STO-002, REC-001, TXN-041, VAL-003]
