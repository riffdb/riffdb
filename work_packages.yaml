  - Deterministic adversarial schedules for same/different child keys, root mutation, uniqueness,
    invariants, cancellation, retry, fencing, barriers, crash recovery, and shutdown
  - Measured group-fill and mutation-throughput improvement under isolated, uniform, and Zipfian
