  depends_on: [WP-590]
  objective: A contract declares a vector field on an entity (dimension, distance metric,
    source-field list, staleness SLO), and the compiler enforces that source fields exist on
    the entity and that dimension/metric/SLO are valid, with span-carrying diagnostics.
    Bindings and fixtures regenerate; no runtime behavior yet.
  requirements: [VEC-001]
  required_adrs: [ADR-0002, ADR-0086, ADR-0091]
  allowed_paths: [work_packages.yaml, crates/riffdb-contract-syntax/**,
    crates/riffdb-contract-ir/**, crates/riffdb-contract-compiler/**, crates/riffdb-types/**,
    docs/contracts/**, fixtures/**]
  deliverables:
  - Grammar and AST for vector-field declaration with the ADR's exact vocabulary; language
    reference regenerated
  - Typed IR carrying dimension, metric, source fields, and staleness SLO, with versioned
    encoding and compatibility fixtures
  - Compiler rejection of invalid dimension, unknown metric, empty/nonexistent source fields,
    and non-positive staleness SLO with source-span snapshot plus semantic assertion per
    compiler-diagnostic house rule; negative examples added
  acceptance_commands:
  - cargo test -p riffdb-contract-syntax -p riffdb-contract-ir -p riffdb-contract-compiler
  - ./scripts/handbook check
  exit_gate: A contract declaring a vector_field compiles through the public
    compile_contract_source into a bundle that encodes, decodes, and content-addresses the
    dimension, metric, source fields, and staleness SLO (vector_contract.rs end-to-end tests);
    canonical tag 0x0e is pinned by golden fixtures with an exhaustiveness guard; every
    declared rejection carries a source-span snapshot; metric and staleness_slo names remain
    valid ordinary identifiers.
  standing_design_tests:
    interface_safety: Vector components are enforced into one canonical form (finite, -0.0
