- id: WP-594
  name: Vectors approximate tier — first-party ANN structure under the declared-recall contract
  depends_on: [WP-593, WP-596]
  objective: A first-party approximate structure engages above a declared row threshold, per
    organization, meeting each projection's declared recall target measured against exact scan
    at the same frontier; maintenance and compaction are bounded by recall regression at a
    frozen frontier, not byte equality; all result-shaping statistics (entry points,
    centroids, codebooks) are computed per organization so no tenant's data influences
    another's rankings or timings.
