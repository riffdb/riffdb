- id: WP-045
  name: Budget comparison baseline
  depends_on:
  - WP-040
  objective: Establish the long-lived budget workload, normalized observation oracle, and isolated PostgreSQL
    implementation used for implementation comparison and later benchmarks.
  requirements:
  - POC-001
  required_adrs:
