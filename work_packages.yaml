    verification, and staging, proving a failed reservation or envelope excess consumes no sequence and exposes no
    partial graph
  - Crash/reopen evidence that every durable event hash recomputes from its exact EventId/type/length-framed canonical
    record payload and that any commit/event/outbox hash mismatch fails authoritative readiness without repair
  - Separate WP-070 structural evidence, WP-050 ValidatedCatalogHistory, WP-130 authoritative readiness, WP-160
    Delivering normalization, WP-170 degradation/new-generation rebuild, and WP-185 aggregate-health evidence with
    no online repair of authoritative state
  - Graceful-close and crash/reopen evidence that complete authoritative integrity validation runs every time,
    repeated recovery creates no deferred ADR-0019 metadata, and canonical absence remains valid and idempotent
  - Named process failpoints throughout V1/V2 startup migration, including before and after each bounded compare-and-
    rewrite commit, proving restart from a complete fresh scan, no partial batch, catalog-owned branded completion,
    dormant-only backend finish, V2-only completion, and full fresh structural/catalog exact-end validation before
    readiness without exposing driver states to the process harness
  - Maintainer-approved narrow owner-package fixture hooks in riffdb-cli and riffdb-server expose only synchronized
    child-process crash boundaries to riffdb-testkit; they add no public API, durable record, or production bypass
  - Two explicitly synchronized post-commit/pre-response public Execute cases, one losing TCP response bytes before a
    complete frame and one kills then restarts riffdbd; each retries through WP-137 with the same command, raw key,
    canonical input, and capability but a fresh RequestId, returning the original replayed outcome, sequence, and
    provenance with no second mutation, event, outbox intent, provenance, commit record, or sequence
  - Process failpoints before and after maintenance receipt sync, drain, database close, immutable backup publication,
    staged restore, staged validation/authorization, destructive target publication, fresh post-publication
    validation, and terminal receipt persistence, including kill/restart reconciliation by exact checksum evidence
  - Healthy current-plus-staged and empty/corrupt staged-only authorization recovery, credential-loss retry, protected
    polling unavailability while offline, DatabaseId preservation, process-state invalidation, destroyed-suffix
    idempotency and sequence reuse, and no invented service-audit terminal
  acceptance_commands:
  - cargo test -p riffdb-testkit
  - cargo test -p riffdb-testkit --test full_recovery_matrix -- --ignored
  - cargo test -p riffdb-testkit --test offline_maintenance_matrix -- --ignored
  external_test_targets:
  - name: full_recovery_matrix
    owner_crate: riffdb-testkit
    manifest: crates/riffdb-testkit/Cargo.toml
