- id: WP-592
  name: Vectors embedding write — typed command, staleness tracking, model-version observability
  depends_on: [WP-591]
  objective: An application writes a pre-computed embedding to a declared vector field through
    a typed command carrying the vector value, model identity, and model version. The command
    validates dimension against the contract, stores the vector as authoritative state with
    full provenance and idempotency, and the staleness surface tracks entities whose source
    fields outrun their embedding write. Model-version observability surfaces entities whose
    stored model version differs from the declared current. Health degrades when the staleness
    SLO is breached.
  requirements: [VEC-002, VEC-003, VEC-004, VEC-012]
  required_adrs: [ADR-0086, ADR-0091]
  allowed_paths: [work_packages.yaml, crates/riffdb-service/**, crates/riffdb-commit/**,
    crates/riffdb-runtime/**, crates/riffdb-contract-ir/**, crates/riffdb-types/**,
    crates/riffdb-storage-api/**, crates/riffdb-storage-redb/**,
    crates/riffdb-storage-memory/**, docs/**, fixtures/**]
  deliverables:
  - Typed embedding-write command that carries vector value (f32 array matching declared
    dimension), model identity string, and model version string; dimension mismatch rejected
    with a typed diagnostic
  - Authoritative storage of the vector, model identity, model version, and the embedding
    write's commit sequence on the entity; provenance, idempotency, and commit atomicity
    identical to any other mutation
  - Typed staleness surface that counts and enumerates stale entities per vector field
    (source-field commit sequence newer than embedding-write commit sequence), queryable
    from the service layer
  - Model-version observability that counts and enumerates entities whose stored embedding
    model version differs from the contract's declared current version
  - SLO-breach health signal when stale count exceeds threshold
  - Provenance and idempotency assertions on embedding writes, dimension rejection evidence,
    and staleness correctness after interleaved source-field and embedding writes
  acceptance_commands:
  - cargo test -p riffdb-service -p riffdb-commit -p riffdb-runtime --all-features
  - cargo test -p riffdb-storage-redb --all-targets
  exit_gate: An embedding write lands through a typed command with provenance, idempotency,
    and dimension validation proven; staleness and model-version surfaces count and enumerate
    from authoritative state; the SLO-breach health signal is emitted and observed on both
    gRPC and MCP with ADR-0040 parity.
  standing_design_tests:
    interface_safety: No public surface may accept an embedding without model identity and
      version, and no wire path may pun a vector into another value kind.
    scale: Embedding writes are bounded by the declared dimension and the canonical document
      limits; staleness enumeration must be paginated under the standard query bounds.
  deferred:
  - Completion of the typed vector wire path, authoritative embedding consumer, count-based
    staleness surface, model-version enumeration, and VectorStaleness health parity is assigned
    to WP-596 under the maintainer rulings recorded 2026-08-11; no ruling remains open here.
  - Duration-based staleness (an entity stale longer than a declared duration) is a named future
    amendment; v1 enforces the declared stale-entity count threshold without clock machinery.
  human_review_triggers: *id001
