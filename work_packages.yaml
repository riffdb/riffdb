    dependency (forbid(unsafe_code) preserved)
  - Contract declarations for the per-organization ANN row threshold and recall target, with
    bounded values, versioned encoding, span-carrying diagnostics, and compatibility fixtures
  - Declared recall target enforcement in the acceptance harness (recall@K against exact scan
    at matched frontiers across randomized histories)
  - Maintenance bounded by recall regression at a frozen frontier, harness-proven
  - Per-organization statistics isolation evidence
  - Small-partition default routing (exact below the declared threshold) with the threshold a
    declared, observable property
  acceptance_commands:
  - cargo test -p riffdb-contract-syntax -p riffdb-contract-ir -p riffdb-contract-compiler
  - cargo test -p riffdb-catalog -p riffdb-commit --all-features
  - cargo test -p riffdb-columnar -p riffdb-projection --all-features
  - cargo deny check
  exit_gate: The approximate tier meets each projection's declared recall target against
