  standing_design_tests:
    interface_safety: The public retention verbs and typed outcomes do not change. The preparation
      witness is storage-internal and cannot be fabricated by CLI, service, or application code.
    scale: Journal recovery is bounded by the existing extent limits and happens once per offline
