    published composite read view and resolve every ADR-0104 overlay table through the explicit
    point and range accessors rather than the checkpoint-only deref
  - The open-ended overlay range accessor merges the published overlay when the upper bound is
    absent, so an unbounded preflight page cannot silently fall back to the checkpoint
  - A predecessor row that is durable in the journal suffix but not yet checkpointed is inspected
