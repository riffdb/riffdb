    acknowledgement while preserving sole-writer FIFO evaluation, transaction-current validation,
    atomic command graphs, independent outcomes, and journal-fence publication.
  requirements: [REC-001, REC-002, TXN-040, TXN-041, TXN-042, TXN-043,
    TXN-044, PERF-004, PERF-005, PERF-008, PERF-009, PERF-010, PERF-015,
    PERF-017]
  required_adrs: [ADR-0003, ADR-0005, ADR-0058, ADR-0059, ADR-0060, ADR-0061,
    ADR-0094, ADR-0095, ADR-0096, ADR-0098, ADR-0101, ADR-0102, ADR-0103,
    ADR-0104]
