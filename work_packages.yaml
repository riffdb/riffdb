  - crates/riffdb-catalog/**
  - crates/riffdb-contract-ir/src/key_schema.rs
  - crates/riffdb-storage-api/src/catalog*
  - tests/contract_deploy*
  deliverables:
  - Bundle persistence interface
  - Active-version pointer
  - Typed expected-version activation intent for the commit coordinator
  - Compatibility checks
  - Catalog notifications
  - Deployment failpoint and redaction-safe telemetry hooks
  - Activation-time revalidation of compiled command tool-name registry completeness, deterministic v1 derivation,
    canonical ordering, CommandId and lineage binding, and uniqueness, with rejection rather than repair or
    regeneration of invalid metadata
  - IR-aware, bounded historical bundle and executable-plan resolver that consumes every same-session
    HistoricalSemanticEvidence page through exact end and returns an opaque catalog-owned ValidatedCatalogHistory
    bound to that startup session; truncated, skipped, repeated, reordered, mismatched, or unknown evidence fails closed
  - Catalog-owned MAX_ACTIVE_LINEAGE_BUNDLES_V1=4,096, MAX_ACTIVE_LINEAGE_CANONICAL_BYTES_V1=67,108,864,
    and MAX_LINEAGE_MATERIALIZATION_PROOF_BYTES_V1=2,097,152, with checked exact canonical-byte sums and compile-time
    arithmetic assertions for the 1,810,703-byte maximum proof framing and independent 2 MiB structural mask bound;
    normalized snapshot bytes plus retained nonempty mask bitset payload bytes share the existing 16 MiB cap, with
    aligned binding/root and mask vectors making position implicit and uncharged
  - ActiveCatalogSnapshot and historical-plan resolution that walk active-to-genesis by exact parent version/hash,
    revalidate adjacent bundles forward with the shared comparator, reject gaps/cycles/substitution/numeric-version
    ancestry, and attach one shared nonserializable catalog-owned lineage proof to ResolvedExecutablePlan
  - Schema-derived, canonical field-introduction ledgers and opaque exact-writer null-fill masks for entity/event
    owners, preserving unknown fields and authorizing only strict ancestor optional-null omissions without trusting a
    compatibility report as proof
  - Opaque process-local command-materialization API whose successful Ready evidence supplies a bounded normalized
    snapshot and opaque current-recheck evidence, while valid over-limit resource evidence retains only the original
    bounded raw snapshot plus the exact resolved plan/proof and no over-budget normalized data or masks
  - Pure catalog-owned current-recheck operation consumed only after coordinator dependency equality; it proves exact
    raw physical observation equality and deterministically repeats the same normalization and exact charge without a
    catalog lookup, storage I/O, runtime evaluation, or exposure of masks/proof internals to WP-100
  - Opaque process-local projection event-materialization view that binds the exact resolved projection bundle and
    plan to an enclosing commit's exact writer-plan reference and immutable durable event, reuses the catalog-proved
    omission authority, preserves unknown fields, and never changes event bytes/hash or crosses a storage trait
  - Activation preparation checks for count, exact canonical bytes, and proof charge before coordinator submission,
    plus startup InvalidHistoricalEvidence classification for any broken or over-limit active chain; storage reads
    remain CatalogError::Storage and expected-active comparison remains coordinator-owned
  - Boundary fixtures for 4,096/4,097 bundles, 64 MiB/equal-plus-one canonical bytes, a synthetic checked proof-charge
    calculator at 2 MiB/equal-plus-one without claiming a valid proof reaches the cap, the separate valid 1,810,703-byte
    proof maximum/headroom, combined 16 MiB snapshot-plus-mask equality/equal-plus-one, one-byte-over returned resource
    evidence retaining no normalized data/masks, Ready/resource current-recheck equality and deterministic charge,
    parent gaps/cycles/hash substitution, and ancestor/equal/descendant writer masks
  - Exact historical KeySchema validation for every IR-opaque persisted entity-key, index-entry-key, and range-prefix-key
    evidence item, with unknown owners/schemas, component-incomplete bytes, omissions, and non-exact stream ends rejected
  - Catalog-owned pure bounded capability-partition schema validator shared by service admission and startup history,
    plus consumption of every 0x05 capability-partition evidence item after persisted-key evidence against the active
    validated bundle before ValidatedCatalogHistory can be produced
  - Architecture checks proving ValidatedCatalogHistory and command materialization evidence never cross a storage
    trait, concrete storage never directly imports or interprets contract IR, WP-100 consumes but does not implement
    or inspect the opaque evidence API, and neither side accepts a generic validation callback
  - Catalog consumption of the replacement-only IndexMigrationRow historical-evidence variant with its exact 0x04
    ordering, charge, single-consumption, V1/V2 coverage, and unchanged 0x05 capability-partition ordering
  - Pure bounded historical partition derivation through the sole narrow riffdb-catalog-to-riffdb-invariant edge,
    using the exact retained bundle and positional aggregate-root key prefix for roots, children, and embedded index
    entity keys, with wrong ownership, lineage, schema, partition, incomplete consumption, or trailing bytes rejected
  - Non-readiness CatalogIndexMigrationContext plus catalog-owned fields-private move-only V1Rewrite/V2Confirm,
    instruction-batch, pending, completion, and consuming driver types; every scan/bundle/apply/finish exchange
    consumes a request/proof branded by concrete backend type B, response factories consume only that exact request,
    row derivation accepts the exact owned canonical bundle and never a caller partition, and only a fresh V2-only
    validation can produce ValidatedCatalogHistory
  - Compile-fail/type-state fixtures proving no external crate can construct catalog progress/completion, a local fake
    backend cannot replay Batch<Fake> as Batch<Redb>, and server code cannot receive a branded request/response or
    instruction
  acceptance_commands:
  - cargo test -p riffdb-catalog
  - cargo test -p riffdb-catalog --test contract_deploy_recovery
  external_test_targets:
  - name: contract_deploy_recovery
    owner_crate: riffdb-catalog
    manifest: crates/riffdb-catalog/Cargo.toml
    path: ../../tests/contract_deploy_recovery.rs
  exit_gate: Deployment crash tests leave exactly the old or new bundle active, retries resolve by version, exact
    active-lineage count/byte/proof boundaries, opaque Ready/resource evidence retention, current-recheck, and writer
    masks pass, malformed chains or ADR-0020 command-name registries reject, and only complete same-session historical
    evidence, including every qualifying capability-partition item, can produce ValidatedCatalogHistory.
  human_review_triggers: *id001
- id: WP-060
  name: Storage semantic API
  depends_on:
  - WP-010
  - WP-020
  - WP-040
  objective: Define the narrow storage contract required by snapshots, atomic command commits, catalog state,
    exclusive startup evidence, scans, and derived workers.
