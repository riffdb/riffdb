      --exact
      saturated_command_capacity_rejects_before_reauthorization_with_typed_overload
      capacity_n_concurrent_commands_yield_only_typed_overload_or_commit
      retained_bytes_exhaustion_rejects_with_capacity_stage
      read_only_capacity_rejects_before_audit_start_with_typed_overload
