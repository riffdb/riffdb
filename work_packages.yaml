  - crates/riffdb-proto/src/public_error.rs
  - crates/riffdb-proto/src/value.rs
  - crates/riffdb-proto/src/wire.rs
  - crates/riffdb-proto/examples/generate_proto.rs
  - crates/riffdb-proto/tests/schema.rs
  - crates/riffdb-proto/tests/wire_vectors.rs
  - fixtures/proto/descriptors/riffdb-v1-descriptor-set.bin
  - fixtures/proto/schema-inventory.txt
  - fixtures/proto/wire-vectors.txt
  deliverables:
  - ID and version newtypes
  - Fixed-scale decimal representation
  - Canonical value and hashing rules
  - Typed partition/index keys and command/projection/root hash domains
  - Timestamp and logical-time types
  - Public safe error taxonomy
  - Consumer-owned synchronous IncidentIdSource interface in riffdb-errors, with bounded static source failures and
    no concrete clock, entropy provider, fallback identifier, or runtime dependency
  - Nonzero assigned CommitSequence, AdministrationSequence, EntityVersion, and IndexEpoch types with explicit
    before-first FrontierPosition, fallible EventId decoding, and zero-rejection fixtures
  - One-based nonzero ContractVersion and compiler-assigned EntityTypeId, FieldId, CommandId, OutcomeId, ProjectionId,
    EventTypeId, IndexId, EnumTypeId, EnumVariantId, AggregateTypeId, and InvariantId with fallible construction and
    zero-rejecting decoders
  - Nonzero DigestKeyId plus phase-zero command/value decoder rejection of zero ContractVersion, CommitSequence,
    FieldId, EnumTypeId, and EnumVariantId without adding another schema symbol
  - Shared service-operation, audit-phase, ingress, and bounded admitted-provenance component vocabulary, plus the
    exact ADR-0021 nine-variant lineage-scoped ServiceAuditTargetV1 tags, canonical key/order, duplicate rejection,
    and zero-through-16 checked collection
  - Foundational ActorKind, Audience, ApprovalId, CapabilityTokenDigest, capability-token hash domain, bounds,
    redaction, and canonicalization fixtures
  - AdmittedActorContext, nonzero ExecutionFailureCode, CommandExecutionFailed, fixed execution budgets, and safe
    mapping/redaction fixtures
  - The exact additive ADR-0012 CommandExecutionFailed error.proto symbols, generated artifacts, safe domain mapping,
    preflight validation, and golden fixtures; no other public or durable schema change
  - ProjectionIdentity, ProjectionGeneration, projection group/prefix/frontier/apply-key builders,
    ProjectionApplyHash, and riffdb.projection-apply/v1 golden cross-domain fixtures
  - Pure checked UUIDv7 assembly for every shared UUID identifier, exact ADR-0018 byte golden, timestamp overflow
    rejection, and validation proving riffdb-types has no ambient clock/entropy dependency
  acceptance_commands:
  - cargo test -p riffdb-types -p riffdb-errors -p riffdb-proto
  - cargo clippy -p riffdb-types -p riffdb-errors -p riffdb-proto --all-targets -- -D warnings
  - ./scripts/generate-proto --check
  exit_gate: Canonicalization, ordering, decimal, assigned-type zero rejection, hash-domain separation, and
    error-redaction property tests pass.
  human_review_triggers: *id001
