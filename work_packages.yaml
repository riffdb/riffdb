  - scripts/generate-proto*
  - crates/riffdb-storage-api/Cargo.toml
  - crates/riffdb-storage-api/src/lib.rs
  - crates/riffdb-storage-api/src/proto_codec/**
  deliverables:
  - Exactly eight riffdb.storage.v1 semantic-record source modules named common.proto, metadata.proto,
    application.proto, catalog.proto, capability.proto, audit.proto, outbox.proto, and projection.proto, in addition
    to the existing envelope.proto; together they contain the accepted exact 26 top-level StoredEnvelope payload
    registry for authoritative state, command admission and terminal failure, standalone events, provenance,
    catalog, capability, bootstrap, audit, outbox, and projection state
  - Exact application and administration allocator-state messages/codecs for Next(nonzero) and Exhausted, with
    first, maximum, exhausted, malformed, and compound-bootstrap capacity fixtures
  - Descriptors, schema hashes, wire-structural validation, decoder bounds, golden bytes, and historical compatibility
    registrations
  - Checked storage DTO mappings through a one-way riffdb-storage-api proto_codec bridge with no reverse
    riffdb-proto dependency on storage
  - Linked durable records for the compound bootstrap transition and reviewed projection generation/frontier records
  - Exact DatabaseId initialization metadata, ProvenanceId commit linkage, UUIDv7 validation, audit linked-result,
    and absent-initial-outbox-status mappings with deterministic wire fixtures
  - Exact EventHash preimage/domain-frame codec, descriptor and golden fixtures, including EventId/type/ordinal,
    payload-length, canonical-record ordering, cross-domain, malformed, and durable round-trip cases
  - Separately registered top-level StoredDurableEventV1 envelope and codec in addition to its exact reciprocal
    nested commit/outbox representations, with no missing, orphaned, unequal, or hash-invalid copy accepted
  - Conservative per-record-class upper bounds for the complete canonical StoredEnvelope, with proofs against the
    real codec, exact actual byte-charge reporting, equal-bound success, one-byte-over rejection, and aggregate
    reservation fixtures consumed by WP-070 before sequence staging; WP-060 remains responsible only for
    synthetic-charge conformance
  - Reviewed durable representation and total mapping for all nine ADR-0021 target variants, preserving canonical
    order while rejecting unknown/zero kinds, malformed lineage scope, duplicates, noncanonical order, and over 16
  - Generated schema inventory proving the exact ADR-0019 retained metadata records and no NodeId, clean-shutdown,
    last-successful-integrity-check, reserved-field, key-codec, or envelope placeholder for deferred metadata
  - Terminal-idempotency fixtures proving that one full StoredOutcomeV1 envelope is both terminal state and persisted
    outcome, with no pointer, tombstone, or second terminal envelope, and malformed outcome/commit/provenance
    reciprocity vectors for WP-070 startup validation
  - Encoded-capacity fixtures proving that atomic pending-row deletion and index-entry deletion write no envelope
    bytes, mixed index classes sum only canonical Put post-images, and their distinct semantic charges remain nonzero
  acceptance_commands:
  - cargo test -p riffdb-proto -p riffdb-storage-api
  - ./scripts/generate-proto --check
  exit_gate: Every durable semantic record has bounded validation, stable generated descriptors and goldens, checked
    storage mappings, exact event-hash and canonical-envelope upper-bound evidence, no deferred operational-metadata
    placeholder, and a clean generation diff before redb persistence begins.
  human_review_triggers: *id001
