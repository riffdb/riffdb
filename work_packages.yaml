- id: WP-050
  name: Contract catalog
  depends_on:
  - WP-020
  - WP-040
  - WP-060
  objective: Define immutable bundle persistence, catalog-owned historical-plan validation and opaque command
    materialization evidence, and a typed catalog-activation intent for coordinator-owned, optimistic expected-version
    deployment.
  requirements:
  - CMP-001
  - CMP-020
