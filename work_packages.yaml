    crates/riffdb-cli/src/app.rs, tests/storage_recovery/**,
    tests/endurance_harness.rs, scripts/endurance-lifecycle]
  deliverables:
  - Maintainer-accepted ADR-0085 amendment defining the exact pre-prune journal recovery and
    rebase order; retention never journals each system delete and never starts from an
    unreconciled or unpublished command suffix
  - An exclusive typed retention preparation witness proving redb contains the complete published
    frontier, followed by an empty journal extent whose generation is strictly greater than every
    predecessor; checkpoint deletion and the first prune transaction are impossible before it
  - Deterministic failures before, during, and after next-extent creation, sync, rename, checkpoint
    deletion, and each prune sub-range; every accepted state reopens as either wholly unpruned or
    a tombstone-covered prefix, and stale residue or mixed generations remain corruption
  - Installed CLI evidence that a command-bearing database can shut down, prune, reopen, advance
    with another public command, prune again, and reopen without a stale scratch extent or a
    CorruptData startup failure
  acceptance_commands:
  - cargo +1.97.0 test -p riffdb-storage-redb --all-features
  - cargo +1.97.0 test --test storage_recovery_matrix
  - cargo +1.97.0 test -p riffdb-testkit --test endurance_harness
  - cargo +1.97.0 test -p riffdb-cli --all-features
  - ./scripts/check-requirement-coverage
  exit_gate: Retention cannot mutate a database whose journal has not been recovered and durably
