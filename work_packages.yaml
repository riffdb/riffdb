  deliverables:
  - Seven capacity/admission service_end_to_end tests rewritten to constructed saturation
    (held workload permits or retained-byte budget) with generous request deadlines
  - contract_migration_gate_a terminal wait ends on migration phase state with a hang ceiling only
  - Sub-MIN_REMAINING immediate-reject coverage moved to unit level (riffdb-service
    admission_budget_* tests) now that no end-to-end probe carries a near-expired deadline, with
    a source-level pin that both admission stages shed a sub-floor budget through one shared
    mapping. Falsifiability - deleting the early return in admission_deadline reddens
    admission_budget_rejects_below_min_remaining_and_reserves_it_above; mapping the rejection to
    DeadlineExceeded reddens admission_budget_rejection_is_typed_capacity_overload_not_deadline_exceeded
    (the mapping rule) or a_sub_floor_admission_budget_is_shed_as_overload_at_both_admission_stages
    (either consuming arm).
  - Queue-delay shed asserts zero bounded admission-wait registrations, the only
    shed-distinguishing observable. Typed Overloaded, CapacityRejected QueueDepth, and zero durable
    audit rows are NOT shed-distinguishing - the 150 ms admission-cap fallthrough produces all
    three identically, so the earlier claim that disabling the shed reddens those asserts was
    wrong. Falsifiability - disabling the shed condition reddens
    queue_delay_shed_rejects_before_admission_with_zero_durable_audit_rows on the registration
    assert alone; admission_deadline_while_queued_is_overloaded_not_deadline_exceeded carries the
    nonzero positive control so the zero assert cannot pass vacuously.
