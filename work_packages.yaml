spec_version: '0.2'
product: RiffDB
repository: riffdb
status: implementation-handoff-draft
source_spec: SPEC.md
normative_terms:
- MUST
- MUST NOT
- SHOULD
- SHOULD NOT
- MAY
global_rules:
- All first-party production code is Rust.
- All application mutation passes through the shared application service and commit coordinator.
- No work package may weaken a normative guarantee without an accepted ADR.
- Every work package must map requirements to automated tests or an explicitly approved manual artifact.
- Generated sources and fixtures must be reproducible and checked for a clean worktree.
requirement_coverage:
  source: SPEC.md
  excluded_ids:
  - id: TXN-004
    reason: Illustrative identifier in the normative-language explanation, not a defined requirement.
gates:
- id: P0
  name: Executable semantics
  requires:
  - WP-030
  - WP-040
  - WP-060
  - WP-080
- id: P1
  name: Durable standalone
  requires:
  - WP-050
  - WP-070
  - WP-090
  - WP-100
  - WP-110
  - WP-120
  - WP-130
  - WP-150
- id: P2
  name: POC exit
  requires:
  - WP-140
  - WP-160
  - WP-170
  - WP-180
  - WP-185
  - WP-190
  - WP-200
work_packages:
- id: WP-000
  name: Repository foundation
  depends_on: []
  objective: Create the reproducible Rust workspace, quality gates, ADR workflow, and generation checks used by
    every later package.
  requirements:
  - SYS-001
  - SYS-002
  - SYS-003
  - REP-001
  - POC-010
  required_adrs: []
  allowed_paths:
  - .gitignore
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - deny.toml
  - .github/**
  - scripts/**
  - adr/**
  - crates/*/Cargo.toml
  - crates/*/src/**
  deliverables:
  - Workspace crate skeletons
  - Pinned Rust toolchain
  - Formatting, Clippy, test, docs, dependency-policy CI
  - ADR template and PR contract
  - Deterministic generated-artifact check
  - Machine-checked normative requirement coverage for work_packages.yaml
  acceptance_commands:
  - cargo fmt --all -- --check
  - cargo clippy --workspace --all-targets --all-features -- -D warnings
  - cargo test --workspace
  - cargo deny check
  - ./scripts/check-requirement-coverage
  exit_gate: Clean CI on the skeleton workspace from a fresh checkout.
  human_review_triggers: &id001
  - A normative transaction, durability, authorization, or MCP guarantee would change.
  - A durable format, public protocol, or contract IR change is incompatible.
  - Unsafe Rust, native code, cryptography, or a new critical dependency is required.
  - Implementation needs files outside allowed_paths or an unmet dependency interface.
- id: WP-010
  name: Core types and error taxonomy
  depends_on:
  - WP-000
  objective: Define canonical domain newtypes, values, versions, timestamps, decimals, safe public errors, and internal
    error layering.
  requirements:
  - SYS-003
  - ID-001
  - ID-002
  - ID-003
  - ID-004
  - ID-005
  - VAL-001
  - VAL-002
  - STO-002
  required_adrs:
  - ADR-0011
  - ADR-0005
  allowed_paths:
  - Cargo.lock
  - crates/riffdb-types/**
  - crates/riffdb-errors/**
  - crates/riffdb-testkit/src/canonical/**
  deliverables:
  - ID and version newtypes
  - Fixed-scale decimal representation
  - Canonical value and hashing rules
  - Timestamp and logical-time types
  - Public safe error taxonomy
  acceptance_commands:
  - cargo test -p riffdb-types -p riffdb-errors
  - cargo clippy -p riffdb-types -p riffdb-errors --all-targets -- -D warnings
  exit_gate: Canonicalization, ordering, decimal, and error-redaction property tests pass.
  human_review_triggers: *id001
- id: WP-020
