  - A measured diagnosis naming the first saturated stage without weakening or bypassing any command
    obligation
  acceptance_commands:
  - cd examples/app-baseline && cargo +1.97.0 test --workspace
  - cargo +1.97.0 test -p riffdb-observability --all-features
  - cargo +1.97.0 test -p riffdb-server --all-features
  - ./benchmarks/run-app-baseline --self-test
  - cargo +1.97.0 fmt --all -- --check
  - cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
  exit_gate: Every concurrency point owns an independent telemetry delta and fresh database by
    default, write-only saturation exposes the physical durable ceiling, and no PERF-008 conclusion
    depends on cumulative shutdown-only counters or an accumulated-history curve.
  human_review_triggers: *id001
- id: WP-450
  name: Independent read and command admission topology
  depends_on: [WP-449]
