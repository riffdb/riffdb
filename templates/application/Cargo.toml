[package]
name = "{{APPLICATION_NAME}}"
version = "0.1.0"
edition = "2024"
publish = false

# The checked-in template keeps language-specific Rust source at `rust-main.rs`
# until `riffdb new` materializes the conventional `src/main.rs` layout.
[package.metadata.cargo-machete]
ignored = ["riffdb-client-rust", "tokio"]

[dependencies]
riffdb-client-rust = { version = "0.1.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
