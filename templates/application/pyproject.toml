[project]
name = "{{APPLICATION_NAME}}"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["riffdb-application==0.1.0"]

[tool.uv]
package = false

[tool.uv.sources]
riffdb-application = { path = "vendor/{{WHEEL_NAME}}" }

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
