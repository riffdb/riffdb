[package]
name = "riffdb-contract-syntax-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13" }
riffdb-columnar = { version = "0.2.4", path = "../crates/riffdb-columnar" }
riffdb-contract-syntax = { version = "0.2.4", path = "../crates/riffdb-contract-syntax" }
riffdb-driver-host = { version = "0.2.4", path = "../crates/riffdb-driver-host" }
riffdb-proto = { version = "0.2.4", path = "../crates/riffdb-proto" }
riffdb-riffql-syntax = { version = "0.2.4", path = "../crates/riffdb-riffql-syntax" }
riffdb-storage-api = { version = "0.2.4", path = "../crates/riffdb-storage-api" }
riffdb-storage-redb = { version = "0.2.4", path = "../crates/riffdb-storage-redb", features = ["test-fixtures"] }

[[bin]]
name = "columnar_segment_v2"
path = "fuzz_targets/columnar_segment_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_parser"
path = "fuzz_targets/contract_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_source"
path = "fuzz_targets/contract_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "riffql_parser"
path = "fuzz_targets/riffql_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_durable"
path = "fuzz_targets/proto_durable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_public"
path = "fuzz_targets/proto_public.rs"
test = false
doc = false
bench = false

[[bin]]
name = "driver_host_protocol"
path = "fuzz_targets/driver_host_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "maintenance_receipt"
path = "fuzz_targets/maintenance_receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_receipt"
path = "fuzz_targets/migration_receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_journal"
path = "fuzz_targets/migration_journal.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[patch.crates-io]
h2 = { git = "https://github.com/koshea/h2", rev = "e9554c2cb105845d0ed6f0a7f89c8032ba24edba" }
redb = { git = "https://github.com/koshea/redb", rev = "fdb728c4097471323f5c1fa3f6fbb7f47d242882" }
rustix = { git = "https://github.com/koshea/rustix", rev = "12b1a39f8a327cdb554322b81b1bd04606b2fdd7" }
