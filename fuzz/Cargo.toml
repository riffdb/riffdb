[package]
name = "riffdb-contract-syntax-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.13" }
riffdb-contract-syntax = { version = "0.1.0", path = "../crates/riffdb-contract-syntax" }
riffdb-proto = { version = "0.1.0", path = "../crates/riffdb-proto" }
riffdb-storage-api = { version = "0.1.0", path = "../crates/riffdb-storage-api" }
riffdb-storage-redb = { version = "0.1.0", path = "../crates/riffdb-storage-redb", features = ["test-fixtures"] }

[[bin]]
name = "contract_parser"
path = "fuzz_targets/contract_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_source"
path = "fuzz_targets/contract_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_durable"
path = "fuzz_targets/proto_durable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_public"
path = "fuzz_targets/proto_public.rs"
test = false
doc = false
bench = false

[[bin]]
name = "maintenance_receipt"
path = "fuzz_targets/maintenance_receipt.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
