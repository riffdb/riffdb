[workspace]
resolver = "3"
members = [
    "crates/riffdb-api-grpc",
    "crates/riffdb-api-mcp",
    "crates/riffdb-application",
    "crates/riffdb-auth",
    "crates/riffdb-bench-root",
    "crates/riffdb-catalog",
    "crates/riffdb-columnar",
    "crates/riffdb-cli",
    "crates/riffdb-client-rust",
    "crates/riffdb-client-python-native",
    "crates/riffdb-commit",
    "crates/riffdb-conflict",
    "crates/riffdb-config",
    "crates/riffdb-contract-compiler",
    "crates/riffdb-contract-ir",
    "crates/riffdb-contract-syntax",
    "crates/riffdb-diagnostics",
    "crates/riffdb-driver-host",
    "crates/riffdb-errors",
    "crates/riffdb-idempotency",
    "crates/riffdb-invariant",
    "crates/riffdb-mcp-stdio",
    "crates/riffdb-observability",
    "crates/riffdb-outbox",
    "crates/riffdb-policy",
    "crates/riffdb-projection",
    "crates/riffdb-proto",
    "crates/riffdb-query-ir",
    "crates/riffdb-query-compiler",
    "crates/riffdb-query-executor",
    "crates/riffdb-query-module",
    "crates/riffdb-runtime",
    "crates/riffdb-scheduler",
    "crates/riffdb-riffql-syntax",
    "crates/riffdb-server",
    "crates/riffdb-service",
    "crates/riffdb-sim",
    "crates/riffdb-storage-api",
    "crates/riffdb-storage-memory",
    "crates/riffdb-storage-redb",
    "crates/riffdb-testkit",
    "crates/riffdb-types",
    "examples/ticketdesk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
await_holding_lock = "deny"

[workspace.dependencies]
pyo3 = { version = "=0.29.0", default-features = false, features = ["extension-module", "abi3-py313"] }
pyo3-async-runtimes = { version = "=0.29.0", default-features = false, features = ["tokio-runtime"] }
# Test-only temp-directory lifecycle guard (dev-dependency everywhere).
# Already in Cargo.lock transitively via prost-build and tonic-prost-build
# (riffdb-proto dev-deps); pinned exact per house style. default-features
# off drops tempfile's `getrandom` feature, whose only effect is re-seeding
# the name generator after repeated collisions — irrelevant for scratch dirs.
tempfile = { version = "=3.24.0", default-features = false }

# Release code with symbols and frame pointers, for profiling only.
#
# `perf --call-graph fp` returns empty call graphs against `--release` because
# the release profile omits frame pointers; every profiling round in this
# repository has so far worked around that by hand with a throwaway target
# directory. This profile makes the correct build one flag instead. It is not a
# shipping profile and no gate evidence may be produced from it: `debug = true`
# and `strip = false` change the binary layout, and forced frame pointers cost
# a register.
[profile.profiling]
inherits = "release"
debug = true
strip = false
# `-C force-frame-pointers` cannot live here: the `profile-rustflags` cargo
# feature is unstable in the pinned 1.97.0 toolchain. `benchmarks/profile-read-path`
# exports it via RUSTFLAGS instead, so `perf --call-graph fp` resolves. A build of
# this profile WITHOUT that variable gives symbols but empty fp call graphs; use
# `--call-graph dwarf` in that case.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
