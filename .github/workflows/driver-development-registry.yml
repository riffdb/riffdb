name: Driver development registries

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riffdb-driver-development-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  SOURCE_DATE_EPOCH: "1735689600"

jobs:
  native-registry-consumers:
    name: four native registry consumers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.7.0"
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify runner Go toolchain
        shell: bash
        run: |
          go version
          [[ "$(go env GOVERSION)" =~ ^go1\.(2[4-9]|[3-9][0-9])([.].*)?$ ]]
      - name: Install pinned loopback npm registry
        run: npm install --prefix target/wp611-tools --ignore-scripts verdaccio@6.9.2
      - name: Build native CLI
        run: cargo +1.97.0 build --release --locked -p riffdb-cli
      - name: Build pinned manylinux Python runtime
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.97.0
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          working-directory: clients/python/runtime
          args: --release --locked --compatibility pypi --out ../../../target/wp611-python
      - name: Build unsigned production-shaped input
        shell: bash
        run: |
          wheel="$(find target/wp611-python -maxdepth 1 -type f -name 'riffdb_application-0.1.0-*.whl' -print -quit)"
          [[ -n "$wheel" ]]
          ./scripts/build-driver-distributions \
            --output "$GITHUB_WORKSPACE/target/wp611-distribution" \
            --binary-dir "$GITHUB_WORKSPACE/target/release" \
            --python-wheel "$GITHUB_WORKSPACE/$wheel" \
            --target x86_64-unknown-linux-gnu
      - name: Check source contract
        run: ./scripts/check-driver-development-registry
      - name: Prove four fresh native consumers
        env:
          RIFFDB_TMP_ROOT: ${{ runner.temp }}/riffdb-wp611
          RIFFDB_DRIVER_DISTRIBUTION: ${{ github.workspace }}/target/wp611-distribution
          RIFFDB_VERDACCIO_BIN: ${{ github.workspace }}/target/wp611-tools/node_modules/verdaccio/bin/verdaccio
        run: ./scripts/driver-development-registry-acceptance --all-ecosystems
