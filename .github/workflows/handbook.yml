name: Handbook

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: riffdb-handbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    outputs:
      deploy_pages: ${{ steps.release_gate.outputs.deploy_pages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
      - name: Cache Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: handbook-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'scripts/tool-versions') }}
      - name: Cache handbook tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/lychee
          key: handbook-tools-${{ runner.os }}-${{ hashFiles('scripts/tool-versions') }}
      - name: Install pinned handbook tools
        shell: bash
        run: |
          source scripts/tool-versions
          if ! mdbook --version 2>/dev/null | grep -Fq "v$RIFFDB_MDBOOK_VERSION"; then
            cargo install --locked --version "$RIFFDB_MDBOOK_VERSION" mdbook
          fi
          if ! lychee --version 2>/dev/null | grep -Fq "$RIFFDB_LYCHEE_VERSION"; then
            cargo install --locked --version "$RIFFDB_LYCHEE_VERSION" lychee
          fi
      - name: Verify handbook
        run: ./scripts/handbook check
      - name: Check external links on schedule
        if: github.event_name == 'schedule'
        run: lychee --include-fragments --root-dir target/handbook --exclude-path '/api/rust/' --exclude-path '/fonts/' target/handbook
      - name: Determine Pages deployment eligibility
        id: release_gate
        shell: bash
        run: |
          deploy="false"
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ./scripts/check-version-topology
            deploy="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ./scripts/check-version-topology
            deploy="true"
          elif [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag="${BASH_REMATCH[1]}"
            ./scripts/check-version-topology --release-tag "$tag"
            highest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
            if [[ -z "$highest_tag" || "$tag" == "$highest_tag" ]]; then
              deploy="true"
            fi
          fi
          printf 'deploy_pages=%s\n' "$deploy" >>"$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.release_gate.outputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/handbook

  deploy:
    name: Publish GitHub Pages (docs.riffdb.com)
    if: needs.build.outputs.deploy_pages == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

