name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify (for example v0.2.1)"
        required: false
        default: "v0.2.1"

permissions:
  contents: read

concurrency:
  group: riffdb-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  SOURCE_DATE_EPOCH: "1735689600"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  version-gate:
    name: version topology and transition gate
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      version: ${{ steps.tag.outputs.version }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz ripgrep protobuf-compiler
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache generated-check target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-unknown-linux-gnu-1.98.1-generated-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
      - name: Resolve and enforce release tag and version topology
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.release_tag || 'v0.2.1' }}"
          fi
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          ./scripts/check-version-topology --release-tag "$release_tag"
          ./scripts/check-durable-format-manifest
          ./scripts/check-driver-distribution
          ./scripts/check-driver-conformance-manifests
          ./scripts/announcement-readiness --self-test
          ./scripts/check-published-helm-upgrade-evidence --self-test
          ./scripts/run-published-helm-upgrade-evidence --self-test
          npm ci --prefix clients/typescript/runtime --ignore-scripts
          ./scripts/check-generated
          printf 'release_tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "${release_tag#v}" >>"$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  release-bundle:
    name: verified release bundle
    needs: [version-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Free runner disk space for release build
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler postgresql postgresql-client jq graphviz ripgrep
          install -d "$RUNNER_TEMP/riffdb-ci-bin"
          cat >"$RUNNER_TEMP/riffdb-ci-bin/uuidgen" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -ne 1 || "$1" != "--time-v7" ]]; then
            printf '%s\n' 'CI uuidgen supports only --time-v7' >&2
            exit 2
          fi
          printf -v timestamp '%012x' "$(date +%s%3N)"
          random_hex="$(od -An -N10 -tx1 /dev/urandom | tr -d ' \n')"
          printf -v variant '%x' "$(((16#${random_hex:3:1} & 3) | 8))"
          printf '%s-%s-7%s-%s%s-%s\n' \
            "${timestamp:0:8}" \
            "${timestamp:8:4}" \
            "${random_hex:0:3}" \
            "$variant" \
            "${random_hex:4:3}" \
            "${random_hex:7:12}"
          EOF
          chmod 0755 "$RUNNER_TEMP/riffdb-ci-bin/uuidgen"
          "$RUNNER_TEMP/riffdb-ci-bin/uuidgen" --time-v7 \
            | grep -E '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          printf '%s\n' "$RUNNER_TEMP/riffdb-ci-bin" >>"$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache release demo debug targets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/wp139-root
            target/wp139-comparison
            examples/budget-comparison/target
            benchmarks/storage-fjall/target
          key: target-${{ runner.os }}-x86_64-unknown-linux-gnu-1.98.1-release-demo-v2-${{ hashFiles('Cargo.lock', 'examples/budget-comparison/Cargo.lock', 'benchmarks/storage-fjall/Cargo.lock') }}
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run scripts/release-poc --verify on clean revision
        env:
          RIFFDB_RELEASE_CI_SHARDED: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          ./scripts/release-poc --verify
          find target/debug/deps target/release/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete 2>/dev/null || true
      - name: Upload verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-release-bundle
          path: |
            target/wp200/release/riffdb-${{ needs.version-gate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            target/wp200/release/riffdb-${{ needs.version-gate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  release-bundle-macos:
    name: verified release bundle (aarch64-apple-darwin)
    needs: [version-gate]
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache macOS release targets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: target-${{ runner.os }}-aarch64-apple-darwin-1.98.1-release-v1-${{ hashFiles('Cargo.lock') }}
      - name: Build and verify Apple Silicon macOS release bundle
        shell: bash
        run: |
          cargo +1.98.1 build --release --locked \
            -p riffdb-cli --bin riffdb \
            -p riffdb-driver-host --bin riffdb-driverd \
            -p riffdb-server --bin riffdbd \
            -p riffdb-mcp-stdio --bin riffdb-mcp
          version="${{ needs.version-gate.outputs.version }}"
          revision="${{ needs.version-gate.outputs.revision }}"
          bundle="riffdb-${version}-aarch64-apple-darwin"
          stage="$RUNNER_TEMP/macos-release/$bundle"
          mkdir -p "$stage/bin" "$stage/release" "$GITHUB_WORKSPACE/target/wp200/release"
          install -m 0755 target/release/riffdb "$stage/bin/riffdb"
          install -m 0755 target/release/riffdb-driverd "$stage/bin/riffdb-driverd"
          install -m 0755 target/release/riffdbd "$stage/bin/riffdbd"
          install -m 0755 target/release/riffdb-mcp "$stage/bin/riffdb-mcp"
          "$stage/bin/riffdb" --help >/dev/null
          test -x "$stage/bin/riffdb-driverd"
          test -x "$stage/bin/riffdbd"
          test -x "$stage/bin/riffdb-mcp"
          printf '%s\n' "$version" >"$stage/VERSION"
          printf '%s\n' "$revision" >"$stage/REVISION"
          install -m 0644 LICENSE-MIT "$stage/LICENSE-MIT"
          install -m 0644 LICENSE-APACHE "$stage/LICENSE-APACHE"
          install -m 0644 COPYRIGHT "$stage/COPYRIGHT"
          install -m 0644 release/durable-format-manifest-v1.json "$stage/release/durable-format-manifest-v1.json"
          (
            cd "$stage"
            find . -type f ! -path './SHA256SUMS' -print | sed 's|^\./||' | sort | while IFS= read -r rel; do
              printf '%s  %s\n' "$(shasum -a 256 "$rel" | awk '{print $1}')" "$rel"
            done >SHA256SUMS
          )
          archive="$GITHUB_WORKSPACE/target/wp200/release/${bundle}.tar.gz"
          tar -C "$RUNNER_TEMP/macos-release" -czf "$archive" "$bundle"
          (
            cd "$GITHUB_WORKSPACE/target/wp200/release"
            shasum -a 256 "${bundle}.tar.gz" >"${bundle}.tar.gz.sha256"
          )
      - name: Upload verified macOS release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-release-bundle-macos
          path: |
            target/wp200/release/riffdb-${{ needs.version-gate.outputs.version }}-aarch64-apple-darwin.tar.gz
            target/wp200/release/riffdb-${{ needs.version-gate.outputs.version }}-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error

  driver-packages:
    name: verified driver packages (${{ matrix.arch }})
    needs: [version-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - arch: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build native CLI and driver host
        run: |
          cargo +1.98.1 build --release --locked -p riffdb-cli -p riffdb-driver-host --bin riffdb --bin riffdb-driverd
          cargo +1.98.1 fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Build pinned Python runtime
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.98.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: clients/python/runtime
          args: --release --locked --compatibility pypi --out ../../../target/wp728-python
      - name: Build and verify driver distribution with DRV-014 conformance manifests
        env:
          RIFFDB_TMP_ROOT: ${{ runner.temp }}/riffdb-wp728-driver
        run: |
          wheel="$(find target/wp728-python -maxdepth 1 -type f -name 'riffdb_application-${{ needs.version-gate.outputs.version }}-*.whl' -print -quit)"
          [[ -n "$wheel" ]]
          ./scripts/build-driver-distributions \
            --output "$GITHUB_WORKSPACE/target/wp728-distribution-${{ matrix.target }}" \
            --binary-dir "$GITHUB_WORKSPACE/target/release" \
            --python-wheel "$GITHUB_WORKSPACE/$wheel" \
            --target "${{ matrix.target }}"
          mkdir -p "$RIFFDB_TMP_ROOT/signing"
          ssh-keygen -q -t ed25519 -N '' -C riffdb-release -f "$RIFFDB_TMP_ROOT/signing/key"
          printf 'riffdb-release namespaces="riffdb-driver-distribution-v1" %s\n' \
            "$(ssh-keygen -y -f "$RIFFDB_TMP_ROOT/signing/key")" \
            >"$RIFFDB_TMP_ROOT/signing/allowed-signers"
          ./scripts/sign-driver-distributions \
            --key "$RIFFDB_TMP_ROOT/signing/key" \
            "$GITHUB_WORKSPACE/target/wp728-distribution-${{ matrix.target }}"
          ./scripts/driver-package-arrival \
            --distribution "$GITHUB_WORKSPACE/target/wp728-distribution-${{ matrix.target }}" \
            --allowed-signers "$RIFFDB_TMP_ROOT/signing/allowed-signers" \
            --identity riffdb-release \
            --receipt "$GITHUB_WORKSPACE/target/wp728-package-arrival-${{ matrix.target }}.json"
          rm -f "$GITHUB_WORKSPACE/target/wp728-distribution-${{ matrix.target }}/checksums.sha256.sig"
      - name: Upload verified unsigned driver distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-driver-distribution-${{ matrix.target }}
          path: target/wp728-distribution-${{ matrix.target }}/**
          if-no-files-found: error

  container-image:
    name: build and publish tracked container image
    needs: [version-gate, release-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-release-bundle
          path: target/wp200/release
      - name: Extract verified release binaries and build tracked Dockerfile
        id: image
        shell: bash
        run: |
          version="${{ needs.version-gate.outputs.version }}"
          release_tag="${{ needs.version-gate.outputs.release_tag }}"
          bundle="riffdb-${version}-x86_64-unknown-linux-gnu"
          (
            cd target/wp200/release
            sha256sum -c "${bundle}.tar.gz.sha256"
            tar -xzf "${bundle}.tar.gz"
          )
          mkdir -p target/release
          install -m 0755 "target/wp200/release/${bundle}/bin/riffdb" target/release/riffdb
          install -m 0755 "target/wp200/release/${bundle}/bin/riffdbd" target/release/riffdbd
          ./scripts/check-container-startup
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${image_repo}:${release_tag}"
          image_version_tag="${image_repo}:${version}"
          docker build -f release/container/Dockerfile --build-arg RIFFDB_PROFILE=release \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${{ needs.version-gate.outputs.revision }}" \
            -t "$image_tag" -t "$image_version_tag" .
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker push "$image_tag"
            docker push "$image_version_tag"
            highest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
            if [[ -z "$highest_tag" || "$release_tag" == "$highest_tag" ]]; then
              docker tag "$image_tag" "${image_repo}:latest"
              docker push "${image_repo}:latest"
            fi
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image_tag")"
          else
            image_id="$(docker inspect --format='{{.Id}}' "$image_tag" | sed 's/^sha256://')"
            digest="${image_repo}@sha256:${image_id}"
          fi
          printf 'image_digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

  publish-release:
    name: sign, attest, and publish release and driver packages
    needs: [version-gate, release-bundle, release-bundle-macos, driver-packages, container-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-release-bundle
          path: target/wp728-inputs/bundle
      - name: Download verified macOS release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-release-bundle-macos
          path: target/wp728-inputs/bundle
      - name: Download x86_64 driver distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-driver-distribution-x86_64-unknown-linux-gnu
          path: target/wp728-inputs/drivers/x86_64-unknown-linux-gnu
      - name: Download aarch64 driver distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-driver-distribution-aarch64-unknown-linux-gnu
          path: target/wp728-inputs/drivers/aarch64-unknown-linux-gnu
      - name: Download Apple Silicon macOS driver distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-driver-distribution-aarch64-apple-darwin
          path: target/wp728-inputs/drivers/aarch64-apple-darwin
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Prepare first-party SDK conformance dependencies
        run: cargo +1.98.1 fetch --locked
      - name: Sign, assemble, and verify complete release publication
        env:
          RIFFDB_RELEASE_SSH_KEY: ${{ secrets.RIFFDB_RELEASE_SSH_KEY }}
        shell: bash
        run: |
          umask 077
          key_dir="${RUNNER_TEMP}/riffdb-release-keys"
          mkdir -p "$key_dir"
          if [[ -n "${RIFFDB_RELEASE_SSH_KEY}" ]]; then
            printf '%s\n' "${RIFFDB_RELEASE_SSH_KEY}" >"$key_dir/release-ed25519"
            chmod 0600 "$key_dir/release-ed25519"
            ssh-keygen -y -f "$key_dir/release-ed25519" >"$key_dir/release-ed25519.pub"
          else
            ssh-keygen -q -t ed25519 -N '' -C riffdb-release -f "$key_dir/release-ed25519"
          fi
          pubkey="$(cat "$key_dir/release-ed25519.pub")"
          printf 'riffdb-release namespaces="riffdb-driver-distribution-v1" %s\n' "$pubkey" \
            >"$key_dir/driver-allowed-signers"
          printf 'riffdb-release namespaces="riffdb-release-v1" %s\n' "$pubkey" \
            >"$key_dir/release-allowed-signers"
          chmod 0644 "$key_dir/driver-allowed-signers" "$key_dir/release-allowed-signers"

          version="${{ needs.version-gate.outputs.version }}"
          bundle="$GITHUB_WORKSPACE/target/wp728-inputs/bundle/riffdb-${version}-x86_64-unknown-linux-gnu.tar.gz"
          bundle_macos="$GITHUB_WORKSPACE/target/wp728-inputs/bundle/riffdb-${version}-aarch64-apple-darwin.tar.gz"
          qa="$RUNNER_TEMP/riffdb-announcement"
          install -d -m 0700 "$qa" "$qa/unpacked" "$qa/unpacked-macos"
          (cd "$GITHUB_WORKSPACE/target/wp728-inputs/bundle" && sha256sum -c "riffdb-${version}-x86_64-unknown-linux-gnu.tar.gz.sha256")
          (cd "$GITHUB_WORKSPACE/target/wp728-inputs/bundle" && sha256sum -c "riffdb-${version}-aarch64-apple-darwin.tar.gz.sha256")
          tar -xzf "$bundle" -C "$qa/unpacked"
          tar -xzf "$bundle_macos" -C "$qa/unpacked-macos"
          installed="$qa/unpacked/riffdb-${version}-x86_64-unknown-linux-gnu"
          installed_macos="$qa/unpacked-macos/riffdb-${version}-aarch64-apple-darwin"

          ./scripts/build-driver-distributions \
            --output "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/x86_64-unknown-linux-gnu" \
            --binary-dir "$installed/bin" \
            --target x86_64-unknown-linux-gnu \
            --refresh-binaries
          ./scripts/build-driver-distributions \
            --output "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/aarch64-apple-darwin" \
            --binary-dir "$installed_macos/bin" \
            --target aarch64-apple-darwin \
            --refresh-binaries

          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            dist="$GITHUB_WORKSPACE/target/wp728-inputs/drivers/$target"
            chmod 0755 "$dist/install/riffdb-install" "$dist/bin/$target/riffdb" "$dist/bin/$target/riffdb-driverd"
            ./scripts/sign-driver-distributions --key "$key_dir/release-ed25519" "$dist"
            ./scripts/verify-driver-distributions \
              --allowed-signers "$key_dir/driver-allowed-signers" \
              --identity riffdb-release \
              "$dist"
          done

          mkdir -p target/release
          install -m 0755 "$installed/bin/riffdb" target/release/riffdb
          install -m 0755 "$installed/bin/riffdbd" target/release/riffdbd
          docker build -f release/container/Dockerfile \
            --label "org.opencontainers.image.revision=${{ needs.version-gate.outputs.revision }}" \
            --label "org.opencontainers.image.version=$version" \
            -t riffdb-announcement-candidate .
          ./scripts/announcement-readiness \
            --bundle-root "$installed" --version "$version" --revision "${{ needs.version-gate.outputs.revision }}" \
            --driver-distribution "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/x86_64-unknown-linux-gnu" \
            --allowed-signers "$key_dir/driver-allowed-signers" --signer-identity riffdb-release \
            --container-engine docker --container-image riffdb-announcement-candidate \
            --qualify-core --run-root /tmp/riffdb-announcement-run \
            --report "$GITHUB_WORKSPACE/target/wp922-announcement.json"
          publication="$GITHUB_WORKSPACE/target/wp728-publication"
          ./scripts/publish-release-artifacts assemble \
            --release-tag "${{ needs.version-gate.outputs.release_tag }}" \
            --bundle-archive "$bundle" \
            --extra-bundle-archive "$bundle_macos" \
            --driver-distribution "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/x86_64-unknown-linux-gnu" \
            --driver-distribution "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/aarch64-unknown-linux-gnu" \
            --driver-distribution "$GITHUB_WORKSPACE/target/wp728-inputs/drivers/aarch64-apple-darwin" \
            --driver-allowed-signers "$key_dir/driver-allowed-signers" \
            --driver-identity riffdb-release \
            --signing-key "$key_dir/release-ed25519" \
            --container-image-digest "${{ needs.container-image.outputs.image_digest }}" \
            --output "$publication"
          ./scripts/publish-release-artifacts verify \
            --publication "$publication" \
            --allowed-signers "$key_dir/release-allowed-signers" \
            --identity riffdb-release \
            --expected-tag "${{ needs.version-gate.outputs.release_tag }}"
          install -m 0644 "$key_dir/release-allowed-signers" "$publication/riffdb-release-allowed-signers"
          install -m 0644 "$key_dir/driver-allowed-signers" "$publication/riffdb-driver-allowed-signers"
          python3 -m pip install --quiet maturin==1.14.1 twine
          ./scripts/build-python-sdist "$publication"
          ./scripts/publish-release-artifacts publish-registries \
            --publication "$publication" \
            --release-tag "${{ needs.version-gate.outputs.release_tag }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --notes-file release/RELEASE_NOTES.md \
            --sdist "$publication/riffdb_application-${version}.tar.gz" \
            --dry-run \
            --receipt "$publication/release-registry-plan-v1.json"
      - name: Attest build provenance over published artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/wp728-publication/riffdb-${{ needs.version-gate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            target/wp728-publication/riffdb-${{ needs.version-gate.outputs.version }}-aarch64-apple-darwin.tar.gz
            target/wp728-publication/riffdb-${{ needs.version-gate.outputs.version }}.tgz
            target/wp728-publication/consumer-verification-v1.json
            target/wp728-publication/sbom.cdx.json
            target/wp728-publication/durable-format-manifest-v1.json
            target/wp728-publication/version-topology-v1.json
            target/wp728-publication/release-provenance-v1.json
            target/wp728-publication/SHA256SUMS
      - name: Publish immutable GitHub Release and ecosystem driver packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          publication="$GITHUB_WORKSPACE/target/wp728-publication"
          version="${{ needs.version-gate.outputs.version }}"
          tag="${{ needs.version-gate.outputs.release_tag }}"
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            npm install --global --no-fund --no-audit "npm@^11.5.1"
          fi
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          ./scripts/publish-release-artifacts publish-registries \
            --publication "$publication" \
            --release-tag "$tag" \
            --repository "${GITHUB_REPOSITORY}" \
            --notes-file release/RELEASE_NOTES.md \
            --sdist "$publication/riffdb_application-${version}.tar.gz" \
            --receipt "$publication/release-registry-publication-v1.json"

      - name: Verify anonymous release availability before announcement
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${{ needs.version-gate.outputs.version }}"
          ./scripts/announcement-readiness \
            --bundle-root "$RUNNER_TEMP/riffdb-announcement/unpacked/riffdb-${version}-x86_64-unknown-linux-gnu" \
            --version "$version" --revision "${{ needs.version-gate.outputs.revision }}" \
            --probe-public --container-engine docker --run-root /tmp/riffdb-announcement-public \
            --report "$GITHUB_WORKSPACE/target/wp922-publication.json"
      - name: Upload sanitized announcement qualification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-announcement-qualification
          path: |
            target/wp922-announcement.json
            target/wp922-publication.json
          if-no-files-found: ignore
