name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riffdb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.97.0"
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Clippy target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-clippy-all-${{ hashFiles('Cargo.lock') }}
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-partition-coverage:
    name: Test partition coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned cargo-nextest
        run: |
          source scripts/tool-versions
          cargo install --locked --version "$RIFFDB_CARGO_NEXTEST_VERSION" cargo-nextest
      - name: Prove exactly-once target scheduling
        run: ./scripts/check-test-partition-coverage

  test:
    name: Tests (${{ matrix.partition }}/4)
    needs: test-partition-coverage
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache test target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-test-${{ matrix.partition }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned cargo-nextest
        run: |
          source scripts/tool-versions
          cargo install --locked --version "$RIFFDB_CARGO_NEXTEST_VERSION" cargo-nextest
      - name: Run whole-target partition
        run: ./scripts/run-test-partition --mode whole-target --partition "${{ matrix.partition }}"

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache documentation target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-docs-${{ hashFiles('Cargo.lock') }}
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-tools-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('scripts/tool-versions') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-tools-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('scripts/tool-versions') }}
      - name: Install pinned policy tools
        run: |
          source scripts/tool-versions
          cargo install --locked --version "$RIFFDB_CARGO_DENY_VERSION" cargo-deny
          cargo install --locked --version "$RIFFDB_CARGO_AUDIT_VERSION" cargo-audit
          cargo install --locked --version "$RIFFDB_CARGO_MACHETE_VERSION" cargo-machete
      - name: Check dependency policy
        run: cargo deny check
      - name: Audit advisories
        run: cargo audit
      - name: Check unused dependencies
        run: cargo machete

  generated:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install generated-artifact tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz ripgrep
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check generated artifacts
        run: |
          ./scripts/check-generated
          ./crates/riffdb-contract-syntax/generate-language-reference --check

  workspace-policy:
    name: Workspace policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check workspace structure
        run: ./scripts/check-workspace-policy
      - name: Check requirement coverage
        run: ./scripts/check-requirement-coverage
      - name: Check ADR obligations
        run: ./scripts/check-adr-obligations

  governance:
    name: Governance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # classify-change needs history to resolve merge-base(HEAD, main).
          fetch-depth: 0
      - name: Check requirement coverage
        run: ./scripts/check-requirement-coverage
      - name: Check ADR obligations
        run: ./scripts/check-adr-obligations
      - name: Self-test canonical ADR allocation
        run: ./scripts/adr-new --self-test
      - name: Check the ADR index
        run: ./scripts/adr-index --check
      - name: Check that acceptance commits stand alone
        run: ./scripts/check-acceptance-commits
      - name: Check the performance-package freeze
        run: ./scripts/check-performance-freeze
      - name: Check the three hand-written operation places
        if: github.event_name == 'pull_request'
        run: ./scripts/check-three-places --base "${{ github.event.pull_request.base.sha }}"
      - name: Self-test the three-places guard
        if: github.event_name != 'pull_request'
        run: ./scripts/check-three-places --self-test
      - name: Classify the change
        run: ./scripts/classify-change --json

  source-convenience:
    name: Source install and bootstrap
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Install smoke prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          install -d "$RUNNER_TEMP/riffdb-ci-bin"
          cat >"$RUNNER_TEMP/riffdb-ci-bin/uuidgen" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -ne 1 || "$1" != "--time-v7" ]]; then
            printf '%s\n' 'CI uuidgen supports only --time-v7' >&2
            exit 2
          fi
          printf -v timestamp '%012x' "$(date +%s%3N)"
          random_hex="$(od -An -N10 -tx1 /dev/urandom | tr -d ' \n')"
          printf -v variant '%x' "$(((16#${random_hex:3:1} & 3) | 8))"
          printf '%s-%s-7%s-%s%s-%s\n' \
            "${timestamp:0:8}" \
            "${timestamp:8:4}" \
            "${random_hex:0:3}" \
            "$variant" \
            "${random_hex:4:3}" \
            "${random_hex:7:12}"
          EOF
          chmod 0755 "$RUNNER_TEMP/riffdb-ci-bin/uuidgen"
          "$RUNNER_TEMP/riffdb-ci-bin/uuidgen" --time-v7 \
            | grep -E '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          printf '%s\n' "$RUNNER_TEMP/riffdb-ci-bin" >>"$GITHUB_PATH"
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-source-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'xtask/Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-source-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'xtask/Cargo.lock') }}
      - name: Cache source-convenience targets
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target
            xtask/target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-source-${{ hashFiles('Cargo.lock', 'xtask/Cargo.lock') }}
      - name: Check source-command workspace
        run: |
          cargo fmt --manifest-path xtask/Cargo.toml -- --check
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path xtask/Cargo.toml
      - name: Check Cargo alias dispatch
        run: |
          cargo riffdb --help
          cargo riffdb install --help
          cargo riffdb bootstrap --help
      - name: Build source-bootstrap binaries
        run: |
          cargo build --locked \
            -p riffdb-server --bin riffdbd \
            -p riffdb-cli --bin riffdb \
            -p riffdb-mcp-stdio --bin riffdb-mcp
      - name: Run source install smoke
        run: ./scripts/release-source-install-smoke
      - name: Run source bootstrap smoke
        run: ./scripts/release-source-bootstrap-smoke --binary-dir target/debug

  parser-fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load pinned tool versions
        run: |
          source scripts/tool-versions
          printf 'RIFFDB_CARGO_FUZZ_VERSION=%s\n' "$RIFFDB_CARGO_FUZZ_VERSION" >> "$GITHUB_ENV"
          printf 'RIFFDB_FUZZ_TOOLCHAIN=%s\n' "$RIFFDB_FUZZ_TOOLCHAIN" >> "$GITHUB_ENV"
          printf 'RIFFDB_CARGO_DENY_VERSION=%s\n' "$RIFFDB_CARGO_DENY_VERSION" >> "$GITHUB_ENV"
          printf 'RIFFDB_CARGO_AUDIT_VERSION=%s\n' "$RIFFDB_CARGO_AUDIT_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install "$RIFFDB_FUZZ_TOOLCHAIN" --profile minimal
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'scripts/tool-versions') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'scripts/tool-versions') }}
      - name: Cache fuzz target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/target
          key: target-fuzz-${{ runner.os }}-${{ env.RIFFDB_FUZZ_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Install pinned fuzz policy tools
        run: |
          cargo install --locked --version "$RIFFDB_CARGO_FUZZ_VERSION" cargo-fuzz
          cargo install --locked --version "$RIFFDB_CARGO_DENY_VERSION" cargo-deny
          cargo install --locked --version "$RIFFDB_CARGO_AUDIT_VERSION" cargo-audit
      - name: Check fuzz dependency policy
        run: |
          cargo deny --manifest-path fuzz/Cargo.toml check --config fuzz/deny.toml
          cargo audit --file fuzz/Cargo.lock
      - name: Run parser fuzz smoke
        run: cargo +"$RIFFDB_FUZZ_TOOLCHAIN" fuzz run contract_parser -- -max_total_time=30
