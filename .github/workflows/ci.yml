name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riffdb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.97.0"
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Clippy target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-clippy-all-${{ hashFiles('Cargo.lock') }}
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache test target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-test-all-${{ hashFiles('Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache documentation target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: target-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ env.RUST_TOOLCHAIN }}-docs-${{ hashFiles('Cargo.lock') }}
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-tools-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('scripts/tool-versions') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-tools-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('scripts/tool-versions') }}
      - name: Install pinned policy tools
        run: |
          source scripts/tool-versions
          cargo install --locked --version "$RIFFDB_CARGO_DENY_VERSION" cargo-deny
          cargo install --locked --version "$RIFFDB_CARGO_AUDIT_VERSION" cargo-audit
          cargo install --locked --version "$RIFFDB_CARGO_MACHETE_VERSION" cargo-machete
      - name: Check dependency policy
        run: cargo deny check
      - name: Audit advisories
        run: cargo audit
      - name: Check unused dependencies
        run: cargo machete

  generated:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check generated artifacts
        run: |
          ./scripts/check-generated
          ./crates/riffdb-contract-syntax/generate-language-reference --check

  workspace-policy:
    name: Workspace policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check workspace structure
        run: ./scripts/check-workspace-policy
      - name: Check requirement coverage
        run: ./scripts/check-requirement-coverage

  parser-fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load pinned tool versions
        run: |
          source scripts/tool-versions
          printf 'RIFFDB_CARGO_FUZZ_VERSION=%s\n' "$RIFFDB_CARGO_FUZZ_VERSION" >> "$GITHUB_ENV"
          printf 'RIFFDB_FUZZ_TOOLCHAIN=%s\n' "$RIFFDB_FUZZ_TOOLCHAIN" >> "$GITHUB_ENV"
          printf 'RIFFDB_CARGO_DENY_VERSION=%s\n' "$RIFFDB_CARGO_DENY_VERSION" >> "$GITHUB_ENV"
          printf 'RIFFDB_CARGO_AUDIT_VERSION=%s\n' "$RIFFDB_CARGO_AUDIT_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install "$RIFFDB_FUZZ_TOOLCHAIN" --profile minimal
      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'scripts/tool-versions') }}
      - name: Cache Cargo Git sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: cargo-git-fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'scripts/tool-versions') }}
      - name: Cache fuzz target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/target
          key: target-fuzz-${{ runner.os }}-${{ env.RIFFDB_FUZZ_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Install pinned fuzz policy tools
        run: |
          cargo install --locked --version "$RIFFDB_CARGO_FUZZ_VERSION" cargo-fuzz
          cargo install --locked --version "$RIFFDB_CARGO_DENY_VERSION" cargo-deny
          cargo install --locked --version "$RIFFDB_CARGO_AUDIT_VERSION" cargo-audit
      - name: Check fuzz dependency policy
        run: |
          cargo deny --manifest-path fuzz/Cargo.toml check --config fuzz/deny.toml
          cargo audit --file fuzz/Cargo.lock
      - name: Run parser fuzz smoke
        run: cargo +"$RIFFDB_FUZZ_TOOLCHAIN" fuzz run contract_parser -- -max_total_time=30
