name: Python package

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riffdb-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  SOURCE_DATE_EPOCH: "1735689600"

jobs:
  wheels:
    name: abi3 wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare runner-owned artifact directory
        run: mkdir -p dist
      - name: Build pinned manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.97.0
          target: ${{ matrix.target }}
          manylinux: 2_28
          working-directory: clients/python/runtime
          args: --release --locked --compatibility pypi --out ../../../dist
      - name: Install Python 3.13
        id: py313
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install Python 3.14
        id: py314
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify wheel on both supported interpreters
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          [[ "$(basename "$wheel")" == riffdb_application-0.1.0-cp313-abi3-manylinux_2_28_${{ matrix.arch }}.whl ]]
          "${{ steps.py313.outputs.python-path }}" -m pip install "$wheel"
          "${{ steps.py313.outputs.python-path }}" -c 'import riffdb_application'
          "${{ steps.py314.outputs.python-path }}" -m pip install "$wheel"
          "${{ steps.py314.outputs.python-path }}" -c 'import riffdb_application'
      - name: Build self-contained source distribution
        if: matrix.arch == 'x86_64'
        env:
          PYTHON: ${{ steps.py313.outputs.python-path }}
          RUSTUP_HOME: ${{ runner.temp }}/riffdb-sdist-rustup
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          "${{ steps.py313.outputs.python-path }}" -m pip install maturin==1.14.1
          ./scripts/build-python-sdist dist
      - name: Validate exact platform claims
        run: ./scripts/test-python-platform-matrix
      - name: Write artifact receipt
        run: ./scripts/write-python-artifact-receipt dist
      - name: Upload checked artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riffdb-python-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
