name: Driver distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riffdb-driver-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  SOURCE_DATE_EPOCH: "1735689600"
  RIFFDB_TMP_ROOT: ${{ github.workspace }}/target/wp601-tmp
  RIFFDB_ARRIVAL_TARGET_DIR: ${{ github.workspace }}/target/wp601-arrival

jobs:
  package-arrival:
    name: signed package arrival (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify runner Go toolchain
        shell: bash
        run: |
          go version
          [[ "$(go env GOVERSION)" =~ ^go1\.(2[4-9]|[3-9][0-9])([.].*)?$ ]]
      - name: Build native CLI, server, and driver host
        run: |
          cargo +1.99.1 build --release --locked -p riffdb-cli -p riffdb-driver-host -p riffdb-server --bin riffdb --bin riffdb-driverd --bin riffdbd
          cargo +1.99.1 fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Check current and stale Go package protocol admission
        run: python3 scripts/tests/test_go_package_arrival.py
      - name: Build pinned manylinux Python runtime
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.99.1
          target: ${{ matrix.target }}
          manylinux: 2_28
          working-directory: clients/python/runtime
          args: --release --locked --compatibility pypi --out ../../../target/wp601-python
      - name: Build unsigned distribution
        shell: bash
        run: |
          version="$(jq -r '.release' release/version-topology-v1.json)"
          wheel="$(find target/wp601-python -maxdepth 1 -type f -name "riffdb_application-${version}-*.whl" -print -quit)"
          [[ -n "$wheel" ]]
          ./scripts/build-driver-distributions \
            --output "$GITHUB_WORKSPACE/target/wp601-distribution" \
            --binary-dir "$GITHUB_WORKSPACE/target/release" \
            --python-wheel "$GITHUB_WORKSPACE/$wheel" \
            --target "${{ matrix.target }}"
      - name: Exercise detached signing ceremony
        shell: bash
        run: |
          mkdir -p "$RIFFDB_TMP_ROOT/signing"
          ssh-keygen -q -t ed25519 -N '' -C wp601-ci -f "$RIFFDB_TMP_ROOT/signing/key"
          printf 'wp601-ci namespaces="riffdb-driver-distribution-v1" %s\n' \
            "$(ssh-keygen -y -f "$RIFFDB_TMP_ROOT/signing/key")" \
            >"$RIFFDB_TMP_ROOT/signing/allowed-signers"
          ./scripts/sign-driver-distributions \
            --key "$RIFFDB_TMP_ROOT/signing/key" \
            "$GITHUB_WORKSPACE/target/wp601-distribution"
          ./scripts/verify-driver-distributions \
            --allowed-signers "$RIFFDB_TMP_ROOT/signing/allowed-signers" \
            --identity wp601-ci \
            "$GITHUB_WORKSPACE/target/wp601-distribution"
      - name: Prove clean package arrival
        env:
          RIFFDB_TMP_ROOT: ${{ runner.temp }}/riffdb-wp601-arrival
        run: |
          ./scripts/driver-package-arrival \
            --distribution "$GITHUB_WORKSPACE/target/wp601-distribution" \
            --allowed-signers "$GITHUB_WORKSPACE/target/wp601-tmp/signing/allowed-signers" \
            --identity wp601-ci \
            --receipt "$GITHUB_WORKSPACE/target/wp601-package-arrival.json"
      - name: Prove one package-only four-driver story
        if: matrix.arch == 'x86_64'
        env:
          # Leave room for nested fixture names within the Unix-socket path bound.
          RIFFDB_TMP_ROOT: ${{ runner.temp }}/r604
          RUSTUP_HOME: ${{ runner.temp }}/riffdb-conformance-rustup
          RIFFDB_PACKAGE_CONFORMANCE_DISTRIBUTION: ${{ github.workspace }}/target/wp601-distribution
          RIFFDB_PACKAGE_CONFORMANCE_ALLOWED_SIGNERS: ${{ github.workspace }}/target/wp601-tmp/signing/allowed-signers
          RIFFDB_PACKAGE_CONFORMANCE_IDENTITY: wp601-ci
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install uv==0.12.14
          npm ci --prefix clients/typescript/runtime --ignore-scripts
          ./scripts/check-driver-package-matrix
          ./scripts/driver-package-conformance-acceptance
          wheel="$(find target/wp601-python -maxdepth 1 -type f -name 'riffdb_application-*.whl' -print -quit)"
          [[ -n "$wheel" ]]
          ./scripts/rehearse-multi-db-candidate \
            --binary-dir "$GITHUB_WORKSPACE/target/release" \
            --python-wheel "$GITHUB_WORKSPACE/$wheel"
      - name: Upload checked distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-driver-distribution-${{ matrix.arch }}
          path: |
            target/wp601-distribution/**
            target/wp601-package-arrival.json
          if-no-files-found: error
